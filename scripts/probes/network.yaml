apiVersion: v1
kind: Namespace
metadata:
  name: dockyard-proof
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: dockyard-proof
  labels:
    app: server
spec:
  containers:
    - name: http
      image: busybox:1.37
      command: [sh, -c, "mkdir -p /www; echo dockyard-network-proof > /www/index.html; httpd -f -p 8080 -h /www"]
      readinessProbe:
        httpGet:
          path: /
          port: 8080
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: dockyard-proof
  labels:
    app: client
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: [sleep, '3600']
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
