[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dockyard-learn"
version = "0.2.0"
description = "A local Docker and Kubernetes learning workbench with real terminal labs."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "cryptography>=46,<50",
]

[project.scripts]
dockyard = "dockyard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6,<7",
  "httpx2>=2.13.1",
]

[tool.hatch.build]
artifacts = ["src/dockyard/static/**"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/dockyard", "/frontend", "/scripts", "/tests", "/docs",
  "/AGENTS.md", "/dockyard", "/dockyard.ps1", "/pyproject.toml",
  "/uv.lock", "/README.md", "/.gitignore", "/.gitattributes",
]
exclude = ["/frontend/node_modules", "/frontend/*.tsbuildinfo", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/dockyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires owned Docker or Kubernetes resources"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/dockyard/content"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dockyard"]
exclude = ["src/dockyard/content/"]
