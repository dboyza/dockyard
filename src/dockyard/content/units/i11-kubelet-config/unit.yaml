id: i11-kubelet-config
revision: 1
module: 23
order: 90
title: A worker goes NotReady after a kubelet settings change
summary: After someone edits the worker’s kubelet settings, the node stops reporting Ready.
kind: incident
runtime: linux
nodes: 2
minutes: 50
outcomes:
- Tell a failed node agent apart from a failed control plane.
- Find a kubelet configuration error in its journal and fix it.
- Recover the same node without deleting or rejoining it.
prerequisites:
- m23-mission
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The API works and old containers run, but the worker is NotReady. What should be inspected
    first?
  options:
  - The worker kubelet service journal and configuration.
  - The image registry password.
  - A replacement cluster installation.
  correct: 0
  explanation: Node readiness depends on kubelet reports; existing containers can outlive a node-agent
    failure.
hints:
- 'Compare kubectl get nodes with kubectl get --raw=/readyz: which part is unhealthy?'
- Inside the worker VM, read systemctl status kubelet and sudo journalctl -u kubelet -n 30; the log names
  the setting it cannot read.
- Give shutdownGracePeriod in /var/lib/kubelet/config.yaml a valid duration such as 0s, restart the kubelet,
  and wait for the node and Dispatch to recover.
sources:
- https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.native_incident
  - kubelet
  timeout: 240
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - kubelet
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the incident is missing or was replaced, or the database is not running,
    so the stored row could not be read. Repair the existing worker instead of deleting, resetting, or
    rejoining it; if that already happened, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node, the kubelet service must be active. Containers for etcd, the
    API server, the controller manager, and the scheduler must be running. The API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - kubelet
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM, check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a. Read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - kubelet
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node, and that its manifest is in /etc/kubernetes/manifests. If
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - kubelet
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Wait for the worker to be Ready, then check kubectl rollout status
    for the database, API, and workers, and read kubectl logs deployment/worker.
- id: incident-recovered
  title: The original worker is Ready with a running kubelet
  explanation: The worker’s kubelet service must be active, and both original nodes must report Ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - kubelet
    timeout: 240
  expectation: json
  json_path:
  - incident
  expected: 'true'
  diagnostic: The worker is not Ready yet. Inside the worker VM, read sudo journalctl -u kubelet -n 30
    for the setting it cannot parse. Fix that value in /var/lib/kubelet/config.yaml. Then run sudo systemctl
    restart kubelet and watch kubectl get nodes.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any editor is accepted, as long as the same node recovers.
- The node’s status and a new job are checked, not your shell history.
failure_modes:
- A node can report Ready shortly before its application Pods have restarted.
- Resetting or rejoining a node discards it without fixing the setting.
starter_failure_checks:
- incident-recovered
