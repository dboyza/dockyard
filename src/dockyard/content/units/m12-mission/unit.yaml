id: m12-mission
revision: 1
module: 12
order: 4
title: 'Mission: a safe release'
summary: Fix the stable release, its probes and update settings, then preview a candidate beside it.
kind: mission
runtime: kubernetes
minutes: 65
outcomes:
- Fix several release problems one at a time using evidence.
- Check stable and candidate routing without risking the stable release.
- Write promotion, rollback, and data recovery steps.
prerequisites:
- m12-strategies
objectives:
- kubernetes.releases
- kubernetes.reliability
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A candidate writes data the stable version cannot read. Is sending traffic back to stable
    enough?
  options:
  - No. Rolling back the image does not undo data changes.
  - Yes. Service selectors restore the database.
  - Yes. Readiness guarantees compatibility.
  correct: 0
  explanation: Releases must plan for data compatibility and a tested restore, because traffic switches
    cannot rewrite data.
hints:
- Fix the stable image and its probes before touching the candidate.
- Use the three probe paths, maxUnavailable 0 with maxSurge 1, and a preview selector of track=canary.
- Check both releases through their Services, run the termination proof, and write the rollback and data
  recovery steps.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: release-available
  title: Two stable copies serve release 1
  explanation: The dispatch Deployment must have two available Pods, each answering with release dispatch-release-1.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The stable Deployment does not have two healthy copies of release 1. Run kubectl get pods
    -l app=dispatch,track=stable and kubectl describe pod on any that are not ready. ErrImageNeverPull
    or ImagePullBackOff means the image name is wrong; frequent RESTARTS usually mean a probe problem.
- id: release-probes
  title: Each probe checks the right thing
  explanation: The API needs startup on /startupz with at least 30 seconds of budget, liveness on /healthz,
    readiness on /readyz, a grace period of 20 seconds or more, and both Pods started and ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - probes
  expected: 'true'
  diagnostic: 'The probes are not set up as required. Check the api container: startupProbe path /startupz
    with periodSeconds × failureThreshold of at least 30, livenessProbe /healthz, readinessProbe /readyz,
    all on port 8080, and terminationGracePeriodSeconds of at least 20.'
- id: release-rollout
  title: Updates keep full capacity
  explanation: The rolling update must allow no unavailable Pods and one extra Pod, so two copies keep
    serving throughout an update.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - rollout
  expected: 'true'
  diagnostic: 'The rolling update settings are not right. Under spec.strategy.rollingUpdate, set maxUnavailable:
    0 and maxSurge: 1, then apply.'
- id: release-termination
  title: Dispatch shuts down cleanly on SIGTERM
  explanation: The termination-proof Pod must receive SIGTERM, log it, and exit with code 0.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - termination
  expected: 'true'
  diagnostic: The termination proof has not shown a clean exit yet. Run python termination-proof.py after
    the API is healthy, then kubectl logs termination-proof and kubectl get pod termination-proof. Its
    exit code should be 0.
- id: release-canary
  title: Stable and canary Pods share the main Service
  explanation: One canary Pod must serve dispatch-release-2, and the main dispatch Service must reach
    all three Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - canary
  expected: 'true'
  diagnostic: The canary is not running alongside the stable Pods. Check kubectl get deployment dispatch-canary
    (it needs one ready replica) and kubectl get endpointslices -l kubernetes.io/service-name=dispatch
    (it needs three addresses). The main Service should select only app=dispatch.
- id: release-preview
  title: The preview Service reaches only the canary
  explanation: dispatch-preview must have exactly the canary Pod as its endpoint and return dispatch-release-2.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - preview
  expected: 'true'
  diagnostic: 'dispatch-preview does not reach only the canary. Check its selector with kubectl get service
    dispatch-preview -o yaml: it should select track=canary, and kubectl get endpointslices -l kubernetes.io/service-name=dispatch-preview
    should list one address.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and rollout commands are accepted when actual stable/candidate responses, availability
  settings, and the requested process behavior are verified.
failure_modes:
- Readiness is not liveness; restarting on a dependency outage can worsen the incident.
- A Service selecting multiple tracks does not guarantee an exact request percentage.
- A rollback of a Pod template does not undo database migrations.
starter_failure_checks:
- release-available
- release-rollout
- release-canary
- release-preview
