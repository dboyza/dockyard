id: m12-mission
revision: 1
module: 12
order: 4
title: Ship and recover a safe application release
summary: 'Capstone: repair availability, process health, and a controlled candidate rollout.'
kind: mission
runtime: kubernetes
minutes: 65
outcomes:
- Repair compound rollout and probe faults using observed evidence.
- Verify stable and candidate routing without sacrificing the known release.
- Document release, abort, rollback, and data-recovery boundaries.
prerequisites:
- m12-strategies
objectives:
- kubernetes.releases
- kubernetes.reliability
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A candidate serves healthy HTTP responses but writes data incompatible with the stable version.
    Is switching traffic back sufficient recovery?
  options:
  - No; application rollback cannot automatically reverse incompatible data changes.
  - Yes; Service selectors restore all database state.
  - Yes; readiness guarantees schema compatibility.
  correct: 0
  explanation: Release planning must account for state compatibility and independently verified recovery.
hints:
- Recover stable image and health behavior before expanding candidate traffic.
- Use the three distinct probe paths, a zero-unavailable rolling budget, and a candidate-only preview
  selector.
- Verify both release identities, run the termination proof, and write the rollback and data-recovery
  boundaries explicitly.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: release-available
  title: Two stable replicas serve the expected healthy release
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: Inspect rollout status, Pod events, image names, and the live /healthz response.
- id: release-probes
  title: Startup, liveness, and readiness have distinct working contracts
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - probes
  expected: 'true'
  diagnostic: Use /startupz for startup, /healthz for liveness, and /readyz for dependency-aware readiness.
- id: release-rollout
  title: Rolling updates preserve available capacity
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - rollout
  expected: 'true'
  diagnostic: Keep two replicas and configure maxUnavailable 0 with maxSurge 1.
- id: release-termination
  title: The supplied application handles SIGTERM and exits cleanly
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - termination
  expected: 'true'
  diagnostic: Run termination-proof.py and inspect the completed proof Pod and its termination log.
- id: release-canary
  title: Stable and candidate Pods coexist behind the shared Service
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - canary
  expected: 'true'
  diagnostic: Start one candidate replica, keep two stable replicas, and let the primary Service select
    both tracks.
- id: release-preview
  title: The preview Service reaches only the candidate release
  explanation: Compare controller state, process behavior, and actual release responses.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - preview
  expected: 'true'
  diagnostic: Select track=canary for dispatch-preview and verify release dispatch-release-2.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and rollout commands are accepted when actual stable/candidate responses, availability
  settings, and the requested process behavior are verified.
failure_modes:
- Readiness is not liveness; restarting on a dependency outage can worsen the incident.
- A Service selecting multiple tracks does not guarantee an exact request percentage.
- A rollback of a Pod template does not undo database migrations.
starter_failure_checks:
- release-available
- release-rollout
- release-canary
- release-preview
