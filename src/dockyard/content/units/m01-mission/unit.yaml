id: m01-mission
revision: 1
module: 1
order: 4
title: 'Mission: restore the first Dispatch service'
summary: Find out why Dispatch stopped, then repair it so it can answer requests.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Use a container’s command and logs to explain why it stopped.
- Replace the broken container using this lab’s name, label, and local port.
- Check that the repaired application answers requests.
prerequisites:
- m01-signals
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The deployment command exits zero but the API is unreachable. What is the strongest next observation?
  options:
  - Inspect the container command, state, and logs.
  - Assume the network must be broken.
  - Delete every stopped container.
  correct: 0
  explanation: A successful exit only describes that process. Inspect what it was asked to do before choosing a
    repair.
hints:
- Inspect the actual command rather than assuming app.py was started.
- Container configuration is immutable in the relevant fields; replace only the assigned broken instance.
- Remove "$DOCKYARD_CONTAINER", then use the earlier application command with the assigned label, mount, working
  directory, and loopback port.
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - run
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{python_image}}'
  - python
  - -c
  - print("Deployment command completed")
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the port mapping with docker port "$DOCKYARD_CONTAINER". It should start with 127.0.0.1,
    not 0.0.0.0. If the binding is wrong, recreate only this lab's container using
    -p "127.0.0.1:$DOCKYARD_PORT:8080".
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- process-running
- application-response
- published-port
- loopback-binding
