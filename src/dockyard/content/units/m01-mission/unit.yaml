id: m01-mission
revision: 2
module: 1
order: 4
title: 'Mission: restore the first Dispatch service'
summary: Find out why Dispatch stopped, then repair it so it can answer requests.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Use a container’s command and logs to explain why it stopped.
- Replace the broken container using this lab’s name, label, and local port.
- Check that the repaired application answers requests.
prerequisites:
- m01-signals
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The deployment command exits zero but the API is unreachable. What is the strongest next observation?
  options:
  - Inspect the container command, state, and logs.
  - Assume the network must be broken.
  - Delete every stopped container.
  correct: 0
  explanation: A successful exit only describes that process. Inspect what it was asked to do before choosing
    a repair.
hints:
- 'Look at what the broken container actually ran: docker inspect --format ''{{json .Config.Cmd}}'' "$DOCKYARD_CONTAINER",
  then read its logs. Copy that command into finding.txt before you remove anything.'
- A container’s command cannot be changed after it is created, so you need a replacement container with
  the same name. Remove the old one first.
- 'Remove "$DOCKYARD_CONTAINER", then start Dispatch with the full docker run command from the first lesson:
  label, port mapping, folder mount, working directory, and python app.py.'
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - run
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{python_image}}'
  - python
  - -c
  - print("Deployment check {{lab_id}} completed")
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: diagnosis-recorded
  title: finding.txt records the command the broken container ran
  explanation: The broken container ran a one-shot command that is different in every lab. Its exact text
    is only visible by inspecting that container, so this records that you looked before replacing it.
  command:
    args:
    - cat
    - finding.txt
  expectation: matches
  expected: print\(\\?"Deployment check {{lab_id}} completed\\?"\)
  diagnostic: finding.txt does not contain the exact command the broken container ran. Its log line is
    only the command's output; the command itself is in docker inspect --format '{{json .Config.Cmd}}'
    "$DOCKYARD_CONTAINER". Copy the python -c program from there into finding.txt.
  cases:
  - observed: No such file or directory
    diagnostic: There is no finding.txt in the workspace yet. Before you replace the broken container,
      run docker inspect --format '{{json .Config.Cmd}}' "$DOCKYARD_CONTAINER" and save the command it
      shows in finding.txt. If you have already removed that container, Reset restores it; record the
      command first this time.
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- process-running
- application-response
- published-port
- loopback-binding
- diagnosis-recorded
