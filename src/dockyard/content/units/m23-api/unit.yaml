id: m23-api
revision: 1
module: 23
order: 3
title: Troubleshoot an API server that will not start
summary: Use crictl and container logs on the node to fix an API server that cannot reach etcd.
kind: lesson
runtime: linux
nodes: 2
minutes: 45
outcomes:
- Explain why kubectl cannot diagnose a broken API server.
- Read a failed control-plane container’s log with crictl.
- Tell apart connection, certificate, and permission errors, and fix only what the evidence shows.
prerequisites:
- m23-static-pods
objectives:
- cka.components
- cka.nodes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: 'The API server’s log says it cannot connect to etcd: connection refused. What is most likely?'
  options:
  - It is using the wrong address or port, or etcd is not running.
  - Its certificates have expired.
  - Your kubectl user lacks permission.
  correct: 0
  explanation: Connection refused means nothing answered at that address and port. Certificate problems
    mention x509, and permission problems happen only after a connection works.
hints:
- Inside the control-plane VM, run sudo crictl ps -a --name kube-apiserver and read the newest container’s
  log with sudo crictl logs.
- Compare --etcd-servers in kube-apiserver.yaml with --listen-client-urls in etcd.yaml, and check open
  ports with sudo ss -lntp.
- Change --etcd-servers to https://127.0.0.1:2379 in /etc/kubernetes/manifests/kube-apiserver.yaml, leave
  the certificate flags alone, and run python wait-control-plane.py.
sources:
- https://etcd.io/docs/v3.6/op-guide/recovery/
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/static-pod/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.recovery
  - api
  timeout: 180
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - api
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced, or the database is not running,
    so the stored row could not be read. A ConfigMap recreated from YAML has a new UID and does not count;
    bring back the original from the etcd snapshot. If nodes or the cluster were rebuilt, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node, the kubelet service must be active. Containers for etcd, the
    API server, the controller manager, and the scheduler must be running. The API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - api
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM, check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a. Read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - api
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node, and that its manifest is in /etc/kubernetes/manifests. If
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - api
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Get the control plane healthy first, then run sh bootstrap.sh to
    wait for Dispatch to recover and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any editor is accepted, as long as certificate checking stays in place.
- The running control plane and a new scheduling decision are checked, not your shell history.
failure_modes:
- An open port does not show the API server is ready.
- Turning off certificate checks or rebuilding the cluster hides the real fault.
starter_failure_checks:
- recovery-components
- recovery-scheduled
