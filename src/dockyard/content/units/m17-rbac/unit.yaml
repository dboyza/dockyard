id: m17-rbac
revision: 1
module: 17
order: 1
title: Limit a workload API identity
summary: Let a practice workload read Pods while keeping Secrets and other namespaces out of reach.
kind: lesson
runtime: kubernetes
nodes: 2
minutes: 45
outcomes:
- Give the reader only the operations it needs in the intended namespace.
- Tell a permission refusal apart from a failed network connection.
prerequisites:
- m16-mission
objectives:
- kubernetes.rbac
- kubernetes.networkpolicy
- kubernetes.security
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A token-authenticated Secret request returns HTTP 403. What does that establish?
  options:
  - The API denied the requested operation for that identity.
  - The API could not be reached over the network.
  - The token grants no permissions on any resource.
  correct: 0
  explanation: A denial is specific to the requested operation and scope; test the required allowed operation
    separately.
hints:
- Compare the Role’s rules with what the inventory Pod actually needs to do.
- Pod reads need get, list, and watch on pods; nothing in the task needs secrets.
- Remove secrets from the Role’s resources, apply identity.yaml, and check with kubectl auth can-i --as.
sources:
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://kubernetes.io/docs/concepts/services-networking/network-policies/
- https://kubernetes.io/docs/concepts/security/pod-security-standards/
- https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: security-rbac
  title: The reader can list Pods and nothing more
  explanation: Using its own token, dispatch-reader must list Pods in dispatch, be refused Secrets and
    kube-system, and be unable to create Pods, patch Deployments, or create RoleBindings.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - rbac
  expected: 'true'
  diagnostic: 'The reader has too little or too much access. Run kubectl auth can-i --list --as=system:serviceaccount:dispatch:dispatch-reader
    -n dispatch and compare with the Role in identity.yaml: it should only get, list, and watch pods.'
- id: security-tokens
  title: The API and worker have no API token
  explanation: The API and worker never call the Kubernetes API, so they must run without an automatically
    mounted ServiceAccount token.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - tokens
  expected: 'true'
  diagnostic: 'The API or worker still has a ServiceAccount token. Check both use serviceAccountName dispatch-app
    with automountServiceAccountToken: false, then roll them out again.'
- id: security-workflow
  title: A job from the trusted frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the trusted frontend did not complete. Check the API and workers can reach PostgreSQL
    and Redis on their exact ports, that DNS works, and read kubectl logs deployment/worker.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-security-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent additive policy organization and YAML formatting are accepted when the actual allowed and
  denied paths agree.
- A different non-root API UID is accepted when process restrictions and application behavior remain correct.
failure_modes:
- Separate peer items broaden selectors from an intersection to alternatives.
- UDP-only DNS can fail when a TCP query is needed.
- Changing admission policy does not repair existing Pods.
starter_failure_checks:
- security-rbac
