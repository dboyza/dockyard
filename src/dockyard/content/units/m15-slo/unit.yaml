id: m15-slo
revision: 1
module: 15
order: 3
title: Service level objectives
summary: Define what a good read is, measure it honestly, fix a slowdown, and measure again.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Explain SLIs, SLOs, and error budgets.
- Measure the fraction of good reads without hiding bad ones.
- Say what a small measured sample can and cannot show.
prerequisites:
- m15-alerts
objectives:
- kubernetes.observability
- platform.reliability
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: 190 of 200 eligible reads were fast and correct. What is the good fraction?
  options:
  - 95%, with ten bad reads.
  - 100%, because every read got a response.
  - 5%, because the budget is 5%.
  correct: 0
  explanation: 'Good events divided by all eligible events: 190 / 200 = 95%.'
hints:
- Run python measure-slo.py before and look at each read’s elapsed time.
- The delay comes from delay_ms in settings.yaml.
- Set delay_ms to 20, apply settings.yaml, restart the API, wait for the rollout, then run python measure-slo.py
  after.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/
- https://prometheus.io/docs/concepts/metric_types/
- https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
- https://prometheus.io/docs/practices/histograms/
- https://sre.google/sre-book/service-level-objectives/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: visibility-signals
  title: A real request has a matching log line
  explanation: Dockyard sends a GET /jobs with its own request ID and finds exactly one http_request log
    line for it, with status 200.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - visibility
    timeout: 150
  expectation: json
  json_path:
  - signals
  expected: 'true'
  diagnostic: No matching http_request log line was found for Dockyard’s request. Check the API Pods are
    ready with kubectl get pods -l app=dispatch, and read kubectl logs -l app=dispatch -c api --tail=20.
- id: visibility-scraping
  title: Prometheus scrapes both API Pods
  explanation: Every API Pod must be an up target in the dispatch job, with its own pod label on the request
    counters.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - visibility
    timeout: 150
  expectation: json
  json_path:
  - scraping
  expected: 'true'
  diagnostic: 'Prometheus is not scraping every API Pod. Open the targets page or check the relabel rules
    in prometheus.yaml: the container port name rule must match the Deployment’s port name, http. Run
    sh monitoring.sh after each change so Prometheus reloads it.'
- id: visibility-slo
  title: Before and after measurements show the fix
  explanation: slo-before.json must be below 95% good and slo-after.json at or above it, measured in that
    order, with the 95% / 250 ms policy unchanged, delay_ms at 20, and a fresh read fast enough now.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - visibility
    timeout: 150
  expectation: json
  json_path:
  - slo
  expected: 'true'
  diagnostic: The SLO evidence does not show the fix yet. Run python measure-slo.py before while the service
    is still slow, fix delay_ms, restart the API and wait for the rollout, then run python measure-slo.py
    after. Keep slo.json at objective 0.95 and latency_seconds 0.25.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-observability-v1
images:
- python
- postgres
- redis
- busybox
- prometheus
alternatives:
- Equivalent PromQL formulations are accepted when the live dashboard and alert observe the required slow
  and recovered service behavior.
- The SLO evidence must retain all eligible reads, its original threshold, and its explicit sample scope.
failure_modes:
- A healthy readiness endpoint can coexist with slow business requests.
- Missing measurements are not successful requests or zero latency.
- A constant alert expression can suppress all useful detection.
starter_failure_checks:
- visibility-slo
