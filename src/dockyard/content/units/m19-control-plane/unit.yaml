id: m19-control-plane
revision: 2
module: 19
order: 3
title: Troubleshoot kubectl access and the control plane
summary: Fix a broken kubeconfig inside the control-plane VM, and check the control plane’s certificates
  and static Pods.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Tell connection, certificate, authentication, and permission errors apart.
- Inspect control-plane static Pods and certificates on the node.
- Fix a kubeconfig without weakening its security.
prerequisites:
- m19-kubelet
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A guest client gets connection refused, while the host client lists nodes. What should you
    compare first?
  options:
  - The failing client endpoint and the actual API listener.
  - The database schema.
  - The image build cache.
  correct: 0
  explanation: A working independent client narrows the problem to the failing access path before suggesting
    control-plane replacement.
hints:
- Read the exact error from the operator client, and see which server address it uses.
- Compare that address with the server in /etc/kubernetes/admin.conf.
- Correct the server address in operator.conf, keep certificate checks on, and run chmod 600 on it.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - certificates
  timeout: 90
checks:
- id: native-operator
  title: The operator client inside the control plane works securely
  explanation: $HOME/.kube/operator.conf in the control-plane VM must list both nodes against the real
    API server with certificate checks on, be mode 600, and all four control-plane static Pods must be
    running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - operator
  expected: 'true'
  diagnostic: The operator client still fails or is not private. Read its error category, compare its
    server address with the one in /etc/kubernetes/admin.conf, keep certificate checks on, and set chmod
    600 on the file.
- id: native-workflow
  title: A job from the frontend completes on the native cluster
  explanation: A real job submitted from the frontend must be completed by a worker and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check kubectl get pods for anything not ready, then read kubectl
    logs deployment/worker. If a node is NotReady, fix that first.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-operator
