id: m19-control-plane
revision: 2
module: 19
order: 3
title: Separate client access from control-plane health
summary: Inspect TLS trust and static components while repairing a separate guest operator client.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Distinguish connection, certificate trust, authentication, and authorization failures.
- Inspect kubeadm static components through CRI.
- Restore a private guest operator client without modifying the managed host kubeconfig.
prerequisites:
- m19-kubelet
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A guest client gets connection refused, while the host client lists nodes. What should you
    compare first?
  options:
  - The failing client endpoint and the actual API listener.
  - The database schema.
  - The image build cache.
  correct: 0
  explanation: A working independent client narrows the problem to the failing access path before suggesting
    control-plane replacement.
hints:
- Separate the host API client, guest operator client, node agent, and runtime client.
- Compare actual endpoint paths, systemd service state, lease renewal, and certificate trust before restarting
  components.
- The reference boundaries are the containerd Unix socket, active kubelet services, and the working private
  administrative client supplied by kubeadm.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - certificates
  timeout: 90
checks:
- id: native-operator
  title: The private guest client reaches a certificate-backed control plane
  explanation: Compare live Linux and Kubernetes observations with the required outcome.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - operator
  expected: 'true'
  diagnostic: Compare the guest client endpoint, private permissions, certificate trust, and static containers.
- id: native-workflow
  title: A fresh frontend job is completed and persisted by the native worker
  explanation: Compare live Linux and Kubernetes observations with the required outcome.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Trace the frontend, Service, API, queue, worker, and persisted database result.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-operator
