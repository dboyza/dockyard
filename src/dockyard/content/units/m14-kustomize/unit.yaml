id: m14-kustomize
revision: 1
module: 14
order: 1
title: Environment overlays with Kustomize
summary: Fix a development overlay that changes a shared base, and check the running result.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Write a kustomization with resources, namespace, replicas, and patches.
- Render an overlay before applying it.
- Check that a configuration change reached the running application.
prerequisites:
- m13-mission
objectives:
- kubernetes.packaging
- kubernetes.extensions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: An overlay changes a ConfigMap value that Dispatch reads as an environment variable. What
    makes Dispatch use it?
  options:
  - Restarting the Pods so the containers start with the new value.
  - Rendering the overlay again.
  - Running kubectl get configmap.
  correct: 0
  explanation: Environment variables are read when a container starts, so the Pods must be replaced.
hints:
- Run kubectl kustomize kustomize/overlays/development and look at the dispatch replicas and the ConfigMap’s
  environment.
- In the development kustomization.yaml, the replicas count should be 2 and the patch value development.
- Apply with kubectl kustomize ... | python render.py - | kubectl apply -f -, then kubectl rollout restart
  deployment/dispatch.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://helm.sh/docs/intro/using_helm/
- https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
- https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: packaging-overlay
  title: The development overlay and the running app agree
  explanation: The rendered development overlay must give Dispatch two replicas and environment development
    in namespace dispatch, and the running Pods must report that environment.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - overlay
  expected: 'true'
  diagnostic: Development does not match yet. Run kubectl kustomize kustomize/overlays/development and
    check the dispatch replicas (2) and the ConfigMap environment (development). Apply it, then run kubectl
    rollout restart deployment/dispatch so the Pods pick up the new environment value.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-packaging-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent overlay patches and chart formatting are accepted when rendered and live values agree.
- The managed workload must retain the real WorkerPool UID ownership and process work after the recorded
  drift rehearsal.
failure_modes:
- Rendering a resource does not deploy it.
- A deployed Helm release can still declare an unavailable application.
- A CRD alone does not implement a reconciliation loop.
starter_failure_checks:
- packaging-overlay
