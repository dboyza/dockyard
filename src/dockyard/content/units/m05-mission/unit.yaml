id: m05-mission
revision: 1
module: 5
order: 4
title: 'Mission: operate the complete Dispatch stack'
summary: Deliver the four-role application with durable data, readiness gates, and independent workers.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Combine service configuration, network isolation, storage, and readiness.
- Run an interchangeable worker role with multiple replicas.
- Prove end-to-end processing through direct database evidence.
prerequisites:
- m05-scaling
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which observation best proves the whole background workflow?
  options:
  - A fresh job is completed by an actual worker and stored in PostgreSQL.
  - The API container is merely running.
  - A Compose file contains four service names.
  correct: 0
  explanation: Configuration and process existence are useful evidence, but the application contract requires actual
    completed work and durable state.
hints:
- Model each role and its dependencies before adding replica count and startup gates.
- "Keep database and queue internal, label every resource, and mount the named volume at PostgreSQL\u2019s data\
  \ path."
- Apply the complete model with --scale worker=2 --wait, then follow a new job through the API, worker logs, and
  database.
sources:
- https://docs.docker.com/compose/intro/compose-application-model/
- https://docs.docker.com/reference/compose-file/services/
starter: {}
reference: {}
prepare: []
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: compose-owned
  title: Every observed service belongs to this lab
  explanation: Correlate actual service identities with a fresh submitted job and a direct database read.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: Use docker compose ps, logs, and exec to follow the API, dependency, and worker path. A healthy API
    alone does not prove background processing.
- id: compose-ready
