id: m05-mission
revision: 1
module: 5
order: 4
title: 'Mission: run the complete Dispatch project'
summary: Write the whole Compose project yourself, with health checks, saved data, and two workers.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Combine services, networking, storage, and health checks in one Compose file.
- Run two copies of the worker.
- Confirm a new job is finished by a worker and saved in PostgreSQL.
prerequisites:
- m05-scaling
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What best shows the whole background workflow works?
  options:
  - A new job is finished by a worker and its result is saved in PostgreSQL.
  - The API container is running.
  - The Compose file lists four services.
  correct: 0
  explanation: Running containers and a tidy file are good signs, but users need their jobs finished and
    saved.
hints:
- List each service and what it depends on before you write the file.
- Keep db and queue without ports, label everything, and mount the volume only into db.
- Start it with docker compose up -d --scale worker=2 --wait, then follow a new job through the API, worker
  logs, and database.
sources:
- https://docs.docker.com/compose/intro/compose-application-model/
- https://docs.docker.com/reference/compose-file/services/
starter: {}
reference: {}
prepare: []
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: compose-owned
  title: Every running service belongs to this lab
  explanation: Every Dispatch container must carry this lab's label so Dockyard can recognize and clean
    them up.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: 'At least one service container is missing the io.dockyard.lab label. Run docker compose
    ps, then docker inspect a container to check its labels. Add labels: io.dockyard.lab: ${DOCKYARD_LAB}
    under every service, then run docker compose up -d so Compose recreates them.'
- id: compose-ready
  title: The API can reach PostgreSQL and Redis
  explanation: The API's /readyz endpoint checks its own connections to PostgreSQL and Redis, so this
    confirms the API can use both.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - ready
  expected: 'true'
  diagnostic: The API reports it cannot use PostgreSQL or Redis. Request http://127.0.0.1:$DOCKYARD_PORT/readyz
    to see which one, then read docker compose logs api. Check the API's DB_HOST, DB_PASSWORD, and REDIS_URL
    settings against the service names db and queue, and confirm all services share one network.
- id: compose-private
  title: Only the API publishes a host endpoint
  explanation: Only the API should be reachable from your computer; the database, queue, and workers talk
    over the internal network.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - private
  expected: 'true'
  diagnostic: 'A database, queue, or worker container publishes a host port. Run docker compose ps and
    look at the PORTS column. Remove the ports: section from every service except api.'
- id: compose-persistent
  title: PostgreSQL uses the assigned owned volume
  explanation: PostgreSQL's data must live in the named volume assigned to this lab so it survives container
    replacement.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - persistent
  expected: 'true'
  diagnostic: 'PostgreSQL is not using the assigned volume at /var/lib/postgresql/data, or that volume
    lacks the lab label. Check the top-level volumes: entry has name: ${DOCKYARD_VOLUME} and labels, and
    that the db service mounts it at /var/lib/postgresql/data.'
- id: compose-processed
  title: A real worker completes a newly submitted job
  explanation: Dockyard submits a fresh job and waits for a running worker to finish it. That is the result
    a Dispatch user actually cares about.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - processed
  expected: 'true'
  diagnostic: 'A new job was not completed by a worker within 15 seconds. Run docker compose ps worker
    to check a worker is running, then docker compose logs worker for connection errors. The worker needs
    the same database and Redis settings as the API, and command: [python, worker.py].'
- id: compose-durable
  title: PostgreSQL independently contains the completed result
  explanation: Dockyard reads the completed result directly from PostgreSQL, confirming the worker saved
    it rather than only reporting it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: The completed result was not found in PostgreSQL's dispatch database. Check docker compose
    logs worker and db for errors, and make sure the API and workers use DB_NAME dispatch.
- id: compose-healthy
  title: The API, database, and queue report healthy
  explanation: Health checks let Docker test whether each service can do its job, not just whether its
    process is running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - healthy
  expected: 'true'
  diagnostic: 'The API, db, or queue container has no health check, or it is not currently healthy. Run
    docker compose ps and look for (healthy) in the STATUS column. For a missing one, add a healthcheck:
    to that service; for an unhealthy one, run docker inspect --format ''{{json .State.Health}}'' on the
    container to read its recent check output.'
- id: compose-guarded
  title: The API and workers wait for a healthy database and queue
  explanation: 'depends_on with condition: service_healthy stops the API and workers starting before PostgreSQL
    and Redis can accept work.'
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - guarded
  expected: 'true'
  diagnostic: 'The api or worker service does not wait for both db and queue to be healthy. In compose.yaml,
    give each of them depends_on: entries for db and queue with condition: service_healthy. Run docker
    compose config --quiet to check the file is still valid.'
- id: compose-scaled
  title: At least two workers are running
  explanation: Several workers can share the queue, so more jobs finish at the same time.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - scaled
  expected: 'true'
  diagnostic: Fewer than two worker containers are running for this lab. Run docker compose up -d --scale
    worker=2, then docker compose ps worker. If scaling fails, check that the worker service has no container_name,
    because two containers cannot share one name.
capabilities:
- docker
- compose
- postgres-image
- redis-image
checkpoint: dispatch-compose-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
images:
- python
- postgres
- redis
starter_failure_checks:
- process-running
- lab-identity
- application-response
- published-port
- loopback-binding
- compose-owned
- compose-ready
- compose-private
- compose-persistent
- compose-processed
- compose-durable
- compose-healthy
- compose-guarded
- compose-scaled
