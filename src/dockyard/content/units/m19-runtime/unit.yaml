id: m19-runtime
revision: 2
module: 19
order: 1
title: The container runtime and crictl
summary: Fix crictl on a real node and follow a Dispatch container to its Linux process.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Explain the difference between kubectl, crictl, and ctr.
- Use crictl to find a container and its process.
- Read a process’s cgroup to see how Linux tracks it.
prerequisites:
- m18-mission
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: '`crictl` fails to connect, but the API reports Ready nodes and Dispatch still serves jobs.
    Which conclusion is justified?'
  options:
  - The diagnostic client can be broken independently of the running workload.
  - All containers have stopped.
  - The image is corrupt.
  correct: 0
  explanation: Compare the client endpoint and daemon health before assuming the workload runtime has
    stopped.
hints:
- Inside the worker, compare the endpoint in /etc/crictl.yaml with where containerd’s socket really is.
- containerd listens on unix:///run/containerd/containerd.sock.
- Put that path in /etc/crictl.yaml as the runtime and image endpoint, then run sudo crictl info and sudo
  crictl ps.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - runtime
  timeout: 90
checks:
- id: native-cri
  title: crictl on the worker sees a real Dispatch process
  explanation: On the worker, sudo crictl info must use the normal /etc/crictl.yaml, report RuntimeReady
    with the systemd cgroup driver, and show a running API container whose process is under the systemd
    cgroup tree.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - cri
  expected: 'true'
  diagnostic: crictl on the worker still cannot see the runtime properly. Inside the worker, compare the
    endpoint in /etc/crictl.yaml with unix:///run/containerd/containerd.sock, check systemctl is-active
    containerd, and run sudo crictl info again.
- id: native-workflow
  title: A job from the frontend completes on the native cluster
  explanation: A real job submitted from the frontend must be completed by a worker and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check kubectl get pods for anything not ready, then read kubectl
    logs deployment/worker. If a node is NotReady, fix that first.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-cri
