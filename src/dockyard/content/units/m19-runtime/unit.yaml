id: m19-runtime
revision: 2
module: 19
order: 1
title: Trace a workload from CRI to its Linux cgroup
summary: Locate a runtime-client fault without restarting a healthy workload.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Distinguish the CRI endpoint from the Kubernetes API and containerd low-level client.
- Identify a running Dispatch process through CRI and its actual systemd cgroup.
- Repair runtime inspection while preserving the application.
prerequisites:
- m18-mission
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: '`crictl` fails to connect, but the API reports Ready nodes and Dispatch still serves jobs.
    Which conclusion is justified?'
  options:
  - The diagnostic client can be broken independently of the running workload.
  - All containers have stopped.
  - The image is corrupt.
  correct: 0
  explanation: Compare the client endpoint and daemon health before assuming the workload runtime has
    stopped.
hints:
- Separate the host API client, guest operator client, node agent, and runtime client.
- Compare actual endpoint paths, systemd service state, lease renewal, and certificate trust before restarting
  components.
- The reference boundaries are the containerd Unix socket, active kubelet services, and the working private
  administrative client supplied by kubeadm.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - runtime
  timeout: 90
checks:
- id: native-cri
  title: The worker CRI client observes a real API process in systemd cgroups
  explanation: Compare live Linux and Kubernetes observations with the required outcome.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - cri
  expected: 'true'
  diagnostic: Inspect the guest CRI socket configuration, daemon readiness, and actual API process cgroup.
- id: native-workflow
  title: A fresh frontend job is completed and persisted by the native worker
  explanation: Compare live Linux and Kubernetes observations with the required outcome.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Trace the frontend, Service, API, queue, worker, and persisted database result.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-cri
