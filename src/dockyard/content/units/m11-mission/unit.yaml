id: m11-mission
revision: 1
module: 11
order: 4
title: 'Mission: keep the data and prove recovery'
summary: Fix claim retention and the backup, then prove persistence and an independent restore.
kind: mission
runtime: kubernetes
minutes: 55
outcomes:
- Fix storage and backup settings without harming existing data.
- Show data survives a Pod replacement.
- Show a restore on separate storage has the expected records.
prerequisites:
- m11-backup
objectives:
- kubernetes.storage
- kubernetes.statefulsets
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The data survives a Pod replacement, but no restore has been tested. What is still unproven?
  options:
  - That you could recover if the storage itself was lost.
  - That Pods have UIDs.
  - That Services have names.
  correct: 0
  explanation: Surviving a Pod restart and recovering from lost storage are different guarantees; only
    a tested restore covers the second.
hints:
- Look at the claim retention settings and the dump options before changing or deleting anything.
- Retain claims on scale-down and deletion, and make the dump include data.
- Run storage-proof.py, then backup.sh, then compare both databases’ records and their claims and PVs.
sources:
- https://kubernetes.io/docs/concepts/storage/persistent-volumes/
- https://kubernetes.io/docs/concepts/storage/storage-classes/
- https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- https://www.postgresql.org/docs/17/backup-dump.html
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 240
checks:
- id: storage-claim
  title: The database is using a bound claim
  explanation: PostgreSQL’s data directory must be mounted from a PersistentVolumeClaim that is Bound
    to a real PersistentVolume.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - claim
  expected: 'true'
  diagnostic: 'The database is not using a bound claim yet. Check the database Pod’s volumes (kubectl
    get pod -l app=db -o yaml): the data volume must use persistentVolumeClaim, not emptyDir. Then run
    kubectl get pvc and kubectl describe pvc for its events.'
- id: storage-persistence
  title: A new database Pod reads the original marker
  explanation: After storage-proof.py replaces the database Pod, the new Pod must read the marker the
    old one wrote, and the API must be ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - persistence
  expected: 'true'
  diagnostic: The marker is missing, or it was not written by an earlier Pod. Run python storage-proof.py
    after the database is ready and read its output. If the marker disappears after replacement, the data
    is not on persistent storage.
- id: storage-identity
  title: The StatefulSet keeps its name, Service, and claims
  explanation: The database must run as db-0 from the db StatefulSet with one replica, a headless Service,
    a data-db-0 claim, and Retain for both claim retention settings.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: 'The StatefulSet is not in the expected shape. Check kubectl get statefulset db -o yaml:
    replicas 1, persistentVolumeClaimRetentionPolicy with whenDeleted and whenScaled both Retain, and
    a volumeClaimTemplates entry named data. Its serviceName must be a Service with clusterIP: None.'
- id: storage-restore
  title: A separate database holds the restored records
  explanation: db-restore-0 must contain both recovery records and the proof marker, on a different claim
    and PV from the source.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - restore
  expected: 'true'
  diagnostic: The restore is missing records or the marker. Query recovery_records in db-restore-0; empty
    tables usually mean the dump used --schema-only. Run python storage-proof.py before sh backup.sh so
    the marker is included, and check the two databases use different claims with kubectl get pvc.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-stateful-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and logical backup commands are accepted when the named workload preserves its
  marker across Pod replacement and the recovery target uses a distinct bound claim.
failure_modes:
- A Bound claim that is not mounted by PostgreSQL does not protect database data.
- A schema-only dump cannot restore application records.
- Local node storage does not survive deletion of the entire practice cluster.
starter_failure_checks:
- storage-persistence
- storage-restore
- storage-identity
