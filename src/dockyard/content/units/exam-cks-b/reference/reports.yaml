# The reports team's namespace, as it was handed over.
apiVersion: v1
kind: Namespace
metadata:
  name: reports
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-settings
  namespace: reports
data:
  title: Daily Dispatch summary
---
# The default ServiceAccount no longer hands a token to every Pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: reports
automountServiceAccountToken: false
---
# The builder's own identity, allowed to read only its settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-builder
  namespace: reports
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-settings-reader
  namespace: reports
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["report-settings"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-builder-settings
  namespace: reports
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-settings-reader
subjects:
- kind: ServiceAccount
  name: report-builder
  namespace: reports
---
# Reads its settings from the Kubernetes API every ten seconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-builder
  template:
    metadata:
      labels:
        app: report-builder
    spec:
      serviceAccountName: report-builder
      containers:
      - name: builder
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: Never
        command: ["python", "-c"]
        args:
        - |
          import json, ssl, time, urllib.request
          account = "/var/run/secrets/kubernetes.io/serviceaccount/"
          url = "https://kubernetes.default.svc/api/v1/namespaces/reports/configmaps/report-settings"
          while True:
              try:
                  token = open(account + "token").read()
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
                  context = ssl.create_default_context(cafile=account + "ca.crt")
                  settings = json.load(urllib.request.urlopen(request, context=context, timeout=5))
                  print(json.dumps({"event": "report_built", "title": settings["data"]["title"]}), flush=True)
              except Exception as error:
                  print(json.dumps({"event": "report_failed", "error": type(error).__name__}), flush=True)
              time.sleep(10)
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 96Mi}
---
# Serves finished reports; it never talks to the Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-viewer
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-viewer
  template:
    metadata:
      labels:
        app: report-viewer
    spec:
      containers:
      - name: viewer
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: Never
        command: ["python", "-m", "http.server", "8000", "--directory", "/tmp"]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 96Mi}
