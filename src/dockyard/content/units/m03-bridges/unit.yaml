id: m03-bridges
revision: 1
module: 3
order: 2
title: Connect services through a named bridge
summary: Give two independently running containers a shared network and a stable dependency name.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Create a user-defined bridge with explicit ownership.
- Use a network alias instead of a container IP.
- "Keep an internal dependency off the host\u2019s published ports."
prerequisites:
- m03-ports
objectives:
- docker.bridges
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Both containers are running on different bridges. Is a dependency alias on one bridge automatically
    available to the other?
  options:
  - No; network attachment and naming scope must align.
  - Yes; aliases are global across Docker.
  - Only if both images use the same base.
  correct: 0
  explanation: A user-defined bridge provides a scoped communication and naming domain, independent of the images
    used.
hints:
- "Inspect each container\u2019s NetworkSettings.Networks."
- Create the labeled user-defined bridge, then connect both existing containers.
- Use --alias dependency when connecting the peer, and verify the name from inside the API container.
sources:
- https://docs.docker.com/engine/network/drivers/bridge/
- https://docs.docker.com/engine/network/port-publishing/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}-dependency'
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{image}}'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local Mac can reach the published port
  explanation: Only the local Mac can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: network-owned
  title: Both services and their bridge belong to this lab
  explanation: Cross-check resource identity with DNS and the live dependency response.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: Inspect bridge membership and aliases, then test DNS from inside Dispatch. The API must call dependency:8080,
    not host loopback.
- id: network-shared-bridge
  title: Both services attach to the assigned bridge
  explanation: Cross-check resource identity with DNS and the live dependency response.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - shared_bridge
  expected: 'true'
  diagnostic: Inspect bridge membership and aliases, then test DNS from inside Dispatch. The API must call dependency:8080,
    not host loopback.
- id: network-dns
  title: The dependency name resolves to its actual container
  explanation: Cross-check resource identity with DNS and the live dependency response.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: Inspect bridge membership and aliases, then test DNS from inside Dispatch. The API must call dependency:8080,
    not host loopback.
- id: network-dependency-private
  title: The dependency has no published host ports
  explanation: Cross-check resource identity with DNS and the live dependency response.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - dependency_private
  expected: 'true'
  diagnostic: Inspect bridge membership and aliases, then test DNS from inside Dispatch. The API must call dependency:8080,
    not host loopback.
- id: network-reached-peer
  title: Dispatch reaches the actual dependency through its service name
  explanation: Cross-check resource identity with DNS and the live dependency response.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - reached_peer
  expected: 'true'
  diagnostic: Inspect bridge membership and aliases, then test DNS from inside Dispatch. The API must call dependency:8080,
    not host loopback.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
