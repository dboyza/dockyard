id: m03-bridges
revision: 1
module: 3
order: 2
title: Connect two containers by name
summary: Put two containers on a shared network so one can reach the other by a stable name.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Create a Docker network for related containers.
- Give a container a name on that network instead of relying on its IP address.
- Keep an internal service reachable by other containers but not from your computer.
prerequisites:
- m03-ports
objectives:
- docker.bridges
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Two containers are on different networks. Can one reach the other using an alias from its
    network?
  options:
  - No. Names only work between containers on the same network.
  - Yes. Aliases work across every Docker network.
  - Only if both use the same base image.
  correct: 0
  explanation: Each network has its own set of names. Containers must share a network for its names to
    work between them.
hints:
- Check which networks each container is attached to with docker inspect --format '{{json .NetworkSettings.Networks}}'.
- Create the labeled network first, then connect both existing containers to it.
- Add --alias dependency when you connect the dependency container, then test the name from inside the
  API.
sources:
- https://docs.docker.com/engine/network/drivers/bridge/
- https://docs.docker.com/engine/network/port-publishing/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}-dependency'
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{image}}'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: network-owned
  title: Both services and their bridge belong to this lab
  explanation: Both containers and their network must carry this lab's label so Dockyard can recognize
    them.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: The API, its dependency, or the network is missing the io.dockyard.lab label. Check each
    one with docker inspect. Networks and containers cannot be relabeled, so recreate whichever is unlabeled
    with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: network-shared-bridge
  title: Both services attach to the assigned bridge
  explanation: Containers can only talk by name when they are attached to the same user-defined network.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - shared_bridge
  expected: 'true'
  diagnostic: At least one of the two containers is not attached to $DOCKYARD_NETWORK. Run docker network
    inspect "$DOCKYARD_NETWORK" and look for both container names under Containers. Attach a missing one
    with docker network connect.
- id: network-dns
  title: The dependency name resolves to its actual container
  explanation: Inside the API container, the name dependency must resolve to the dependency container's
    address on the shared network.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: The name dependency did not resolve to the dependency container. Test it from inside the
    API with docker exec "$DOCKYARD_CONTAINER" python -c 'import socket; print(socket.gethostbyname("dependency"))'.
    The alias must be set on the dependency's connection to the network (docker network connect --alias
    dependency).
- id: network-dependency-private
  title: The dependency has no published host ports
  explanation: The API reaches its dependency over the Docker network, so the dependency needs no port
    on your computer.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - dependency_private
  expected: 'true'
  diagnostic: The dependency container publishes a host port. Run docker port on it to confirm. Recreate
    it without -p; the API does not need a published port to reach it.
- id: network-reached-peer
  title: Dispatch reaches the actual dependency through its service name
  explanation: The API's /dependency route makes a real request to the peer and reports which container
    answered, so this confirms the whole path works.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - network
  expectation: json
  json_path:
  - reached_peer
  expected: 'true'
  diagnostic: 'The API could not reach the dependency container. Request http://127.0.0.1:$DOCKYARD_PORT/dependency
    and read the error. Then check the API''s UPSTREAM_URL with docker inspect: it should be http://dependency:8080/healthz.
    localhost inside the API container means the API itself, not the dependency.'
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- network-owned
- network-shared-bridge
- network-dns
- network-dependency-private
- network-reached-peer
