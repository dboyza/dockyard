id: m02-mission
revision: 1
module: 2
order: 4
title: 'Mission: a portable Dispatch release'
summary: Deliver a self-contained image with the required release and a non-root runtime.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Combine a controlled build context, runtime artifact boundary, and explicit process command.
- Ship a new application release without a development bind mount.
- Verify process identity, release response, and local-only exposure.
prerequisites:
- m02-multistage
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The image builds successfully but its non-root process cannot read VERSION. Which evidence
    proves the release works?
  options:
  - A live response from the actual non-root container.
  - Only the final build exit code.
  - The existence of a USER instruction in any stage.
  correct: 0
  explanation: Build success and source instructions do not establish behavior in the final running container.
hints:
- Use the previous lab’s artifact boundary but select the release required by this brief.
- VERSION must be part of the built image and readable by the final user.
- Build the image, run it without -v, and check both its health response and UID with docker exec.
sources:
- https://docs.docker.com/reference/dockerfile/
- https://docs.docker.com/build/building/context/
starter: {}
reference: {}
prepare: []
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The image must carry its own application files, so the container should work without mounting
    your workspace.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '[]'
  json_path:
  - '0'
  - Mounts
  diagnostic: The container still has a mount from your computer. Run docker inspect --format '{{json
    .Mounts}}' "$DOCKYARD_CONTAINER" to see it. Make sure the Dockerfile COPYs app.py and VERSION into
    the image, rebuild, then recreate the container without -v or --mount.
- id: release
  title: The image serves the expected application release
  explanation: The release field in /healthz comes from the VERSION file inside the image, so it shows
    which build is actually serving requests.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  expected: dispatch-release
  json_path:
  - release
  diagnostic: 'The API reported a different release than this task expects. Compare the release in curl
    "http://127.0.0.1:$DOCKYARD_PORT/healthz" with the task. If you changed files, remember that a container
    keeps running the image it started from: rebuild the image, then replace the container.'
- id: non-root-process
  title: The application actually runs without root identity
  explanation: Running as an ordinary user limits what a compromised application can change inside the
    container.
  command:
    args:
    - docker
    - exec
    - '{{container}}'
    - python
    - -c
    - import os; print(os.getuid() != 0)
  expectation: equals
  expected: 'True'
  json_path: []
  diagnostic: The application is running as root (UID 0). Run docker exec "$DOCKYARD_CONTAINER" id to
    confirm. Add a USER instruction with a non-root number, such as USER 10001:10001, near the end of
    the final stage, rebuild, and replace the container.
- id: no-build-tree
  title: The final image excludes the verification source directory
  explanation: The final image should contain only what the application needs to run, not the directory
    used for build-time verification.
  command:
    args:
    - docker
    - exec
    - '{{container}}'
    - python
    - -c
    - from pathlib import Path; print(not Path("/source").exists())
  expectation: equals
  expected: 'True'
  json_path: []
  diagnostic: The /source directory is still present in the running image. Only the last FROM stage becomes
    the final image, so make sure that stage copies just the runtime files with COPY --from=<stage-name>
    and never copies or works in /source.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- process-running
- lab-identity
- application-response
- published-port
- loopback-binding
- self-contained
- release
- non-root-process
- no-build-tree
