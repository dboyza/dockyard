id: m23-static-pods
revision: 1
module: 23
order: 2
title: Static Pods and a stopped kubelet
summary: Put a missing scheduler manifest back, start the kubelet, and show new Pods are scheduled.
kind: lesson
runtime: linux
nodes: 2
minutes: 45
outcomes:
- Explain how the kubelet runs static Pods from files on the node.
- Diagnose a stopped kubelet with systemctl and journalctl.
- Show recovery with a new Pod being scheduled, not with old Pods still running.
prerequisites:
- m23-etcd
objectives:
- cka.components
- cka.nodes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The scheduler has stopped, but all existing Pods are still running. What happens to a new
    Pod?
  options:
  - It stays Pending with no node.
  - It starts on the control-plane node.
  - The API refuses to create it.
  correct: 0
  explanation: The API stores the new Pod, but only the scheduler assigns it a node. Existing Pods already
    have a node, so they keep running.
hints:
- Inside the control-plane VM, check systemctl status kubelet and list /etc/kubernetes/manifests; a healthy
  control plane has four files there.
- The scheduler’s manifest was moved to /var/lib/dockyard/recovery/. The kubelet needs to be running to
  act on it.
- Move the file back into /etc/kubernetes/manifests, run sudo systemctl start kubelet, then run python
  wait-control-plane.py in the lab terminal.
sources:
- https://etcd.io/docs/v3.6/op-guide/recovery/
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/static-pod/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.recovery
  - static-pods
  timeout: 180
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - static-pods
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced. A ConfigMap recreated from YAML
    has a new UID and does not count; bring back the original from the etcd snapshot. If nodes or the
    cluster were rebuilt, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node the kubelet service must be active, containers for etcd, the
    API server, the controller manager, and the scheduler must be running, and the API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - static-pods
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a; read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - static-pods
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node and that its manifest is in /etc/kubernetes/manifests; if
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - static-pods
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Get the control plane healthy first, then run sh bootstrap.sh to
    wait for Dispatch to recover and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any way of restoring the file and starting the service is accepted.
- The running processes and a new scheduling decision are checked, not your shell history.
failure_modes:
- Deleting a mirror Pod with kubectl does not change the static Pod on the node.
- Pods that were already running do not show the scheduler works.
starter_failure_checks:
- recovery-components
- recovery-scheduled
