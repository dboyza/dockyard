id: m20-ha
revision: 1
module: 20
order: 3
title: 'High availability: keep the API working through an outage'
summary: Fix the load balancer so the API works while one of three control-plane nodes is down.
kind: lesson
runtime: linux
nodes: 4
minutes: 60
outcomes:
- Explain etcd quorum and why control planes use odd numbers.
- Route API traffic through a load balancer to surviving servers.
- Prove the API can still write, and name what is still a single point of failure.
prerequisites:
- m20-join
objectives:
- cka.ha
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: One member of a three-voter etcd cluster is down, and two voters are healthy. What else is
    necessary for a client write?
  options:
  - A working route to an API server connected to the surviving majority.
  - Removing the failed member from membership immediately.
  - Disabling API certificate verification.
  correct: 0
  explanation: The surviving majority can accept writes, but clients still need a route to an API server
    connected to it.
hints:
- Inspect primary CRI containers and the worker load balancer before assuming the surviving datastore
  is unavailable.
- The first control plane is down on purpose, but the other two still have quorum; the load balancer must
  send traffic to at least one of them.
- Render lb-config, install it as the worker guest HAProxy configuration, validate syntax, and reload
  HAProxy while leaving the primary outage in place.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
- https://etcd.io/docs/v3.6/faq/
- https://v1-35.docs.kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-init/
starter: {}
reference: {}
prepare:
- args:
  - python
  - ha-layout.py
  timeout: 30
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - ha-outage.py
  timeout: 150
checks:
- id: bootstrap-outage
  title: The primary’s API server and etcd are still stopped
  explanation: The lesson proves failover, so the primary control-plane node’s API server and etcd must
    stay stopped.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    - ha
    timeout: 240
  expectation: json
  json_path:
  - outage
  expected: 'true'
  diagnostic: 'The primary’s API server or etcd is running again. Leave their manifests outside /etc/kubernetes/manifests
    on the primary: this exercise is about working without them.'
- id: bootstrap-quorum
  title: The two surviving etcd members are healthy, and all three remain members
  explanation: The surviving etcd members must report healthy, and the membership must still list all
    three original voters.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    - ha
    timeout: 240
  expectation: json
  json_path:
  - quorum
  expected: 'true'
  diagnostic: Quorum is not as required. Do not remove the failed member. If a surviving member is unhealthy,
    check its etcd container with sudo crictl ps and sudo crictl logs on that control-plane VM.
- id: bootstrap-endpoint
  title: The load-balanced API accepts a write
  explanation: Through the shared endpoint, Dockyard must be able to create, read, and delete a ConfigMap.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    - ha
    timeout: 240
  expectation: json
  json_path:
  - endpoint
  expected: 'true'
  diagnostic: Requests through the shared endpoint still fail. Check /etc/haproxy/haproxy.cfg on the worker
    lists at least one healthy control-plane API server with check, validate it with sudo haproxy -c -f
    /etc/haproxy/haproxy.cfg, and reload HAProxy.
- id: bootstrap-workflow
  title: A job crosses the nodes and completes
  explanation: A real job submitted from the frontend on one node must be completed by Dispatch on the
    other and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    - ha
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A cross-node job did not complete. Make sure sh bootstrap.sh finished, then check kubectl
    get pods -o wide for anything not ready, and read kubectl logs deployment/worker.
capabilities:
- limactl
- kubectl
- calico
- docker
- native-cluster
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent configuration formatting, editors, and diagnostic commands are accepted.
- Live state is graded rather than the shell command sequence.
failure_modes:
- A responding API can coexist with missing Pod networking.
- Node readiness alone does not prove cross-node application traffic.
- A healthy etcd majority does not repair an endpoint pointed only at a failed API server.
starter_failure_checks:
- bootstrap-endpoint
- bootstrap-workflow
checkpoint: dispatch-operations-v1
