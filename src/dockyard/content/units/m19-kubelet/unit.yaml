id: m19-kubelet
revision: 2
module: 19
order: 2
title: Troubleshoot the kubelet
summary: Bring a stopped kubelet back using systemd and its logs, and prove the node is reporting again.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Explain why containers keep running when the kubelet stops.
- Use systemctl and journalctl to diagnose a service.
- Confirm recovery with node status and lease renewals.
prerequisites:
- m19-runtime
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A worker still answers one existing HTTP request after kubelet stops. What does that prove?
  options:
  - That request reached a surviving workload, but node supervision still needs verification.
  - Kubelet is running.
  - The scheduler has replaced the node.
  correct: 0
  explanation: Containerd can preserve an existing process while kubelet heartbeats and reconciliation
    are unavailable.
hints:
- Inside the worker, systemctl status kubelet shows whether it is stopped or failing.
- Read sudo journalctl -u kubelet -n 30 to see if it is simply stopped or failing because of its configuration.
- Fix anything the journal points to, then sudo systemctl enable --now kubelet, and check kubectl get
  nodes and leases.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - kubelet
  timeout: 90
checks:
- id: native-kubelet
  title: Both kubelets are active and reporting
  explanation: The kubelet service must be active on both VMs, both nodes Ready, and both node leases
    renewed recently.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - kubelet
  expected: 'true'
  diagnostic: A kubelet is not active or its node is not reporting. Inside that VM, run systemctl status
    kubelet and sudo journalctl -u kubelet -n 30 to see why; fix any configuration error before starting
    it. Then check kubectl get leases -n kube-node-lease -o wide.
- id: native-workflow
  title: A job from the frontend completes on the native cluster
  explanation: A real job submitted from the frontend must be completed by a worker and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check kubectl get pods for anything not ready, then read kubectl
    logs deployment/worker. If a node is NotReady, fix that first.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-kubelet
