id: i03-worker-database
revision: 1
module: 5
order: 90
title: Jobs queue normally after a worker-only configuration change
summary: The API and its readiness check work, and newly submitted jobs appear in the queue, but background
  results never finish.
kind: incident
runtime: docker
minutes: 30
outcomes:
- Diagnose the reported failure from real runtime evidence.
- Repair the specific boundary while preserving the stated resource and data constraints.
- Demonstrate useful behavior with a fresh end-to-end observation.
prerequisites:
- m05-mission
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What should establish that this incident is resolved?
  options:
  - The requested fresh behavior works and its preservation constraints still hold.
  - The most recent command exited zero.
  - The container list contains a running process.
  correct: 0
  explanation: A command result or process state alone does not establish the requested application
    outcome.
hints:
- Compare API and worker configuration rather than assuming a shared image implies identical settings.
- "The queue and DNS path work; inspect the worker\u2019s database connection error and effective DB_NAME."
- Correct the worker-specific DB_NAME override, apply the Compose model with two workers, and follow
  a fresh job through completion and a database read.
sources:
- https://docs.docker.com/compose/intro/compose-application-model/
- https://docs.docker.com/reference/compose-file/services/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - compose
  - up
  - -d
  - --build
  - --scale
  - worker=2
  - --wait
  timeout: 300
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - '0'
  - State
  - Running
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when
    its main process exits.
  points: 1
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{lab_id}}'
  output: stdout
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do
    not label an unrelated container.
  points: 1
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published
    port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: dispatch
  output: stdout
  json_path:
  - service
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside
    the container listens on 8080.
  points: 1
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{port}}'
  output: stdout
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
  points: 1
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 127.0.0.1
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
  points: 1
- id: compose-owned
  title: Every observed service belongs to this lab
  explanation: Correlate actual service identities with a fresh submitted job and a direct database
    read.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - owned
  diagnostic: Use docker compose ps, logs, and exec to follow the API, dependency, and worker path.
    A healthy API alone does not prove background processing.
  points: 1
