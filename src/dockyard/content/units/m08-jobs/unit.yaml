id: m08-jobs
revision: 2
module: 8
order: 3
title: Jobs and scheduled maintenance
summary: Fix a scheduled maintenance task, run it on demand, and check what it wrote to the database.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Read and write cron schedules.
- Set a Job’s retries and a CronJob’s overlap policy.
- Run a CronJob immediately and check its real effect.
prerequisites:
- m08-patterns
objectives:
- kubernetes.workloads
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You fix a CronJob’s template. Does a Job it already created, which failed, pick up the fix?
  options:
  - No. Delete it and create a new Job from the fixed CronJob.
  - Yes. Existing Jobs are updated.
  - Only in the default namespace.
  correct: 0
  explanation: The template is only used for new Jobs. Existing Jobs keep the settings they were created
    with.
hints:
- Compare the command in the CronJob with the files in your workspace, and look at its suspend setting.
- 'It needs schedule ''*/5 * * * *'', suspend: false, concurrencyPolicy: Forbid, and a backoffLimit of
  3 or less.'
- Use python maintenance.py as the command, apply, then kubectl create job maintenance-proof --from=cronjob/dispatch-maintenance.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: workload-api
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies to accept jobs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - api
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch, and read the Events for the reason.
- id: workload-workers
  title: Two workers are available
  explanation: The worker Deployment must ask for two copies and have both running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: 'The worker Deployment does not have exactly two available copies. Check replicas: in worker.yaml,
    apply it, and run kubectl rollout status deployment/worker. If Pods are stuck, kubectl describe pod
    on one of them shows why.'
- id: workload-processing
  title: A new job is completed by a worker
  explanation: Dockyard submits a real job and waits for a worker to finish it with the right result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running with kubectl get pods -l app=worker,
    then read kubectl logs deployment/worker for database or Redis connection errors.
- id: workload-schedule
  title: The CronJob schedule and retry settings are right
  explanation: dispatch-maintenance must run every five minutes, not be suspended, forbid overlapping
    runs, and retry at most three times.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - schedule
  expected: 'true'
  diagnostic: 'The CronJob settings are not right yet. Run kubectl get cronjob dispatch-maintenance -o
    yaml and check: schedule ''*/5 * * * *'', suspend false or absent, concurrencyPolicy Forbid, backoffLimit
    between 0 and 3, and restartPolicy Never or OnFailure.'
- id: workload-maintenance
  title: The proof Job completed and wrote its database row
  explanation: A Job named maintenance-proof must complete and leave a fresh row in the maintenance_runs
    table.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - maintenance
  expected: 'true'
  diagnostic: maintenance-proof has not completed, or its row is missing. Run kubectl describe job maintenance-proof
    and kubectl logs job/maintenance-proof. If it was created before you fixed the CronJob, delete it
    and create it again with kubectl create job maintenance-proof --from=cronjob/dispatch-maintenance.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-workloads-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent controller manifests are accepted when live ownership and required application effects satisfy
  the contract.
failure_modes:
- Healthy API Pods without functioning workers do not establish job processing.
- A completed Pod with a printed success message does not prove the database effect.
starter_failure_checks:
- workload-maintenance
- workload-schedule
