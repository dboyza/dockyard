id: exam-ckad-a
revision: 1
module: 12
order: 100
title: Dispatch release assessment
summary: An original eight-task application release assessment with explicit weighted outcomes.
kind: exam
runtime: kubernetes
minutes: 120
outcomes:
- Build the release artifact
- Consume the accepted configuration
- Separate health signals
- Schedule a release audit
- Recover the stable request path
- Persist the report workspace
- Connect initialization and log observation
- Constrain an audit endpoint
prerequisites:
- m18-mission
objectives:
- ckad.images
- ckad.configmaps
- ckad.probes
- ckad.workloads
- ckad.services
- ckad.volumes
- ckad.pod-patterns
- ckad.network-policy
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What makes a completed practice score useful for review?
  options:
  - Recorded runtime outcomes tied to task requirements.
  - The number of commands typed.
  - A claim that the score guarantees certification.
  correct: 0
  explanation: The score reports observed outcomes and directs review; it is not an official certification
    result.
hints:
- Review the task outcomes and inspect the affected controller, process, and request path.
- Compare effective runtime state with the named object and persistence constraints.
- After submission, use the task report and reference to plan a fresh independent attempt.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 420
checks:
