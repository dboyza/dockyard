id: m12-strategies
revision: 1
module: 12
order: 3
title: Canary and blue-green releases
summary: Run a canary next to the stable release and give it a preview Service of its own.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Run stable and canary Deployments whose selectors do not overlap.
- Route a preview Service to the canary only and check each release.
- Explain canary, blue-green, and why Pod counts are not exact traffic weights.
prerequisites:
- m12-rollouts
objectives:
- kubernetes.releases
- kubernetes.reliability
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Two stable Pods and one canary share a Service. Does exactly a third of requests reach the
    canary?
  options:
  - No, it is only roughly a third.
  - Yes, Kubernetes rotates strictly.
  - No traffic reaches the canary.
  correct: 0
  explanation: Services balance connections, and clients reuse connections, so the split is approximate.
hints:
- Check the canary Deployment’s replicas and the preview Service’s selector.
- 'Set the canary to replicas: 1, and make dispatch-preview select track: canary.'
- Run sh run.sh, then compare the releases returned by dispatch and dispatch-preview.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: release-available
  title: Two stable copies serve release 1
  explanation: The dispatch Deployment must have two available Pods, each answering with release dispatch-release-1.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The stable Deployment does not have two healthy copies of release 1. Run kubectl get pods
    -l app=dispatch,track=stable and kubectl describe pod on any that are not ready. ErrImageNeverPull
    or ImagePullBackOff means the image name is wrong; frequent RESTARTS usually mean a probe problem.
- id: release-probes
  title: Each probe checks the right thing
  explanation: The API needs a startup probe on /startupz with at least 30 seconds of budget, liveness
    on /healthz, and readiness on /readyz. It also needs a grace period of 20 seconds or more, and both
    Pods started and ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - probes
  expected: 'true'
  diagnostic: The probes are not set up as required. Check the api container. The startupProbe path is
    /startupz, with periodSeconds × failureThreshold of at least 30. The livenessProbe is /healthz and
    the readinessProbe is /readyz, all on port 8080. terminationGracePeriodSeconds must be at least 20.
- id: release-canary
  title: Stable and canary Pods share the main Service
  explanation: One canary Pod must serve dispatch-release-2, and the main dispatch Service must reach
    all three Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - canary
  expected: 'true'
  diagnostic: The canary is not running alongside the stable Pods. Check kubectl get deployment dispatch-canary
    (it needs one ready replica) and kubectl get endpointslices -l kubernetes.io/service-name=dispatch
    (it needs three addresses). The main Service should select only app=dispatch.
- id: release-preview
  title: The preview Service reaches only the canary
  explanation: dispatch-preview must have exactly the canary Pod as its endpoint and return dispatch-release-2.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - preview
  expected: 'true'
  diagnostic: 'dispatch-preview does not reach only the canary. Check its selector with kubectl get service
    dispatch-preview -o yaml: it should select track=canary, and kubectl get endpointslices -l kubernetes.io/service-name=dispatch-preview
    should list one address.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and rollout commands are accepted when actual stable/candidate responses, availability
  settings, and the requested process behavior are verified.
failure_modes:
- Readiness is not liveness; restarting on a dependency outage can worsen the incident.
- A Service selecting multiple tracks does not guarantee an exact request percentage.
- A rollback of a Pod template does not undo database migrations.
starter_failure_checks:
- release-canary
- release-preview
