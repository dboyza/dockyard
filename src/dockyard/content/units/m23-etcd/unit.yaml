id: m23-etcd
revision: 1
module: 23
order: 1
title: Back up and restore etcd
summary: Take an etcd snapshot, lose an object, and bring back the original from the snapshot.
kind: lesson
runtime: linux
nodes: 2
minutes: 45
outcomes:
- Save and inspect an etcd snapshot with etcdctl and etcdutl.
- Restore a snapshot into a new directory and point etcd at it.
- Explain why a restored object keeps its UID and why the database needs separate backups.
prerequisites:
- m22-mission
objectives:
- cka.components
- cka.nodes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You delete a ConfigMap and recreate it from the same YAML. Is it the original object?
  options:
  - No. It gets a new UID; only a restore brings back the original.
  - Yes, because the name and contents match.
  - Yes, if you recreate it within a minute.
  correct: 0
  explanation: Every object gets a new UID when it is created. Matching name and data make a look-alike,
    not the original.
hints:
- Inside the control-plane VM, find the etcd container with sudo crictl ps --name etcd, and read the certificate
  paths, --name, and --initial-advertise-peer-urls in /etc/kubernetes/manifests/etcd.yaml.
- Run etcdctl through sudo crictl exec with --endpoints=https://127.0.0.1:2379 and the --cacert, --cert,
  and --key paths, then run the stage-loss helper from the lab terminal.
- Restore with etcdutl snapshot restore into --data-dir=/var/lib/etcd/dockyard-restored, adding the member
  name, peer URL, --bump-revision=1000000000, and --mark-compacted, then change only the etcd-data hostPath
  in the manifest.
sources:
- https://etcd.io/docs/v3.6/op-guide/recovery/
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/static-pod/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.recovery
  - etcd
  timeout: 180
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - etcd
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced, or the database is not running,
    so the stored row could not be read. A ConfigMap recreated from YAML has a new UID and does not count;
    bring back the original from the etcd snapshot. If nodes or the cluster were rebuilt, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node, the kubelet service must be active. Containers for etcd, the
    API server, the controller manager, and the scheduler must be running. The API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - etcd
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM, check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a. Read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - etcd
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node, and that its manifest is in /etc/kubernetes/manifests. If
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-restored
  title: The original objects came back from the snapshot
  explanation: The deleted objects must have their original UIDs, etcd’s revision must be far ahead of
    the snapshot’s, and the snapshot’s old revision must be marked compacted.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - etcd
    timeout: 240
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: The restore is not in place. Restore the snapshot with etcdutl snapshot restore into a new
    --data-dir, including --bump-revision=1000000000 --mark-compacted. Then change the data hostPath in
    /etc/kubernetes/manifests/etcd.yaml to that directory, and wait for the API.
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - etcd
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Get the control plane healthy first, then run sh bootstrap.sh to
    wait for Dispatch to recover and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any editor or method for changing the manifest is accepted, as long as the data volume points at the
  restored directory.
- The results in the cluster are checked, not your shell history.
failure_modes:
- An object recreated from YAML has a new UID.
- Pods that were already running do not show that the control plane can do new work.
- An etcd snapshot does not contain the database’s rows.
starter_failure_checks:
- recovery-restored
