id: exam-ckad-b
revision: 1
module: 18
order: 101
title: Dispatch delivery assessment
summary: 'A timed CKAD-style practice exam: eight tasks on delivering images, configuration, and traffic.'
kind: exam
runtime: kubernetes
minutes: 120
outcomes:
- Deploy the approved image by digest
- Fix the database password path and remove the API token
- Set worker resources
- Finish a Kustomize overlay
- Fix the preview Deployment
- Fix the report listener
- Restore a report into its volume
- Separate stable and preview traffic
prerequisites:
- m18-mission
objectives:
- ckad.images
- ckad.secrets
- ckad.application-security
- ckad.limits-quotas
- ckad.configmaps
- ckad.strategies
- ckad.debugging
- ckad.volumes
- ckad.services
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What does a practice exam score tell you?
  options:
  - How many of these tasks worked when time was up.
  - Whether you will pass the real exam.
  - How many commands you typed.
  correct: 0
  explanation: The score comes from checking the final state of each task. It shows where to practise
    next; it cannot predict a real exam result.
hints:
- Hints are not available during the exam. Afterwards, open each task's results to see what was checked.
- For each task you missed, compare the live objects with the task text using kubectl get -o yaml and
  kubectl describe.
- Work through the lessons linked from each missed task, then try a fresh attempt without help.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://kubernetes.io/docs/concepts/containers/images/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 420
checks:
- id: exam-digest
  title: Both API Pods run the approved image by digest
  explanation: Both API containers must use REGISTRY/dispatch@DIGEST for dispatch:incident, with imagePullPolicy
    Always, and the registry login must still work.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - digest
  expected: 'true'
  diagnostic: Review how to look up a digest in a registry and deploy by digest, and how pull Secrets
    work.
- id: exam-credential
  title: The API reads its password and has no ServiceAccount token
  explanation: Both API Pods must report ready, set automountServiceAccountToken to false, and have no
    token file mounted.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - credential
  expected: 'true'
  diagnostic: Review DB_PASSWORD_FILE against the mounted Secret’s path and key, and automountServiceAccountToken
    in the Pod spec.
- id: exam-workflow
  title: A new job completes and is saved
  explanation: A job sent through Service dispatch must be processed by a worker and saved in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Review the API’s readiness first; it cannot save jobs without its database password.
- id: exam-resources
  title: Two workers run within the resource limits
  explanation: Two available workers, each with a CPU request above zero and a limit of at most 500m,
    a memory request of at least 32Mi, a memory limit of at most 256Mi, requests no larger than limits,
    and the limit applied to the running container.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - resources
  expected: 'true'
  diagnostic: Review requests and limits and how they appear in the container’s cgroup.
- id: exam-overlay
  title: The production overlay configures metadata-reader
  explanation: kubectl kustomize release/overlays/production must generate the ConfigMap with environment
    production and release dispatch-approved-b, and the live metadata-reader must use it and serve both
    values.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - overlay
  expected: 'true'
  diagnostic: 'Review configMapGenerator with behavior: merge in an overlay, and kubectl apply -k.'
- id: exam-preview
  title: The preview Deployment runs two ready replicas with a safe rollout
  explanation: preview-api must have two available Pods serving dispatch-preview-b, with maxUnavailable
    0 and maxSurge 1.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - preview
  expected: 'true'
  diagnostic: Review kubectl set image and the rollingUpdate settings.
- id: exam-listener
  title: The report listener answers through its Service
  explanation: report-listener must set PORT to 8090, Service reports must map port 8080 to 8090, and
    a request to http://reports:8080/ must succeed.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - listener
  expected: 'true'
  diagnostic: Review environment variables in a Deployment and Service targetPort.
- id: exam-archive
  title: The report is restored into the original claim
  explanation: report-cache must mount the original report-cache claim at /archive, and /archive/report.json
    must match report-backup.json byte for byte.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - archive
  expected: 'true'
  diagnostic: Review copying a file into a Pod’s volume, for example with kubectl cp or kubectl exec -i.
- id: exam-preserved
  title: The original namespace, database claim, and stored job are still there
  explanation: The dispatch namespace, the database’s claim, and the job stored before the exam must be
    the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the exam is missing, or the database is not running, so the stored
    job could not be read. Change existing objects in place.
- id: exam-routing
  title: Each Service reaches only its own release
  explanation: Service preview must select exactly the ready preview-api Pods and Service dispatch exactly
    the stable Pods, and each must return its own release.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - routing
  expected: 'true'
  diagnostic: Review Service selectors and labels, and check both EndpointSlices.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
- registry
alternatives:
- Any method that produces the requested final state is accepted.
- Only the final state of the cluster is checked, not your commands.
failure_modes:
- A healthy process alone does not show a working request path or a finished job.
- Recreating an object gives it a new identity, which does not count as keeping the original.
starter_failure_checks:
- exam-digest
- exam-credential
- exam-resources
- exam-overlay
- exam-preview
- exam-listener
- exam-archive
- exam-routing
