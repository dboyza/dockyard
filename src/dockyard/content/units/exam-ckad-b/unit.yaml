id: exam-ckad-b
revision: 1
module: 18
order: 101
title: Dispatch delivery assessment
summary: Eight original delivery tasks covering immutable artifacts, process configuration, controlled
  releases, and durable data.
kind: exam
runtime: kubernetes
minutes: 120
outcomes:
- Pin the accepted private artifact
- Restore dependency access and remove the API token
- Fit the workers into a deliberate resource budget
- Apply production metadata through Kustomize
- Recover a controlled preview rollout
- Recover the report listener
- Restore the accepted report into its existing claim
- Separate stable and preview traffic
prerequisites:
- m18-mission
objectives:
- ckad.images
- ckad.secrets
- ckad.application-security
- ckad.limits-quotas
- ckad.configmaps
- ckad.strategies
- ckad.debugging
- ckad.volumes
- ckad.services
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What makes a completed practice score useful for review?
  options:
  - Recorded runtime outcomes tied to task requirements.
  - The number of commands typed.
  - A claim that the score guarantees certification.
  correct: 0
  explanation: The score reports observed outcomes and directs review; it is not an official certification
    result.
hints:
- Review the task outcomes and inspect the affected controller, process, and request path.
- Compare effective runtime state with the named object and persistence constraints.
- After submission, use the task report and reference to plan a fresh independent attempt.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://kubernetes.io/docs/concepts/containers/images/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 420
checks:
- id: exam-digest
  title: Pin the accepted private artifact
  explanation: Verify actual delivery behavior and the original task identities.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_delivery
    timeout: 240
  expectation: json
  json_path:
  - digest
  expected: 'true'
  diagnostic: Review this task outcome and its live process, configuration, or persistence boundary.
