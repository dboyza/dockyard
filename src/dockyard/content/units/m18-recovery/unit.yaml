id: m18-recovery
revision: 1
module: 18
order: 3
title: Restore an encrypted backup
summary: Restore an encrypted backup onto separate storage and switch traffic to it after checking.
kind: lesson
runtime: kubernetes
nodes: 2
minutes: 45
outcomes:
- Explain what authenticated encryption and key custody add to backups.
- Restore onto separate storage and verify before switching traffic.
- Keep the original storage as a fallback.
prerequisites:
- m18-rotation
objectives:
- kubernetes.security
- kubernetes.storage
- platform.delivery
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The original database Pod restarts on its original claim. What has been proven?
  options:
  - Process recovery, but no independent backup restore.
  - The encrypted backup is valid.
  - The backup key can be recovered.
  correct: 0
  explanation: An independent restore uses the backup and validates its recovered contents on separate
    storage.
hints:
- Read restore.py to see where it restores to and when it switches the Service.
- Run python restore.py.
- Check kubectl get statefulsets,pvc and the db Service’s selector afterwards.
sources:
- https://trivy.dev/latest/docs/target/container_image/
- https://trivy.dev/latest/docs/supply-chain/sbom/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://www.postgresql.org/docs/current/backup-dump.html
- https://cryptography.io/en/latest/hazmat/primitives/aead/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 360
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - backup.py
  timeout: 180
checks:
- id: hardening-recovery
  title: The restored backup is serving from separate storage
  explanation: The encrypted backup must decrypt and reject tampering, the db Service must point at the
    restored database on a different volume, the original claim must be intact, and the known record must
    be readable through the frontend.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - recovery
  expected: 'true'
  diagnostic: 'The restore is not complete. Run python restore.py and read its output, then check kubectl
    get statefulsets,pvc and kubectl get service db -o yaml: the Service should select the restored database,
    and the original claim should still exist.'
- id: hardening-workflow
  title: A job from the frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the frontend did not complete. Check the database Pod is running and selected
    by the db Service, that the API and worker have the current password, and that the frontend network
    policy names the current client label.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- scanner
checkpoint: dispatch-hardening-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent image builds, credential administration, and restore commands are accepted when actual runtime
  and evidence agree.
- No exact command history or YAML formatting is required; preserve the documented backup and report formats.
failure_modes:
- A changed tag leaves old running containers untouched.
- A Secret update leaves the database or consumers on a different credential.
- Reusing the original claim does not prove an independent restore.
starter_failure_checks:
- hardening-recovery
- hardening-workflow
