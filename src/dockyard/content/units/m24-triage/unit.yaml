id: m24-triage
revision: 1
module: 24
order: 1
title: Triage a system with more than one fault
summary: Follow a failing request step by step, fixing each broken step with a small change.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Use a short observe, guess, test, change, check loop instead of trying every fix.
- Follow a request from the Service to the saved result to find where it stops.
- Recognise when fixing one fault reveals another.
prerequisites:
- m23-mission
objectives:
- cka.service-diagnosis
- ckad.debugging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Both API Pods are Running and Ready, but requests to the Service get no answer. What should
    you check first?
  options:
  - Whether the Service’s selector matches the Pods’ labels.
  - Whether the database is out of disk space.
  - Whether the API image is the latest version.
  correct: 0
  explanation: Ready Pods that the Service does not select receive no traffic. Compare the selector with
    the labels before changing anything else.
hints:
- Compare kubectl get service dispatch -o jsonpath='{.spec.selector}' with kubectl get pods -l app=dispatch
  --show-labels, and check the EndpointSlice.
- After fixing the route, submit a job with curl to $DOCKYARD_PORT/jobs. If it stays queued, look at kubectl
  get deployment worker.
- 'Point the Service at track: stable with kubectl patch, and scale the worker Deployment to 1.'
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/debug/debug-application/
- https://v1-35.docs.kubernetes.io/docs/tasks/run-application/configure-pdb/
- https://v1-35.docs.kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://v1-35.docs.kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.handoff
  - triage
  timeout: 240
checks:
- id: handoff-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the incident must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - triage
    timeout: 300
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the incident is missing or was replaced. Fix the existing objects
    with small changes instead of deleting and recreating them or rebuilding the cluster; if that already
    happened, reset the lab.
- id: handoff-workflow
  title: A new job from the browser and the frontend completes
  explanation: Real jobs submitted through the lab’s Dispatch port and from the trusted frontend on another
    node must be processed and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - triage
    timeout: 300
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: 'A job did not complete. Follow the request step by step: check kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch lists API Pods, then submit a job and, if it stays queued,
    check kubectl get deployment worker and kubectl logs deployment/worker.'
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any small, targeted change that fixes each step is accepted, including kubectl edit.
- Real jobs are checked, not your shell history; the handoff is for self-review.
failure_modes:
- Healthy Pods do not help if the Service does not select them.
- An accepted job is not a finished job; the workers must process it.
starter_failure_checks:
- handoff-workflow
