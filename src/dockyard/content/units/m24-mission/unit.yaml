id: m24-mission
revision: 1
module: 24
order: 4
title: 'Capstone: run Dispatch through a control-plane outage'
summary: With one of three control-plane nodes down, restore the API address, the application, its budgets
  and access, and ship a release.
kind: mission
runtime: linux
nodes: 4
minutes: 90
outcomes:
- Keep a highly available cluster working while one control-plane node stays down.
- Combine routing, workload, budget, and access fixes, and ship a new build.
- Write a handoff that is honest about what the system still cannot survive.
prerequisites:
- m24-handoff
objectives:
- cka.ha
- cka.rbac
- cka.resource-usage
- cka.service-diagnosis
- ckad.images
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: One of three etcd members is down. Can the cluster still accept changes?
  options:
  - Yes. Two of three is still a majority.
  - No. etcd needs every member.
  - Only reads work until the member returns.
  correct: 0
  explanation: etcd needs a majority (quorum). Two of three members is a majority, so writes still succeed;
    losing a second would stop them.
hints:
- 'Start with the API address: look at /etc/haproxy/haproxy.cfg on the worker and compare it with the
  control-plane nodes that are running.'
- Regenerate the load balancer configuration with python -m dockyard.native lb-config. Then repeat the
  triage and decisions lessons’ checks on the application.
- Fix HAProxy, the Service selector, the worker count, the Role, the API copies, and the PDB; then set
  VERSION, run python build.py, and restart both Deployments.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/debug/debug-application/
- https://v1-35.docs.kubernetes.io/docs/tasks/run-application/configure-pdb/
- https://v1-35.docs.kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://v1-35.docs.kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
starter: {}
reference: {}
prepare:
- args:
  - python
  - ha-layout.py
  timeout: 30
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.handoff
  - mission
  timeout: 240
- args:
  - python
  - ha-outage.py
  timeout: 150
checks:
- id: handoff-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the incident must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the incident is missing or was replaced, or the database is not running,
    so the stored row could not be read. Fix the existing objects with small changes instead of deleting
    and recreating them or rebuilding the cluster; if that already happened, reset the lab.
- id: handoff-outage
  title: The first control-plane node’s API server and etcd are still stopped
  explanation: This mission is about working through the outage, so the stopped components must stay stopped.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - outage
  expected: 'true'
  diagnostic: 'The first control-plane node’s API server or etcd is running again. Move their manifests
    back out of /etc/kubernetes/manifests on that node: the mission must be completed without them.'
- id: handoff-quorum
  title: The two surviving etcd members are healthy, and all three remain members
  explanation: Dockyard asks each surviving etcd member for its health, and checks the cluster still lists
    all three members.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - quorum
  expected: 'true'
  diagnostic: Quorum is not as required. Do not remove the stopped member. If a surviving member is unhealthy,
    check its etcd container with sudo crictl ps and sudo crictl logs on that control-plane VM.
- id: handoff-endpoint
  title: The cluster’s API address accepts a new change
  explanation: Through the load-balanced API address, Dockyard creates, reads, and deletes a ConfigMap.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - endpoint
  expected: 'true'
  diagnostic: Requests through the cluster’s API address still fail. Check /etc/haproxy/haproxy.cfg on
    the worker lists the control-plane nodes that are running. Regenerate it with python -m dockyard.native
    lb-config if needed. Validate it with sudo haproxy -c -f /etc/haproxy/haproxy.cfg, and reload HAProxy.
- id: handoff-capacity
  title: The API fits the agreed replica, resource, and disruption budget
  explanation: The API must run 2 to 4 available copies. Total requests must be within 1 CPU and 512 MiB,
    and total memory limits within 1 GiB. Limits must be at least their requests. A dispatch-operations
    PDB for app=dispatch,track=stable must keep one available.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - capacity
  expected: 'true'
  diagnostic: 'The API is outside the budget. Check kubectl get deployment dispatch for 2 to 4 available
    copies. Multiply its per-container requests and limits by the replica count. Then check kubectl get
    pdb dispatch-operations -o yaml selects app: dispatch and track: stable, with minAvailable 1, minAvailable
    50%, or maxUnavailable 1.'
- id: handoff-identity
  title: The inventory account can read Pods and nothing more
  explanation: Using the inventory Pod’s own token, listing Pods in dispatch must be allowed, and reading
    Secrets or Pods in another namespace refused. dispatch-reader must also be unable to create Pods,
    patch Deployments, or create RoleBindings.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: 'dispatch-reader has the wrong access. Look at kubectl get role dispatch-pod-reader -o yaml:
    it should have one rule allowing get, list, and watch on pods in the core group (""). Keep the existing
    ServiceAccount and RoleBinding, then test with kubectl auth can-i ... --as=system:serviceaccount:dispatch:dispatch-reader.'
- id: handoff-workflow
  title: A new job from the browser and the frontend completes
  explanation: Real jobs submitted through the lab’s Dispatch port and from the trusted frontend on another
    node must be processed and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Follow the request step by step. Check kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch lists API Pods. Then submit a job. If it stays queued, check
    kubectl get deployment worker and kubectl logs deployment/worker.
- id: handoff-release
  title: Every API and worker Pod runs the dispatch-handoff-v1 build
  explanation: Dockyard asks each running API and worker Pod which version it contains, and the rollout
    must have finished.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - mission
    timeout: 300
  expectation: json
  json_path:
  - release
  expected: 'true'
  diagnostic: Some Pods are not running the new build. Put dispatch-handoff-v1 in VERSION, run python
    build.py to build and copy the image, then kubectl rollout restart deployment/dispatch deployment/worker
    and wait for both rollouts.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any safe order and any equivalent small fixes are accepted.
- The cluster’s state, real authorization results, and new jobs are checked; the handoff is for self-review.
failure_modes:
- Restarting the stopped node hides whether the cluster can survive the outage.
- Surviving a control-plane outage does not make the single worker or its volume redundant.
- Editing VERSION without rebuilding and restarting does not change the running release.
starter_failure_checks:
- handoff-endpoint
- handoff-capacity
- handoff-identity
- handoff-workflow
- handoff-release
