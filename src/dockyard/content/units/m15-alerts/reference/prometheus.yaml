global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/rules.yaml
scrape_configs:
- job_name: dispatch
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - dispatch
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: dispatch
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
