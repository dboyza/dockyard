id: m07-reconciliation
revision: 2
module: 7
order: 1
title: Let Kubernetes keep Dispatch running
summary: Ask Kubernetes for two copies of Dispatch and watch it replace a Pod you remove.
kind: lesson
runtime: kubernetes
minutes: 30
outcomes:
- Compare the number of copies you requested with the number actually running.
- Follow a Pod’s owners back through its ReplicaSet to its Deployment.
- Watch Kubernetes replace a Pod you delete.
prerequisites:
- m06-mission
objectives:
- kubernetes.api
- kubernetes.declarative
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: If you delete one Pod while the Deployment still requests two replicas, what should happen?
  options:
  - A replacement Pod is created with a new identity.
  - The Deployment changes its desired replicas to one.
  - The deleted Pod keeps its original UID.
  correct: 0
  explanation: Controllers reconcile desired state; a replacement is a new object, even when it runs the
    same image.
hints:
- 'Compare how many copies the Deployment asks for with how many are ready: kubectl get deployment dispatch.'
- The starter asks for zero copies. Change the Deployment rather than creating Pods yourself.
- 'Set replicas: 2 in deployment.yaml, run sh run.sh, and wait with kubectl rollout status deployment/dispatch.
  Then delete one Pod with kubectl delete pod POD_NAME and wait for its replacement.'
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
- https://kubernetes.io/docs/reference/using-api/deprecation-guide/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 60
checks:
- id: kube-replicas
  title: The Deployment has two ready copies
  explanation: The Deployment must ask for two copies, and Kubernetes must have both of them running and
    available.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - replicas
  expected: 'true'
  diagnostic: 'The Deployment does not have exactly two available copies. Run kubectl get deployment dispatch
    and compare READY with what you asked for. If it shows 0/0, check replicas: in deployment.yaml and
    apply it. If Pods are not becoming ready, run kubectl describe pods -l app=dispatch and read the Events
    at the bottom.'
- id: kube-owned-pods
  title: Both Pods were created by the Dispatch Deployment
  explanation: The running Pods must come from the Deployment, so Kubernetes will replace them if they
    fail.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - owned_pods
  expected: 'true'
  diagnostic: Kubernetes did not find exactly two running Pods created by the dispatch Deployment. Run
    kubectl get pods and check how many there are. A Pod created by hand with kubectl run is not managed
    by the Deployment and does not count.
- id: kube-response
  title: Each copy answers as Dispatch
  explanation: Dockyard asks each Pod’s /healthz directly, to confirm every copy is really running Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - response
  expected: 'true'
  diagnostic: At least one Pod did not answer correctly on port 8080. Run kubectl get pods to find it,
    then kubectl logs POD_NAME and kubectl describe pod POD_NAME to see why. Check the Deployment still
    uses the supplied image.
- id: kube-labels
  title: The Pods carry the label app=dispatch
  explanation: The Service finds Pods by this label, so every Dispatch Pod must have it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - labels
  expected: 'true'
  diagnostic: The Pods do not all have the label app=dispatch. Run kubectl get pods --show-labels. The
    Pod labels come from spec.template.metadata.labels in the Deployment, and spec.selector.matchLabels
    must match them.
- id: kube-service
  title: A request to the Service reaches Dispatch
  explanation: Dockyard sends a real request to http://dispatch:8080 from inside the cluster and checks
    a Dispatch Pod answers.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: A request to the dispatch Service did not reach a Dispatch Pod. Compare the Service’s selector
    (kubectl get service dispatch -o yaml) with the Pod labels (kubectl get pods --show-labels), and check
    kubectl get endpointslices -l kubernetes.io/service-name=dispatch lists ready addresses. The Service’s
    targetPort must be 8080.
- id: kube-replacement
  title: Kubernetes replaced a Pod you removed
  explanation: The Deployment's ReplicaSet records every Pod it creates and every Pod it deletes itself.
    A Pod it created that is now gone, and that it did not delete, was removed by you and then replaced.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - foundation
    timeout: 60
  expectation: json
  json_path:
  - replacement
  expected: 'true'
  diagnostic: Dockyard found no Pod that was removed and then replaced. Once both copies are ready, delete
    one with kubectl delete pod POD_NAME, then run kubectl get pods --watch until a new Pod is Running.
    Changing replicas does not count, because scaling down is the ReplicaSet deleting Pods itself. Kubernetes
    keeps the record of the replacement for about an hour, so repeat the deletion if you did it longer ago.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-kubernetes-v1
images:
- python
alternatives:
- Equivalent manifests and commands are accepted when live ownership, availability, and HTTP behavior
  satisfy the contract.
failure_modes:
- Matching names without matching selectors do not create endpoints.
- A standalone Pod does not demonstrate Deployment reconciliation.
starter_failure_checks:
- kube-replicas
- kube-replacement
