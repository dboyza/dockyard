apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: dispatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata:
      labels:
        app: dispatch
    spec:
      enableServiceLinks: false
      containers:
      - name: api
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 192Mi
        env:
        - name: DB_HOST
          value: db
        - name: REDIS_URL
          value: redis://queue:6379/0
        - name: DB_PASSWORD_FILE
          value: /var/run/dispatch/password
        - name: DISPATCH_ENV
          valueFrom:
            configMapKeyRef:
              name: dispatch-settings
              key: environment
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 2
        volumeMounts:
        - name: database-credential
          mountPath: /var/run/dispatch
          readOnly: true
        - name: settings
          mountPath: /config
          readOnly: true
      serviceAccountName: dispatch-app
      automountServiceAccountToken: false
      volumes:
      - name: database-credential
        secret:
          secretName: dispatch-database
          defaultMode: 292
      - name: settings
        configMap:
          name: dispatch-settings
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      enableServiceLinks: false
      containers:
      - name: database
        image: ${DOCKYARD_POSTGRES_LOCAL_IMAGE}
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 192Mi
        env:
        - name: POSTGRES_DB
          value: dispatch
        - name: POSTGRES_USER
          value: dispatch
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatch-database
              key: password
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - dispatch
          periodSeconds: 2
      serviceAccountName: dispatch-app
      automountServiceAccountToken: false
  serviceName: db-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue
  template:
    metadata:
      labels:
        app: queue
    spec:
      enableServiceLinks: false
      containers:
      - name: queue
        image: ${DOCKYARD_REDIS_LOCAL_IMAGE}
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 192Mi
        command:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
      serviceAccountName: dispatch-app
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  namespace: dispatch
spec:
  selector:
    app: dispatch
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: dispatch
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: dispatch
spec:
  selector:
    app: queue
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: dispatch
spec:
  clusterIP: None
  selector:
    app: db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
