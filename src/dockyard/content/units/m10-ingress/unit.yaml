id: m10-ingress
revision: 1
module: 10
order: 2
title: Terminate TLS at an ingress controller
summary: Verify host routing, a backend Service, and certificate identity.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Distinguish an Ingress declaration from its controller.
- Connect a hostname and path to a Service backend.
- Validate TLS trust and hostname identity without disabling verification.
prerequisites:
- m10-services
objectives:
- kubernetes.services
- kubernetes.routing
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: curl succeeds only after adding --insecure. Has the required TLS identity been demonstrated?
  options:
  - No; trust and hostname validation were bypassed.
  - Yes; encryption proves the server identity by itself.
  - Yes; an Ingress object always supplies the correct certificate.
  correct: 0
  explanation: Encryption, trusted issuance, and hostname identity are distinct properties of the connection.
hints:
- Inspect both the TLS Secret reference and the backend Service port.
- The Secret is dispatch-tls; the Service exposes port 8080.
- Correct those two references and retry with --cacert and --resolve while leaving verification enabled.
sources:
- https://kubernetes.io/docs/concepts/services-networking/service/
- https://kubernetes.io/docs/concepts/services-networking/ingress/
- https://gateway-api.sigs.k8s.io/concepts/api-overview/
- https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-gateway/
- https://metallb.io/concepts/layer2/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 120
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: routing-service
  title: ClusterIP DNS and real application traffic work
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: Compare Service selectors, EndpointSlices, target ports, and the application listener.
- id: routing-endpoints
  title: EndpointSlices identify the owned ready API Pods
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - endpoints
  expected: 'true'
  diagnostic: Inspect the specific request path from the client through the Service to the application.
- id: routing-tls
  title: Ingress serves Dispatch over certificate-validated TLS
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - tls
  expected: 'true'
  diagnostic: Inspect ingress class, backend port, host, and TLS Secret. Verify with the supplied certificate;
    do not use --insecure.
capabilities:
- docker
- kind
- kubectl
- calico
- routing
checkpoint: dispatch-routing-v1
images:
- python
- postgres
- redis
- busybox
- traefik
alternatives:
- Equivalent selectors, named target ports, and manifests are accepted when the required live endpoint
  and route behavior is demonstrated.
failure_modes:
- An assigned external IP or accepted manifest does not prove application traffic works.
- Bypassing certificate verification does not demonstrate correct TLS identity.
starter_failure_checks:
- routing-tls
