apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dispatch
  namespace: dispatch
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - dispatch.test
    secretName: dispatch-tls
  rules:
  - host: dispatch.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dispatch
            port:
              number: 8080
