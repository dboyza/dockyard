id: m08-workloads
revision: 2
module: 8
order: 1
title: Choose the right controller
summary: Get Dispatch’s workers running and make a node agent run on every node.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Choose between a Deployment, DaemonSet, Job, and CronJob for a piece of work.
- Scale a Deployment and explain why a DaemonSet cannot be scaled.
- Use kubectl port-forward to test an application inside the cluster.
prerequisites:
- m07-mission
objectives:
- kubernetes.workloads
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which controller should run one monitoring agent on every node?
  options:
  - A DaemonSet.
  - A Deployment with a large replicas number.
  - A CronJob.
  correct: 0
  explanation: A DaemonSet runs one Pod per suitable node and follows nodes as they join or leave. A Deployment’s
    count has nothing to do with nodes.
hints:
- Look at both controllers separately; they are broken for different reasons.
- The workers ask for zero copies, and the agent’s nodeSelector matches no node.
- 'Set replicas: 2 in worker.yaml, delete the nodeSelector from agent.yaml, apply both, and wait for both
  rollouts.'
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: workload-api
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies to accept jobs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - api
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch, and read the Events for the reason.
- id: workload-workers
  title: Two workers are available
  explanation: The worker Deployment must ask for two copies and have both running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: 'The worker Deployment does not have exactly two available copies. Check replicas: in worker.yaml,
    apply it, and run kubectl rollout status deployment/worker. If Pods are stuck, kubectl describe pod
    on one of them shows why.'
- id: workload-processing
  title: A new job is completed by a worker
  explanation: Dockyard submits a real job and waits for a worker to finish it with the right result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running with kubectl get pods -l app=worker,
    then read kubectl logs deployment/worker for database or Redis connection errors.
- id: workload-agents
  title: The node agent runs on every allowed node
  explanation: A DaemonSet should have one ready Pod on each node it is allowed to run on, and at least
    one node must be allowed.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - agents
  expected: 'true'
  diagnostic: The dispatch-node-agent DaemonSet has no ready Pods, or fewer than it should. Run kubectl
    describe daemonset dispatch-node-agent. A DESIRED count of 0 usually means its nodeSelector or affinity
    matches no node; compare it with kubectl get nodes --show-labels.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-workloads-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent controller manifests are accepted when live ownership and required application effects satisfy
  the contract.
failure_modes:
- Healthy API Pods without functioning workers do not establish job processing.
- A completed Pod with a printed success message does not prove the database effect.
starter_failure_checks:
- workload-workers
- workload-agents
