id: m21-certificates
revision: 1
module: 21
order: 3
title: Renew the API server certificate
summary: Renew the API server’s serving certificate and make the running server use it.
kind: lesson
runtime: linux
nodes: 2
native_version: 1.35.8
minutes: 40
outcomes:
- Inspect certificate expiry, serial, and issuer.
- Renew a kubeadm certificate under the existing CA.
- Restart a static Pod so it serves the new certificate.
prerequisites:
- m21-upgrade
objectives:
- cka.lifecycle
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A certificate file has a new serial number. What further observation establishes effective
    renewal?
  options:
  - A fresh trusted connection receives that new leaf under the original CA.
  - A client succeeds only with verification disabled.
  - The private key appears in a note.
  correct: 0
  explanation: A fresh trusted connection receives that new leaf under the original CA.
hints:
- Inspect public certificate identity and the original CA before changing anything.
- Renew only the apiserver leaf and reconcile the actual static API process.
- Use kubeadm certs renew apiserver, identify its CRI container, stop that container, then verify API
  readiness and the certificate served over trusted TLS.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/reference/using-api/deprecation-guide/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-maintenance.py
  timeout: 90
checks:
- id: maintenance-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, marker ConfigMap, and the database row stored before maintenance
    must all be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - certificates
    timeout: 180
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before maintenance is missing or was replaced, or the database is not running,
    so the stored row could not be read. Maintenance must change the existing cluster, not rebuild it;
    if objects were deleted or the cluster was recreated, reset the lab and try again.
- id: maintenance-renewed
  title: The API server serves the renewed certificate
  explanation: A new, verified TLS connection to the API must receive a certificate with a new serial
    number, signed by the original CA.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - certificates
    timeout: 180
  expectation: json
  json_path:
  - renewed
  expected: 'true'
  diagnostic: The API server is not serving a renewed certificate yet. After kubeadm certs renew apiserver,
    stop the running kube-apiserver container with sudo crictl stop so the kubelet starts a new one, then
    wait for kubectl get --raw=/readyz.
- id: maintenance-workflow
  title: A job from the frontend completes after maintenance
  explanation: A real job submitted from the frontend must cross the nodes, be processed, and be saved.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - certificates
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check every node is Ready and uncordoned, run sh bootstrap.sh to
    wait for Dispatch to recover, and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors, package command formatting, and diagnostic sequences are accepted.
- Runtime outcome and original identities are assessed; shell history is not graded.
failure_modes:
- A newer host client does not prove the server or kubelets changed.
- Replacing cluster objects can hide data loss and does not establish maintenance continuity.
- A changed file does not prove a running process adopted it.
starter_failure_checks:
- maintenance-renewed
