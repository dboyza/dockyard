id: m18-rotation
revision: 1
module: 18
order: 2
title: Rotate a database password
summary: Change the database password everywhere it is used, and prove the old one no longer works.
kind: lesson
runtime: kubernetes
nodes: 2
minutes: 45
outcomes:
- Explain why rotation changes the server and every consumer separately.
- Rotate a credential without exposing it.
- Prove the new password works and the old one is rejected.
prerequisites:
- m18-images
objectives:
- kubernetes.security
- kubernetes.storage
- platform.delivery
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Both old and new passwords fail while the database is unreachable. What does this prove?
  options:
  - Availability must be restored before credential revocation can be established.
  - The old credential is successfully revoked.
  - The new password is definitely wrong.
  correct: 0
  explanation: A negative authentication observation needs a successful control against the same server.
hints:
- Read rotate.py to see the order it changes PostgreSQL, the Secret, and the consumers in.
- Run python rotate.py.
- Wait for both the dispatch and worker rollouts, and do not re-apply the original Secret.
sources:
- https://trivy.dev/latest/docs/target/container_image/
- https://trivy.dev/latest/docs/supply-chain/sbom/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://www.postgresql.org/docs/current/backup-dump.html
- https://cryptography.io/en/latest/hazmat/primitives/aead/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 360
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
checks:
- id: hardening-rotation
  title: The old password fails and the new one works
  explanation: Against the same running database, the current Secret’s password must log in and the original
    password must be rejected.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - rotation
  expected: 'true'
  diagnostic: The rotation is incomplete. If the old password still works, run python rotate.py. If the
    new one fails too, check the database Pod is running first; a stopped database rejects everything
    and proves nothing. Do not re-apply the original Secret.
- id: hardening-workflow
  title: A job from the frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the frontend did not complete. Check the database Pod is running and selected
    by the db Service, that the API and worker have the current password, and that the frontend network
    policy names the current client label.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- scanner
checkpoint: dispatch-hardening-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent image builds, credential administration, and restore commands are accepted when actual runtime
  and evidence agree.
- No exact command history or YAML formatting is required; preserve the documented backup and report formats.
failure_modes:
- A changed tag leaves old running containers untouched.
- A Secret update leaves the database or consumers on a different credential.
- Reusing the original claim does not prove an independent restore.
starter_failure_checks:
- hardening-rotation
