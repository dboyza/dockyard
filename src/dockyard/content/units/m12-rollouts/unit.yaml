id: m12-rollouts
revision: 1
module: 12
order: 2
title: Rolling updates and rollbacks
summary: Recover from a release with a broken image, keep capacity during updates, and fix the file too.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Read rollout status, history, and ReplicaSets.
- Work out what maxSurge and maxUnavailable allow.
- Roll back with kubectl rollout undo and keep your manifest in step.
prerequisites:
- m12-probes
objectives:
- kubernetes.releases
- kubernetes.reliability
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: rollout undo fixed the live Deployment, but platform.yaml still names the bad image. What
    happens on the next apply?
  options:
  - The bad image comes back.
  - Undo already fixed the file.
  - Kubernetes ignores the apply.
  correct: 0
  explanation: Rollback changes only the live object. The file still describes the broken release until
    you edit it.
hints:
- kubectl rollout history deployment/dispatch and kubectl get rs -o wide show each revision’s image.
- Use kubectl rollout undo deployment/dispatch, and put ${DOCKYARD_IMAGE} back in platform.yaml.
- 'Set maxUnavailable: 0 and maxSurge: 1, apply the rendered file, and wait for two available replicas.'
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: release-available
  title: Two stable copies serve release 1
  explanation: The dispatch Deployment must have two available Pods, each answering with release dispatch-release-1.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The stable Deployment does not have two healthy copies of release 1. Run kubectl get pods
    -l app=dispatch,track=stable and kubectl describe pod on any that are not ready. ErrImageNeverPull
    or ImagePullBackOff means the image name is wrong; frequent RESTARTS usually mean a probe problem.
- id: release-probes
  title: Each probe checks the right thing
  explanation: The API needs a startup probe on /startupz with at least 30 seconds of budget, liveness
    on /healthz, and readiness on /readyz. It also needs a grace period of 20 seconds or more, and both
    Pods started and ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - probes
  expected: 'true'
  diagnostic: The probes are not set up as required. Check the api container. The startupProbe path is
    /startupz, with periodSeconds × failureThreshold of at least 30. The livenessProbe is /healthz and
    the readinessProbe is /readyz, all on port 8080. terminationGracePeriodSeconds must be at least 20.
- id: release-rollout
  title: Updates keep full capacity
  explanation: The rolling update must allow no unavailable Pods and one extra Pod, so two copies keep
    serving throughout an update.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - rollout
  expected: 'true'
  diagnostic: 'The rolling update settings are not right. Under spec.strategy.rollingUpdate, set maxUnavailable:
    0 and maxSurge: 1, then apply.'
- id: release-history
  title: The failed release is still in the history
  explanation: The ReplicaSet for the broken image must still exist, scaled to zero, while the stable
    image serves again.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - releases
    timeout: 90
  expectation: json
  json_path:
  - history
  expected: 'true'
  diagnostic: 'The failed ReplicaSet is missing or still running Pods. Run kubectl get replicasets -l
    app=dispatch,track=stable -o wide. If you deleted and recreated the Deployment, its history is gone:
    reset the lab and use kubectl rollout undo or kubectl set image instead.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and rollout commands are accepted when actual stable/candidate responses, availability
  settings, and the requested process behavior are verified.
failure_modes:
- Readiness is not liveness; restarting on a dependency outage can worsen the incident.
- A Service selecting multiple tracks does not guarantee an exact request percentage.
- A rollback of a Pod template does not undo database migrations.
starter_failure_checks:
- release-available
- release-rollout
