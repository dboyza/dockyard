id: m13-autoscaling
revision: 1
module: 13
order: 3
title: Autoscaling and disruption budgets
summary: Connect an autoscaler to Dispatch, watch real load scale it up, and protect it during maintenance.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Explain how CPU utilization is measured against the request.
- Create an HPA and read its conditions and metrics.
- Explain what a PodDisruptionBudget protects against, and what it does not.
prerequisites:
- m13-placement
objectives:
- kubernetes.scheduling
- kubernetes.autoscaling
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: An HPA reports 200% CPU for Pods with a 50m request. What average use is that?
  options:
  - About 100m CPU per Pod.
  - Two hundred CPU cores.
  - Two percent of the node.
  correct: 0
  explanation: Utilization is a percentage of the request, so 200% of 50m is 100m.
hints:
- kubectl describe hpa dispatch shows what it is trying to scale and whether that exists.
- scaleTargetRef should name the apps/v1 Deployment dispatch.
- Fix and apply autoscale.yaml, then run python wait-scale.py and watch kubectl get hpa dispatch.
sources:
- https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
- https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
- https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
- https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 240
checks:
- id: capacity-resources
  title: The API has sensible requests and limits in force
  explanation: Each API container must request 25m-100m CPU and 32-128Mi memory. Its limits must be no
    higher than 1 CPU and 512Mi. It must be Burstable, and those limits must really be applied inside
    the container.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - resources
  expected: 'true'
  diagnostic: 'The API’s resources are outside the allowed range, or the Pods are not all available. Check
    the api container’s resources in the Deployment: requests of about 50m CPU and 64Mi memory, limits
    of about 300m CPU and 192Mi. Then run kubectl get pods -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass.'
- id: capacity-budget
  title: The namespace applies defaults and a CPU budget
  explanation: LimitRange dispatch-defaults must fill in requests and limits for a container that sets
    none, and ResourceQuota dispatch-budget must reject a Pod that asks for too much CPU.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - budget
  expected: 'true'
  diagnostic: The namespace rules are missing or not working. Run kubectl get limitrange,resourcequota
    and kubectl describe quota dispatch-budget. Both must exist as in the lesson, and the quota’s requests.cpu
    must be no more than 2.
- id: capacity-scaling
  title: Real CPU load scales the API to four copies
  explanation: The HPA must target Deployment dispatch with 2-4 replicas and a 50% CPU target. It must
    be active and measure over 50%. Four API Pods must be available while the load runs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - scaling
  expected: 'true'
  diagnostic: 'The HPA has not scaled Dispatch to four copies from real measurements. Run kubectl describe
    hpa dispatch: check scaleTargetRef names Deployment dispatch, that ScalingActive is True, and that
    current utilization is above target. kubectl top pods should show CPU for each API Pod, and the practice-load
    Deployment must be running.'
- id: capacity-disruption
  title: The disruption budget protects two copies
  explanation: PodDisruptionBudget dispatch must select the API Pods and require minAvailable 2, with
    at least two healthy Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - disruption
  expected: 'true'
  diagnostic: 'The disruption budget is not right. Run kubectl get pdb dispatch -o yaml: minAvailable
    should be 2 and its selector should match the stable API Pods’ labels.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- metrics
checkpoint: dispatch-capacity-v1
images:
- python
- postgres
- redis
- busybox
- metrics_server
nodes: 1
alternatives:
- Equivalent resource quantities, manifests, and scheduling rules are accepted when the declared live
  capacity and placement behavior holds.
failure_modes:
- A toleration permits placement but does not require it.
- HPA needs usable measurements and resource requests; replica declarations alone do not demonstrate autoscaling.
- A PDB protects voluntary eviction, not every possible outage.
starter_failure_checks:
- capacity-scaling
