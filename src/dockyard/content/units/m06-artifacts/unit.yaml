id: m06-artifacts
revision: 2
module: 6
order: 2
title: Check the platform and keep secrets out
summary: Build for your own processor and stop a fake secret file getting into any layer of the image.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Find which processor platform an image was built for.
- Explain why a file deleted in a later build step is still inside the image.
- Use .dockerignore or specific COPY lines to keep private files out of a build.
prerequisites:
- m06-registry
objectives:
- docker.artifacts
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A Dockerfile copies .env, then deletes it in a later RUN step. Is the file gone from the image?
  options:
  - No. The earlier layer still contains it.
  - Yes. Deleting it rewrites every earlier layer.
  - Only on ARM64 images.
  correct: 0
  explanation: Each layer is saved separately. A later deletion hides the file but does not remove it
    from the layer that added it.
hints:
- Look at the Dockerfile’s COPY line, and check whether a .dockerignore file exists (ls -a).
- Create .dockerignore containing .env, or change COPY . . to copy only app.py and VERSION.
- Rebuild with --platform "$DOCKER_DEFAULT_PLATFORM", then replace the running container with one from
  the new image.
sources:
- https://docs.docker.com/build/building/multi-platform/
- https://docs.docker.com/build/building/secrets/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The image must carry its own application files, so the container should work without mounting
    your workspace.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '[]'
  json_path:
  - '0'
  - Mounts
  diagnostic: The container still has a mount from your computer. Run docker inspect --format '{{json
    .Mounts}}' "$DOCKYARD_CONTAINER" to see it. Make sure the Dockerfile COPYs app.py and VERSION into
    the image, rebuild, then recreate the container without -v or --mount.
- id: release
  title: The image serves the expected application release
  explanation: The release field in /healthz comes from the VERSION file inside the image, so it shows
    which build is actually serving requests.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  expected: dispatch-1
  json_path:
  - release
  diagnostic: 'The API reported a different release than this task expects. Compare the release in curl
    "http://127.0.0.1:$DOCKYARD_PORT/healthz" with the task. If you changed files, remember that a container
    keeps running the image it started from: rebuild the image, then replace the container.'
- id: artifact-native
  title: The selected image is native to this host processor
  explanation: An image built for your computer's processor runs directly; a foreign one runs slowly under
    emulation or not at all.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - artifact
    timeout: 90
  expectation: json
  json_path:
  - native
  expected: 'true'
  diagnostic: The running image was built for a different processor architecture than this computer. Compare
    docker image inspect --format '{{.Architecture}}' on the running image with uname -m. Build without
    forcing another --platform and recreate the container.
- id: artifact-excluded-secret
  title: No final-image layer contains the fake secret file
  explanation: Files copied into any image layer can be extracted later, so secrets must never reach the
    build context.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - artifact
    timeout: 90
  expectation: json
  json_path:
  - excluded_secret
  expected: 'true'
  diagnostic: A layer of the running image still contains the practice secret file. Deleting it in a later
    Dockerfile step does not remove it from earlier layers. Exclude it with a .dockerignore entry, rebuild,
    and recreate the container from the new image.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- artifact-excluded-secret
