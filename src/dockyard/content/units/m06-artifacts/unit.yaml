id: m06-artifacts
revision: 2
module: 6
order: 2
title: Know the platform and control the build context
summary: Inspect native image architecture and remove a deliberately fake secret from every shipped layer.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Distinguish an image platform from the host operating system.
- Explain how a multi-platform index selects a platform-specific image.
- Keep unintended secret files out of the build context instead of deleting them later.
prerequisites:
- m06-registry
objectives:
- docker.artifacts
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A Dockerfile copies .env and removes it in a later RUN instruction. Is the earlier layer necessarily
    free of that file?
  options:
  - No; earlier layer content can still contain it.
  - Yes; deleting a file rewrites all prior layers.
  - Only on ARM64 images.
  correct: 0
  explanation: Layers preserve prior filesystem changes. Preventing a secret from entering the build is different
    from hiding it in the final merged filesystem.
hints:
- Inspect the COPY scope and whether a .dockerignore exists.
- Exclude .env before building, or copy only app.py and VERSION.
- Rebuild for the native platform in DOCKER_DEFAULT_PLATFORM and recreate the API; deleting the file only from a later layer will still fail the artifact
  check.
sources:
- https://docs.docker.com/build/building/multi-platform/
- https://docs.docker.com/build/building/secrets/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The application runs without workspace mounts
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '[]'
  json_path:
  - '0'
  - Mounts
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: release
  title: The image serves the expected application release
  explanation: The image serves the expected application release
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  expected: dispatch-1
  json_path:
  - release
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: artifact-native
  title: The selected image is native to this host processor
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - artifact
    timeout: 90
  expectation: json
  json_path:
  - native
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
- id: artifact-excluded-secret
  title: No final-image layer contains the fake secret file
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - artifact
    timeout: 90
  expectation: json
  json_path:
  - excluded_secret
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- artifact-excluded-secret
