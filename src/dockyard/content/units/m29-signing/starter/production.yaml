# The production copy of the Dispatch API. Its image was built on someone's laptop
# and loaded straight onto the nodes; nobody can say exactly what it contains.
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata:
      labels:
        app: dispatch
    spec:
      automountServiceAccountToken: false
      containers:
      - name: api
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
