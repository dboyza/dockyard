id: m23-mission
revision: 1
module: 23
order: 4
title: 'Mission: recover the control plane'
summary: Fix the API server and scheduler, and restore a deleted object from an etcd snapshot, without
  rebuilding.
kind: mission
runtime: linux
nodes: 2
minutes: 65
outcomes:
- Plan a recovery order from evidence gathered on the node.
- Restore an original object from a snapshot while keeping the application’s data.
- Write a handoff that separates what was wrong, what changed, and what remains a risk.
prerequisites:
- m23-api
objectives:
- cka.components
- cka.nodes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The API is down and an object was deleted. Can you restore the etcd snapshot before fixing
    the API server?
  options:
  - Yes. The etcd tools run on the node through crictl and do not need the API.
  - No. Restoring etcd always needs kubectl.
  - No. The snapshot is stored in the API.
  correct: 0
  explanation: etcdctl and etcdutl talk to etcd or its files directly, so a restore works while the API
    server is broken.
hints:
- 'Start inside the control-plane VM: check the kubelet, list /etc/kubernetes/manifests, and read the
  logs of any container that keeps exiting.'
- Something is missing from the manifests directory; look under /var/lib/dockyard. Compare the API server’s
  --etcd-servers with where etcd listens.
- Fix the API server’s etcd address, move the scheduler manifest back, restore the snapshot into a new
  directory with the revision bump and compaction, switch etcd’s data hostPath, and run python wait-control-plane.py.
sources:
- https://etcd.io/docs/v3.6/op-guide/recovery/
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/static-pod/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.recovery
  - mission
  timeout: 180
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - mission
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced. A ConfigMap recreated from YAML
    has a new UID and does not count; bring back the original from the etcd snapshot. If nodes or the
    cluster were rebuilt, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node the kubelet service must be active, containers for etcd, the
    API server, the controller manager, and the scheduler must be running, and the API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - mission
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a; read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - mission
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node and that its manifest is in /etc/kubernetes/manifests; if
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-restored
  title: The original objects came back from the snapshot
  explanation: The deleted objects must have their original UIDs, etcd’s revision must be far ahead of
    the snapshot’s, and the snapshot’s old revision must be marked compacted.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - mission
    timeout: 240
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: 'The sentinel has not come back from the snapshot. The API and scheduler fixes do not restore
    deleted objects: restore /var/lib/etcd/dockyard-recovery.db into a new directory with --bump-revision=1000000000
    --mark-compacted and point the etcd manifest’s data hostPath at it.'
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.recovery
    - mission
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Get the control plane healthy first, then run sh bootstrap.sh to
    wait for Dispatch to recover and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any safe recovery order is accepted, as long as the original objects and data come back.
- The cluster’s state is checked, not your shell history; the handoff is for self-review.
failure_modes:
- An object recreated from YAML has a new UID.
- Pods that were already running do not show that the control plane can do new work.
- An etcd snapshot does not contain the database’s rows.
starter_failure_checks:
- recovery-components
- recovery-restored
- recovery-scheduled
