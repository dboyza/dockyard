id: m01-signals
revision: 1
module: 1
order: 3
title: Logs, signals, and honest exit codes
summary: Read Dispatch’s logs and give its process time to stop cleanly.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Use the logs and current state to answer different questions.
- Explain how Docker asks the main process to stop.
- Tell the difference between a clean exit and an available service.
prerequisites:
- m01-lifecycle
objectives:
- docker.signals
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You press Control-C while docker logs --follow is running. Which process normally stops?
  options:
  - The log viewer in your terminal.
  - The detached API process.
  - The Docker daemon.
  correct: 0
  explanation: Control-C targets the foreground log-viewing command. The detached application is controlled
    separately.
hints:
- First make a real HTTP request while the process is running.
- Use docker logs to find the request, then docker stop to request graceful shutdown.
- Inspect .State.Running and .State.ExitCode. The target is false and 0, with the container still present.
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - -v
  - '{{workspace}}:/app:ro'
  - -w
  - /app
  - '{{python_image}}'
  - python
  - app.py
checks:
- id: stopped
  title: The process has stopped
  explanation: This lesson ends with a deliberate stop, so the container should no longer be running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 'false'
  json_path:
  - '0'
  - State
  - Running
  diagnostic: The container is still running. Stop it with docker stop "$DOCKYARD_CONTAINER" and confirm
    with docker ps -a that its status begins with Exited.
- id: clean-exit
  title: Shutdown completed successfully
  explanation: Exit code 0 means the application received the stop signal and shut down cleanly rather
    than being killed or crashing.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '0'
  json_path:
  - '0'
  - State
  - ExitCode
  diagnostic: The container stopped with a nonzero exit code. Run docker ps -a to see the code and docker
    logs to see the last messages. Code 137 usually means the process was killed (for example with docker
    kill) instead of stopped. Start the container, make a request, and stop it with docker stop.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: request-log
  title: A successful HTTP request was logged
  explanation: The container's log should show the request you made, which is how you trace activity after
    the fact.
  command:
    args:
    - docker
    - logs
    - '{{container}}'
  output: combined
  expectation: contains
  expected: GET /healthz HTTP/1.1" 200
  json_path: []
  diagnostic: No successful request appears in this container's logs. Start the container, request /healthz
    with curl, and check docker logs for a line ending in 200 before you stop it. Removing and recreating
    the container discards its old logs.
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- stopped
- request-log
