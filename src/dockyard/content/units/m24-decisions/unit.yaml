id: m24-decisions
revision: 1
module: 24
order: 2
title: Work within resource, disruption, and access limits
summary: Bring the API back within an agreed budget, add a disruption budget, and narrow an over-privileged
  Role.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Work out total requests and limits for a number of replicas.
- Create a PodDisruptionBudget that allows safe maintenance.
- Restore a least-privilege Role and test it with the account’s own identity.
prerequisites:
- m24-triage
objectives:
- cka.resource-usage
- cka.rbac
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Each API copy requests 25m CPU and 32Mi memory. What do 4 copies request in total?
  options:
  - 100m CPU and 128Mi memory.
  - 25m CPU and 32Mi memory, shared between them.
  - 1 CPU and 512Mi memory.
  correct: 0
  explanation: 'Requests add up across copies: 4 × 25m is 100m, and 4 × 32Mi is 128Mi.'
hints:
- Read the API’s requests and limits with kubectl get deployment dispatch -o jsonpath, multiply by the
  number of copies, and test dispatch-reader with kubectl auth can-i.
- kubectl create pdb dispatch-operations --selector=app=dispatch,track=stable --min-available=1 creates
  the budget; the correct Role is in identity.yaml.
- Apply python render.py identity.yaml | kubectl apply -f -, create the PDB, scale the API to 2, and wait
  for the rollout.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/debug/debug-application/
- https://v1-35.docs.kubernetes.io/docs/tasks/run-application/configure-pdb/
- https://v1-35.docs.kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://v1-35.docs.kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.handoff
  - decisions
  timeout: 240
checks:
- id: handoff-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the incident must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - decisions
    timeout: 300
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the incident is missing or was replaced, or the database is not running,
    so the stored row could not be read. Fix the existing objects with small changes instead of deleting
    and recreating them or rebuilding the cluster; if that already happened, reset the lab.
- id: handoff-capacity
  title: The API fits the agreed replica, resource, and disruption budget
  explanation: The API must run 2 to 4 available copies with total requests within 1 CPU and 512 MiB,
    total memory limits within 1 GiB, limits at least their requests, and a dispatch-operations PDB for
    app=dispatch,track=stable that keeps one available.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - decisions
    timeout: 300
  expectation: json
  json_path:
  - capacity
  expected: 'true'
  diagnostic: 'The API is outside the budget. Check kubectl get deployment dispatch for 2 to 4 available
    copies, multiply its per-container requests and limits by the replica count, and check kubectl get
    pdb dispatch-operations -o yaml selects app: dispatch and track: stable with minAvailable 1, minAvailable
    50%, or maxUnavailable 1.'
- id: handoff-identity
  title: The inventory account can read Pods and nothing more
  explanation: Using the inventory Pod’s own token, listing Pods in dispatch must be allowed, and reading
    Secrets or Pods in another namespace refused. dispatch-reader must also be unable to create Pods,
    patch Deployments, or create RoleBindings.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - decisions
    timeout: 300
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: 'dispatch-reader has the wrong access. Look at kubectl get role dispatch-pod-reader -o yaml:
    it should have one rule allowing get, list, and watch on pods in the core group (""). Keep the existing
    ServiceAccount and RoleBinding, then test with kubectl auth can-i ... --as=system:serviceaccount:dispatch:dispatch-reader.'
- id: handoff-workflow
  title: A new job from the browser and the frontend completes
  explanation: Real jobs submitted through the lab’s Dispatch port and from the trusted frontend on another
    node must be processed and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - decisions
    timeout: 300
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: 'A job did not complete. Follow the request step by step: check kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch lists API Pods, then submit a job and, if it stays queued,
    check kubectl get deployment worker and kubectl logs deployment/worker.'
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any replica count from 2 to 4 is accepted, and so is any equivalent least-privilege Role.
- The budget, real authorization results, and a new job are checked, not your shell history.
failure_modes:
- A wide-open Role keeps a tool working while exposing Secrets.
- A PDB limits voluntary evictions only; it does not prevent crashes or node failures.
- Two copies on one worker do not survive losing that worker.
starter_failure_checks:
- handoff-capacity
- handoff-identity
