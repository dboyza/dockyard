apiVersion: v1
kind: LimitRange
metadata:
  name: dispatch-defaults
  namespace: dispatch
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dispatch-budget
  namespace: dispatch
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '6'
    limits.memory: 6Gi
    pods: '24'
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dispatch
  namespace: dispatch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dispatch
      track: stable
