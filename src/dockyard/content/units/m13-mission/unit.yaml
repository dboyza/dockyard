id: m13-mission
revision: 1
module: 13
order: 4
title: 'Mission: drain a worker without an outage'
summary: Fix placement, autoscaling, and the disruption budget, then drain a worker under load.
kind: mission
runtime: kubernetes
minutes: 65
outcomes:
- Combine placement, resources, and autoscaling on your own.
- Set a disruption budget that allows safe maintenance.
- Drain a node and check the application kept serving.
prerequisites:
- m13-autoscaling
objectives:
- kubernetes.scheduling
- kubernetes.autoscaling
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Four copies are healthy and the PDB requires all four to stay available. What happens when
    you drain a worker?
  options:
  - The drain is blocked, because no Pod may be evicted.
  - The PDB is ignored.
  - The HPA switches the PDB off.
  correct: 0
  explanation: A PDB that allows no disruption blocks every voluntary eviction, exactly as written.
hints:
- Fix placement and autoscaling before trying the drain.
- The API needs the apps pool affinity and toleration, the HPA must target dispatch, and minAvailable
  should be 2.
- Wait for four replicas, run python drain-proof.py, and read drain-evidence.json.
sources:
- https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
- https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
- https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
- https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 240
checks:
- id: capacity-resources
  title: The API has sensible requests and limits in force
  explanation: Each API container must request 25m-100m CPU and 32-128Mi memory, have limits no higher
    than 1 CPU and 512Mi, be Burstable, and have those limits really applied inside the container.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - resources
  expected: 'true'
  diagnostic: 'The API’s resources are outside the allowed range, or the Pods are not all available. Check
    the api container’s resources in the Deployment: requests of about 50m CPU and 64Mi memory, limits
    of about 300m CPU and 192Mi. Then run kubectl get pods -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass.'
- id: capacity-budget
  title: The namespace applies defaults and a CPU budget
  explanation: LimitRange dispatch-defaults must fill in requests and limits for a container that sets
    none, and ResourceQuota dispatch-budget must reject a Pod that asks for too much CPU.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - budget
  expected: 'true'
  diagnostic: The namespace rules are missing or not working. Run kubectl get limitrange,resourcequota
    and kubectl describe quota dispatch-budget. Both must exist as in the lesson, and the quota’s requests.cpu
    must be no more than 2.
- id: capacity-placement
  title: The API runs across both dedicated workers
  explanation: The API must require dockyard.pool=apps, tolerate its taint, keep a hard spread rule by
    hostname, and have its Pods split evenly across both workers.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - placement
  expected: 'true'
  diagnostic: The API is not spread across both workers. Run kubectl get pods -l app=dispatch,track=stable
    -o wide to see where each Pod is, and kubectl describe pod on any Pending one for its FailedScheduling
    message. Check the required affinity (dockyard.pool In [apps]), the toleration (dockyard.pool=apps:NoSchedule),
    and the topology spread (maxSkew 1, kubernetes.io/hostname, DoNotSchedule).
- id: capacity-scaling
  title: Real CPU load scales the API to four copies
  explanation: The HPA must target Deployment dispatch with 2-4 replicas and a 50% CPU target, be active,
    measure over 50%, and have four available API Pods while the load runs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - scaling
  expected: 'true'
  diagnostic: 'The HPA has not scaled Dispatch to four copies from real measurements. Run kubectl describe
    hpa dispatch: check scaleTargetRef names Deployment dispatch, that ScalingActive is True, and that
    current utilization is above target. kubectl top pods should show CPU for each API Pod, and the practice-load
    Deployment must be running.'
- id: capacity-disruption
  title: The disruption budget protects two copies
  explanation: PodDisruptionBudget dispatch must select the API Pods and require minAvailable 2, with
    at least two healthy Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - disruption
  expected: 'true'
  diagnostic: 'The disruption budget is not right. Run kubectl get pdb dispatch -o yaml: minAvailable
    should be 2 and its selector should match the stable API Pods’ labels.'
- id: capacity-drain
  title: The recorded drain kept Dispatch ready and replaced the worker’s Pods
  explanation: drain-evidence.json must show a drain of an application worker in this lab, at least five
    readiness samples with no failures, and the drained Pods replaced by new ones.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - capacity
    timeout: 120
  expectation: json
  json_path:
  - drain
  expected: 'true'
  diagnostic: The drain record is missing or shows a problem. Fix placement, scaling, and the budget first,
    then run python drain-proof.py again and read its output. If it reports failed samples, check the
    API had four ready copies before starting.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- metrics
checkpoint: dispatch-capacity-v1
images:
- python
- postgres
- redis
- busybox
- metrics_server
nodes: 3
alternatives:
- Equivalent resource quantities, manifests, and scheduling rules are accepted when the declared live
  capacity and placement behavior holds.
failure_modes:
- A toleration permits placement but does not require it.
- HPA needs usable measurements and resource requests; replica declarations alone do not demonstrate autoscaling.
- A PDB protects voluntary eviction, not every possible outage.
starter_failure_checks:
- capacity-placement
- capacity-scaling
- capacity-disruption
- capacity-drain
