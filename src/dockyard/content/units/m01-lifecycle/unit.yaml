id: m01-lifecycle
revision: 1
module: 1
order: 2
title: Create, start, stop, inspect
summary: Separate container identity from process lifetime and bring a prepared Dispatch container online.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Distinguish created, running, and exited states.
- Use inspection to find image identity, command, and port mappings.
- Start an existing container without confusing it with a new instance.
prerequisites:
- m01-processes
objectives:
- docker.lifecycle
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A stopped container still owns a name. What happens if you docker run another container using that name?
  options:
  - Docker reports a name conflict.
  - Docker automatically restarts the old instance.
  - Docker merges their writable layers.
  correct: 0
  explanation: A name belongs to a container until that container is removed or renamed, regardless of whether its
    process is running.
hints:
- Check all lifecycle states with docker ps -a.
- The prepared resource already exists, so use docker start rather than docker run.
- Run docker start "$DOCKYARD_CONTAINER", then curl "http://127.0.0.1:$DOCKYARD_PORT/healthz".
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - create
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - -v
  - '{{workspace}}:/app:ro'
  - -w
  - /app
  - '{{python_image}}'
  - python
  - app.py
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local Mac can reach the published port
  explanation: Only the local Mac can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
