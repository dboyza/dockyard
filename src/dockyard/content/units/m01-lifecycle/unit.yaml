id: m01-lifecycle
revision: 2
module: 1
order: 2
title: Create, start, stop, inspect
summary: Stop and start the same container, then check which parts of it stay the same.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Tell whether a container is created, running, or stopped.
- Find the image, command, and ports in Docker’s inspection output.
- Start an existing container and confirm that its ID stays the same.
prerequisites:
- m01-processes
objectives:
- docker.lifecycle
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A stopped container still owns a name. What happens if you docker run another container using
    that name?
  options:
  - Docker reports a name conflict.
  - Docker automatically restarts the old instance.
  - Docker merges their writable layers.
  correct: 0
  explanation: A name belongs to a container until that container is removed or renamed, regardless of
    whether its process is running.
hints:
- Check all lifecycle states with docker ps -a.
- The prepared resource already exists, so use docker start rather than docker run.
- Run docker start "$DOCKYARD_CONTAINER", then curl "http://127.0.0.1:$DOCKYARD_PORT/healthz".
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - create
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - --label
  - io.dockyard.prepared=true
  - -p
  - 127.0.0.1:{{port}}:8080
  - -v
  - '{{workspace}}:/app:ro'
  - -w
  - /app
  - '{{python_image}}'
  - python
  - app.py
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: original-container
  title: The running container is the one Dockyard prepared
  explanation: This lesson is about starting an existing container. A container made again with docker
    run is a new object with a new ID, even when it uses the same name and settings.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.prepared
  expected: 'true'
  diagnostic: The container named {{container}} is not the one Dockyard prepared. It has been
    removed and made again, probably with docker run, so it has a new ID. Choose Reset to get the prepared
    container back, then bring it online with docker start.
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- process-running
- application-response
