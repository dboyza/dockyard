id: m18-mission
revision: 1
module: 18
order: 4
title: 'Capstone: recover and harden Dispatch'
summary: Fix a failed database, an old password, a vulnerable image, and a stale network rule together.
kind: mission
runtime: kubernetes
nodes: 2
minutes: 90
outcomes:
- Plan the order of several repairs from the evidence.
- Prove each security and recovery property separately.
- Write a handoff without exposing secrets.
prerequisites:
- m18-recovery
objectives:
- kubernetes.security
- kubernetes.storage
- platform.delivery
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The restored API answers health checks, but the old password still works. Is the capstone
    complete?
  options:
  - No; credential revocation requires separate evidence.
  - Yes; health checks cover every security property.
  - Yes; an encrypted backup revokes old credentials.
  correct: 0
  explanation: Availability, data recovery, artifact hygiene, and credential revocation are separate properties.
hints:
- Look at the Pods, the db Service selector, the frontend network policy, and the scan before changing
  anything.
- The live allow-business-reads policy differs from network.yaml, and the database must be restored before
  its password is rotated.
- Re-apply network.yaml through render.py, then run python restore.py, python rotate.py, and, after setting
  build.json, sh repair-image.sh.
sources:
- https://trivy.dev/latest/docs/target/container_image/
- https://trivy.dev/latest/docs/supply-chain/sbom/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://www.postgresql.org/docs/current/backup-dump.html
- https://cryptography.io/en/latest/hazmat/primitives/aead/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 360
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - scan.py
  - before
  timeout: 240
- args:
  - python
  - backup.py
  timeout: 180
- args:
  - python
  - inject-network-fault.py
  timeout: 30
checks:
- id: hardening-images
  title: The vulnerable library is gone from the image and running Pods
  explanation: A fresh scan of the current image must not find CVE-2022-29217, the after reports must
    agree, and the running API and worker must not have PyJWT installed.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - images
  expected: 'true'
  diagnostic: The library is still present somewhere. Check include_legacy_dependency is false in build.json,
    then run sh repair-image.sh, which rebuilds, restarts the API and worker, and scans again. A rebuilt
    image changes nothing until the Pods restart.
- id: hardening-rotation
  title: The old password fails and the new one works
  explanation: Against the same running database, the current Secret’s password must log in and the original
    password must be rejected.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - rotation
  expected: 'true'
  diagnostic: The rotation is incomplete. If the old password still works, run python rotate.py. If the
    new one fails too, check the database Pod is running first; a stopped database rejects everything
    and proves nothing. Do not re-apply the original Secret.
- id: hardening-recovery
  title: The restored backup is serving from separate storage
  explanation: The encrypted backup must decrypt and reject tampering, the db Service must point at the
    restored database on a different volume, the original claim must be intact, and the known record must
    be readable through the frontend.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - recovery
  expected: 'true'
  diagnostic: 'The restore is not complete. Run python restore.py and read its output, then check kubectl
    get statefulsets,pvc and kubectl get service db -o yaml: the Service should select the restored database,
    and the original claim should still exist.'
- id: hardening-workflow
  title: A job from the frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the frontend did not complete. Check the database Pod is running and selected
    by the db Service, that the API and worker have the current password, and that the frontend network
    policy names the current client label.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- scanner
checkpoint: dispatch-hardening-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent image builds, credential administration, and restore commands are accepted when actual runtime
  and evidence agree.
- No exact command history or YAML formatting is required; preserve the documented backup and report formats.
failure_modes:
- A changed tag leaves old running containers untouched.
- A Secret update leaves the database or consumers on a different credential.
- Reusing the original claim does not prove an independent restore.
starter_failure_checks:
- hardening-images
- hardening-rotation
- hardening-recovery
- hardening-workflow
