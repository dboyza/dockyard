id: m01-processes
revision: 2
module: 1
order: 1
title: A container is a running process
summary: Start Dispatch in a container, send it a request, and see what changes when you stop it.
kind: lesson
runtime: docker
minutes: 25
outcomes:
- Explain why stopping a container does not remove its image.
- Run Dispatch in a container while keeping your terminal free for other commands.
- Connect a local port to Dispatch and check its HTTP response.
prerequisites: []
objectives:
- docker.lifecycle
- docker.ports
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You stop the container running Dispatch. What happens to the image used to start it?
  options:
  - The image remains available for a new container.
  - Docker deletes the image along with the process.
  - The image becomes the stopped container's filesystem.
  correct: 0
  explanation: An image is a reusable template. Stopping a container stops its processes; it does not
    remove the image. A container also has its own writable layer, which is distinct from the image.
hints:
- The API source is already in app.py. Use a Python image, mount this workspace at /app, and make python
  app.py the container's main process.
- The process listens on port 8080 inside the container. Publish the assigned DOCKYARD_PORT on 127.0.0.1
  to container port 8080, and use DOCKYARD_CONTAINER for the name.
- A complete command is in the worked example. Check that the workspace mount uses "$DOCKYARD_WORKSPACE:/app:ro",
  the working directory is /app, and the final arguments are python app.py.
sources:
- https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare: []
capabilities:
- docker
- python-image
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
checkpoint: dispatch-process-v1
alternatives:
- docker run or docker create followed by docker start are both accepted.
- Any host-side shell syntax that meets the observed process, identity, and endpoint contract is accepted.
failure_modes:
- A one-shot command exits immediately.
- Publishing the wrong container port makes the process unreachable.
- Omitting the loopback address exposes the service more widely than intended.
starter_failure_checks:
- process-running
- lab-identity
- application-response
- published-port
- loopback-binding
