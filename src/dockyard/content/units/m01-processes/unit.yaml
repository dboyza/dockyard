id: m01-processes
revision: 1
module: 1
order: 1
title: A container is a running process
summary: Start the Dispatch API and connect the image, container, process, and published port to observable behavior.
kind: lesson
runtime: docker
minutes: 25
outcomes:
  - Explain why an image remains available after its container stops.
  - Run a supplied application as a foreground process inside a detached container.
  - Publish an application port on loopback and verify a real HTTP response.
prerequisites: []
objectives: [docker.lifecycle, docker.ports]
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You stop the container running Dispatch. What happens to the image used to start it?
  options:
    - The image remains available for a new container.
    - Docker deletes the image along with the process.
    - The image becomes the stopped container's filesystem.
  correct: 0
  explanation: An image is a reusable template. Stopping a container stops its processes; it does not remove the image. A container also has its own writable layer, which is distinct from the image.
hints:
  - The API source is already in app.py. Use a Python image, mount this workspace at /app, and make python app.py the container's main process.
  - The process listens on port 8080 inside the container. Publish the assigned DOCKYARD_PORT on 127.0.0.1 to container port 8080, and use DOCKYARD_CONTAINER for the name.
  - 'A complete command is in the worked example. Check that the workspace mount uses "$DOCKYARD_WORKSPACE:/app:ro", the working directory is /app, and the final arguments are python app.py.'
sources:
  - https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  - https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare: []
capabilities: [docker, python-image]
checks:
  - id: process-running
    title: Dispatch's container is running
    explanation: The container must still be running when its application is checked.
    command:
      args: [docker, inspect, '{{container}}']
    expectation: json
    json_path: ['0', State, Running]
    expected: 'true'
    diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process exits.
  - id: lab-identity
    title: The container belongs to this lab
    explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
    command:
      args: [docker, inspect, '{{container}}']
    expectation: json
    json_path: ['0', Config, Labels, io.dockyard.lab]
    expected: '{{lab_id}}'
    diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an unrelated container.
  - id: application-response
    title: A request reaches the real API
    explanation: A running process alone is insufficient; the application must respond through the published port.
    command:
      args: [curl, --fail, --silent, --show-error, --max-time, '3', 'http://127.0.0.1:{{port}}/healthz']
    expectation: json
    json_path: [service]
    expected: dispatch
    diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container listens on 8080.
  - id: published-port
    title: The assigned endpoint belongs to this container
    explanation: The responding host port must actually be published by the assessed container.
    command:
      args: [docker, inspect, '{{container}}']
    expectation: json
    json_path: ['0', NetworkSettings, Ports, 8080/tcp, '0', HostPort]
    expected: '{{port}}'
    diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
