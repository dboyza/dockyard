id: m17-policies
revision: 1
module: 17
order: 4
title: Enforce a platform rule with an admission policy
summary: Bind a ValidatingAdmissionPolicy so the API server refuses Deployments without memory limits
  in Dispatch's namespace, and nowhere else.
kind: lesson
runtime: kubernetes
nodes: 2
minutes: 35
outcomes:
- Explain where admission control fits between authorization and storage.
- Write a ValidatingAdmissionPolicy rule as a CEL expression, and bind it with Deny.
- Scope a binding to particular namespaces, and test it with server-side dry runs.
prerequisites:
- m17-contexts
objectives:
- kubernetes.security
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A ValidatingAdmissionPolicy exists, but its binding uses validationActions [Warn]. You create
    a Deployment that breaks the rule. What happens?
  options:
  - It is created, and kubectl prints a warning.
  - It is refused with the policy's message.
  - Nothing happens until you restart the API server.
  correct: 0
  explanation: The binding decides what a failed check does. Warn lets the request through with a warning;
    only Deny refuses it.
hints:
- Try kubectl create --dry-run=server -f with a Deployment that has no memory limit, in dispatch and in
  sandbox, and read what comes back.
- The policy itself is fine. Look at the binding's validationActions and at which namespaces it applies
  to.
- 'In policy.yaml, set the binding''s validationActions to [Deny] and add matchResources.namespaceSelector.matchLabels
  with kubernetes.io/metadata.name: dispatch, then run sh run.sh.'
sources:
- https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
- https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
- https://kubernetes.io/docs/reference/using-api/cel/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: policy-deny
  title: A Deployment without a memory limit is refused in dispatch
  explanation: A server-side dry run of a Deployment whose container has no memory limit must be refused
    in the dispatch namespace by a ValidatingAdmissionPolicy.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - policies
    timeout: 120
  expectation: json
  json_path:
  - deny
  expected: 'true'
  diagnostic: The API server accepted a Deployment without a memory limit in dispatch. A binding with
    validationActions [Warn] or [Audit] only reports; use [Deny]. Check with kubectl create --dry-run=server
    -f and a Deployment that has no memory limit.
- id: policy-allow
  title: A Deployment with a memory limit is still accepted
  explanation: A server-side dry run of a Deployment whose container has a memory limit must succeed in
    dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - policies
    timeout: 120
  expectation: json
  json_path:
  - allow
  expected: 'true'
  diagnostic: A compliant Deployment was refused. Check the CEL expression, which should require a memory
    limit and nothing more.
- id: policy-scope
  title: The rule applies only to Dispatch's namespace
  explanation: A Deployment without a memory limit must still be accepted in the sandbox namespace.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - policies
    timeout: 120
  expectation: json
  json_path:
  - scope
  expected: 'true'
  diagnostic: The rule also refuses Deployments outside dispatch. Limit the binding with matchResources.namespaceSelector,
    for example by matching the kubernetes.io/metadata.name label to dispatch.
- id: configuration-processing
  title: A new job is completed
  explanation: Dockyard submits a real job and waits for a worker to finish it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - policies
    timeout: 120
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: A new job was not completed. Check that Dispatch's Deployments still roll out with kubectl
    get pods, then kubectl logs deployment/worker.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-security-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any policy and binding names, CEL formulation, and namespace selection are accepted. The API server
  must refuse Deployments with no limits in dispatch, accept compliant ones, and leave other namespaces
  alone.
failure_modes:
- A policy without a binding, or a binding that only warns, refuses nothing.
- A binding with no namespace selection applies to the whole cluster.
- Admission runs when objects are created or updated; it does not change what is already running.
starter_failure_checks:
- policy-deny
