id: m21-drain
revision: 1
module: 21
order: 1
title: Drain a node for maintenance
summary: Drain a worker safely by adjusting its disruption budget, without bypassing evictions.
kind: lesson
runtime: linux
nodes: 3
native_version: 1.35.8
minutes: 40
outcomes:
- Explain cordon, drain, eviction, and rescheduling as separate steps.
- Set a disruption budget that permits safe maintenance.
- Drain a node and confirm workloads moved and the app still works.
prerequisites:
- m20-mission
objectives:
- cka.lifecycle
- cka.nodes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A cordoned worker still has API Pods. What explains this?
  options:
  - Cordoning blocks new scheduling but does not evict existing Pods.
  - Cordoning deletes every Pod immediately.
  - The API cannot report cordoned nodes.
  correct: 0
  explanation: Cordoning blocks new scheduling but does not evict existing Pods.
hints:
- Inspect the target worker, workload owners, placement, and the disruption budget.
- The initial budget protects both replicas; retain one while allowing a voluntary eviction.
- Set minAvailable to one, drain only worker2 with the documented flags, and wait for two API replicas
  elsewhere.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/reference/using-api/deprecation-guide/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-drain.py
  timeout: 210
- args:
  - python
  - setup-maintenance.py
  timeout: 90
checks:
- id: maintenance-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, marker ConfigMap, and the database row stored before maintenance
    must all be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - drain
    timeout: 180
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before maintenance is missing or was replaced. Maintenance must change the
    existing cluster, not rebuild it; if objects were deleted or the cluster was recreated, reset the
    lab and try again.
- id: maintenance-drained
  title: The extra worker is drained with a sensible budget
  explanation: worker2 must be cordoned with no ordinary Pods left, the disruption budget must still select
    the stable API and require at least one available, and two API copies must be available elsewhere.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - drain
    timeout: 180
  expectation: json
  json_path:
  - drained
  expected: 'true'
  diagnostic: The drain is not complete. Wait for kubectl rollout status deployment/dispatch so both API
    copies are running elsewhere, then check kubectl get pods -A --field-selector spec.nodeName=NODE for
    anything left, kubectl get nodes for SchedulingDisabled, and that the budget still has minAvailable
    1 for the stable API.
- id: maintenance-workflow
  title: A job from the frontend completes after maintenance
  explanation: A real job submitted from the frontend must cross the nodes, be processed, and be saved.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - drain
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check every node is Ready and uncordoned, run sh bootstrap.sh to
    wait for Dispatch to recover, and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors, package command formatting, and diagnostic sequences are accepted.
- Runtime outcome and original identities are assessed; shell history is not graded.
- A matching budget using minAvailable 1, minAvailable 50%, or maxUnavailable 1 is accepted.
failure_modes:
- A newer host client does not prove the server or kubelets changed.
- Replacing cluster objects can hide data loss and does not establish maintenance continuity.
- A changed file does not prove a running process adopted it.
starter_failure_checks:
- maintenance-drained
