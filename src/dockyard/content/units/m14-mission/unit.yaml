id: m14-mission
revision: 1
module: 14
order: 4
title: 'Mission: three tools, three environments'
summary: Fix a Kustomize overlay, a Helm release, and an operator, each owning its own part of Dispatch.
kind: mission
runtime: kubernetes
minutes: 65
outcomes:
- Fix each environment at its own source of truth.
- Recover a Helm release without disturbing development.
- Show operator-owned workers processing jobs.
prerequisites:
- m14-operators
objectives:
- kubernetes.packaging
- kubernetes.extensions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: How should you make a lasting change to the number of operator-managed workers?
  options:
  - Edit the WorkerPool.
  - Scale the generated Deployment by hand.
  - Delete the Helm history.
  correct: 0
  explanation: Change the source the controller reconciles from; manual edits to what it generates are
    undone.
hints:
- 'Take each environment separately: dispatch (Kustomize), staging (Helm), and the WorkerPool controller.'
- The overlay needs 2 replicas and development; Helm needs a rollback to revision 1 and fixed values;
  the controller needs 1 replica.
- After fixing all three, restart the development API, run python operator-proof.py, and check /config
  in both namespaces.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://helm.sh/docs/intro/using_helm/
- https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
- https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: packaging-overlay
  title: The development overlay and the running app agree
  explanation: The rendered development overlay must give Dispatch two replicas and environment development
    in namespace dispatch, and the running Pods must report that environment.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - overlay
  expected: 'true'
  diagnostic: Development does not match yet. Run kubectl kustomize kustomize/overlays/development and
    check the dispatch replicas (2) and the ConfigMap environment (development). Apply it, then run kubectl
    rollout restart deployment/dispatch so the Pods pick up the new environment value.
- id: packaging-release
  title: The staging Helm release is healthy with the right values
  explanation: The latest staging revision must be deployed, both Helm’s values and values-practice.yaml
    must say 2 replicas and environment staging, and Dispatch in staging must report staging.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - release
  expected: 'true'
  diagnostic: 'The staging release is not right yet. Check helm history dispatch -n staging, helm get
    values dispatch -n staging, and values-practice.yaml: both must have api.replicas 2 and environment
    staging. Then check kubectl get pods -n staging.'
- id: packaging-rollback
  title: Helm history shows the rollback
  explanation: After the failed revision, the history must contain a revision created by helm rollback.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - rollback
  expected: 'true'
  diagnostic: No rollback revision was found. Use helm rollback dispatch 1 -n staging --wait rather than
    reinstalling or scaling by hand, then check helm history dispatch -n staging.
- id: packaging-extension
  title: The WorkerPool is Ready and owns two workers
  explanation: The WorkerPool CRD must keep its schema, the pool must ask for 2 replicas with a current
    Ready condition, and it must own dispatch-workers with two available Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - extension
  expected: 'true'
  diagnostic: The WorkerPool is not Ready or its workers are missing. Check kubectl get deployment workerpool-controller
    (it needs one ready replica) and kubectl logs deployment/workerpool-controller, then kubectl get workerpool
    dispatch -o yaml for its status and conditions.
- id: packaging-reconciliation
  title: The controller repaired a manual change
  explanation: operator-proof.py must have recorded the generated Deployment being scaled down and the
    controller restoring it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - reconciliation
  expected: 'true'
  diagnostic: No successful drift repair is recorded. Once the WorkerPool is Ready, run python operator-proof.py
    and read its output.
- id: packaging-workers
  title: The operator’s workers finish a new job
  explanation: Dockyard submits a real job and checks it is completed by one of the WorkerPool’s Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: The job was not completed by an operator-owned worker. Check kubectl get pods -l app=worker,
    and that the ordinary worker Deployment is still at zero replicas while dispatch-workers has two.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- helm
- workerpool
checkpoint: dispatch-packaging-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent overlay patches and chart formatting are accepted when rendered and live values agree.
- The managed workload must retain the real WorkerPool UID ownership and process work after the recorded
  drift rehearsal.
failure_modes:
- Rendering a resource does not deploy it.
- A deployed Helm release can still declare an unavailable application.
- A CRD alone does not implement a reconciliation loop.
starter_failure_checks:
- packaging-overlay
- packaging-release
- packaging-rollback
- packaging-extension
- packaging-reconciliation
- packaging-workers
