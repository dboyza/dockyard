id: m09-mission
revision: 1
module: 9
order: 4
title: 'Mission: configure two isolated environments'
summary: Demonstrate independent configuration, credentials, and workload identities.
kind: mission
runtime: kubernetes
minutes: 55
outcomes:
- Deploy separately configured namespace environments from one image.
- Verify application behavior and identity boundaries.
- Document configuration refresh and credential handling.
prerequisites:
- m09-identities
objectives:
- kubernetes.configuration
- kubernetes.identity
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Two namespaces contain a Service called dispatch. How can a client choose the preview Service
    explicitly?
  options:
  - Use dispatch.preview.svc.cluster.local.
  - The names must be globally unique, so this cannot happen.
  - The current terminal directory selects the Service.
  correct: 0
  explanation: Service DNS includes the namespace and distinguishes identically named services.
hints:
- Treat each namespace as a complete environment and inspect it explicitly with -n.
- Repair ConfigMap and credential references first, then verify the inventory binding independently.
- Apply the repaired primary manifests and preview.yaml; wait for both API and worker Deployments, then
  test each namespace's Service.
sources:
- https://kubernetes.io/docs/concepts/configuration/configmap/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://kubernetes.io/docs/concepts/security/service-accounts/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
checks:
- id: configuration-config
  title: The process and mounted file consume the intended ConfigMap
  explanation: Inspect actual configuration delivery, process behavior, and API authorization.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - config
  expected: 'true'
  diagnostic: Inspect the ConfigMap, Pod references, mounted file, and process environment. Restart the
    Deployment after changing environment-based configuration.
- id: configuration-secret
  title: The application authenticates using its mounted Secret
  explanation: Inspect actual configuration delivery, process behavior, and API authorization.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - secret
  expected: 'true'
  diagnostic: Inspect the Secret key and read-only volume reference without printing credentials; the
    API must authenticate to its database using the mounted file.
- id: configuration-processing
  title: A fresh job completes through the configured stack
  explanation: Inspect actual configuration delivery, process behavior, and API authorization.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: Inspect the actual resource state and application response, then reconcile the relevant
    workload.
- id: configuration-identity
  title: The real workload identity has only the required access
  explanation: Inspect actual configuration delivery, process behavior, and API authorization.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: Verify the ServiceAccount, namespace-scoped binding, actual list request, and denied Secret
    or cross-namespace access.
- id: configuration-preview
  title: The preview environment has independent configuration and working jobs
  explanation: Inspect actual configuration delivery, process behavior, and API authorization.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - preview
  expected: 'true'
  diagnostic: Apply and inspect the preview namespace separately, including its own configuration, Secret,
    Services, database, and workers.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-config-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent resource definitions are accepted when actual delivery, application behavior, and allowed/denied
  API requests satisfy the contract.
failure_modes:
- A ConfigMap or Secret existing in the API does not prove a running process consumes it.
- Administrator permissions do not demonstrate workload authorization.
starter_failure_checks:
- configuration-config
- configuration-secret
- configuration-identity
- configuration-preview
