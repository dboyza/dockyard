id: i08-pending-claim
revision: 1
module: 11
order: 90
title: The archive claim stays Pending, and its Pod never starts
summary: A new archiver never starts and its claim stays Pending, although storage and the rest of Dispatch
  work.
kind: incident
runtime: kubernetes
minutes: 35
outcomes:
- Read claim and Pod events together to find why storage is not provisioned.
- Explain how wait-for-consumer binding depends on scheduling.
- Fix the placement and prove the claim stores and shares a file.
prerequisites:
- m11-mission
objectives:
- cka.provisioning
- cka.volume-policies
- ckad.volumes
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A claim using WaitForFirstConsumer is Pending, and its only Pod is also Pending. Where should
    you look first?
  options:
  - Why the Pod cannot be scheduled.
  - Restart the storage provisioner.
  - Delete and recreate the claim.
  correct: 0
  explanation: With wait-for-consumer binding, the claim waits for its Pod to be scheduled. Find out what
    is stopping the Pod.
hints:
- Read the claim events, StorageClass binding mode, and consumer scheduling events together.
- WaitForFirstConsumer needs an eligible consumer node. Compare the archiver node selector with actual
  node labels.
- Schedule the archiver onto the node with the warm storage tier (or another valid placement fix), then
  check the original claim binds and keeps a new file.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 360
checks:
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - claim
    timeout: 120
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s data-db-0 claim, or the original job is gone. If
    they were deleted or replaced, reset the lab and repair it in place instead.
- id: incident-available
  title: Two API copies are available
  explanation: The dispatch Deployment must still have two ready copies.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - claim
    timeout: 120
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch.
- id: incident-route
  title: The Service reaches exactly the two API Pods
  explanation: The dispatch Service must still select exactly the two ready API Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - claim
    timeout: 120
  expectation: json
  json_path:
  - route
  expected: 'true'
  diagnostic: The Service no longer reaches exactly the two API Pods. Compare kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch with kubectl get pods -l app=dispatch.
- id: incident-workflow
  title: A new job is completed and saved
  explanation: Dockyard submits a real job and checks PostgreSQL stores the worker’s result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - claim
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running and read kubectl logs deployment/worker.
- id: incident-contract
  title: The archive claim is bound and shares a new file
  explanation: The original archive claim must be Bound, the archiver must mount it at /archive, and a
    separate Pod must read a file written through that mount.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - claim
    timeout: 120
  expectation: json
  json_path:
  - contract
  expected: 'true'
  diagnostic: The archive claim is not bound or not shared. Run kubectl describe pvc archive and kubectl
    describe pod -l app=archiver, and read the Events. Compare the archiver’s nodeSelector with kubectl
    get nodes --show-labels. Keep the original claim; do not swap in an emptyDir.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent scoped repairs are accepted when the observed outcomes and explicit budgets hold.
failure_modes:
- Healthy process state alone does not demonstrate a working request path or completed background job.
starter_failure_checks:
- incident-contract
