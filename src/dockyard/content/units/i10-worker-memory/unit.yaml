id: i10-worker-memory
revision: 1
module: 13
order: 90
title: Jobs wait while the workers keep restarting
summary: After a memory settings change, the workers keep restarting and no jobs finish.
kind: incident
runtime: kubernetes
minutes: 35
outcomes:
- Find why a container restarted from its last state and events.
- Explain the difference between a memory request and a memory limit.
- Choose a memory limit with room for the real working set, and confirm jobs finish.
prerequisites:
- m13-mission
objectives:
- ckad.debugging
- cka.resource-usage
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: 'A worker keeps restarting and describe pod shows Last State: OOMKilled. What does that tell
    you?'
  options:
  - It used more memory than its limit.
  - Its liveness probe failed.
  - Its image is missing.
  correct: 0
  explanation: OOMKilled means the kernel stopped the container for exceeding its memory limit. Probe
    failures and image problems show different reasons.
hints:
- Inspect the previous termination reason and the worker memory limit before changing restart policy.
- The supplied workload retains an 80 MiB working set in addition to its Python runtime and dependencies.
  A request does not raise the hard limit.
- Keep the supplied processing workload and two workers. Choose a bounded 128-256 MiB memory limit, wait
  for a stable rollout, and verify a fresh completed job.
sources:
- https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 360
checks:
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - memory
    timeout: 120
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s data-db-0 claim, or the original job is gone. If
    they were deleted or replaced, reset the lab and repair it in place instead.
- id: incident-available
  title: Two API copies are available
  explanation: The dispatch Deployment must still have two ready copies.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - memory
    timeout: 120
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch.
- id: incident-route
  title: The Service reaches exactly the two API Pods
  explanation: The dispatch Service must still select exactly the two ready API Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - memory
    timeout: 120
  expectation: json
  json_path:
  - route
  expected: 'true'
  diagnostic: The Service no longer reaches exactly the two API Pods. Compare kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch with kubectl get pods -l app=dispatch.
- id: incident-workflow
  title: A new job is completed and saved
  explanation: Dockyard submits a real job and checks PostgreSQL stores the worker’s result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - memory
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: 'A new job was not completed. Run kubectl get pods -l app=worker: if RESTARTS keeps rising,
    kubectl describe pod on one and read its Last State and Reason.'
- id: incident-contract
  title: The workers have a bounded memory limit and stay up
  explanation: Two workers must keep their 80 MiB working set, with a memory limit of 128-256 MiB, a request
    no larger than the limit, and no further restarts.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - memory
    timeout: 120
  expectation: json
  json_path:
  - contract
  expected: 'true'
  diagnostic: The workers’ memory settings are outside the required range or they are still restarting.
    Set the worker container’s memory limit between 128Mi and 256Mi with a request no larger, apply it,
    and watch kubectl get pods -l app=worker for a few minutes.
capabilities:
- observe-container-restarts
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent scoped repairs are accepted when the observed outcomes and explicit budgets hold.
failure_modes:
- Healthy process state alone does not demonstrate a working request path or completed background job.
starter_failure_checks:
- incident-contract
- incident-workflow
