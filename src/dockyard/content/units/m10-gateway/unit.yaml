id: m10-gateway
revision: 1
module: 10
order: 3
title: Separate gateways from application routes
summary: Inspect attachment, resolved references, and host routing through Gateway API.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Explain GatewayClass, Gateway, and HTTPRoute ownership.
- Diagnose route attachment using current status conditions.
- Verify matching and unmatched hostnames with actual requests.
prerequisites:
- m10-ingress
objectives:
- kubernetes.services
- kubernetes.routing
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: An HTTPRoute has valid YAML but refers to a nonexistent parent Gateway. What should you investigate
    first?
  options:
  - Its parent attachment and status conditions.
  - The application container image cache.
  - The number of database rows.
  correct: 0
  explanation: A route cannot carry traffic through a Gateway to which it has not attached.
hints:
- Inspect parentRefs and the parent status conditions before changing the application.
- Use parent dispatch-gateway and backend Service dispatch port 8080.
- Keep the explicit hostname and test both matching and unmatched Host headers.
sources:
- https://kubernetes.io/docs/concepts/services-networking/service/
- https://kubernetes.io/docs/concepts/services-networking/ingress/
- https://gateway-api.sigs.k8s.io/concepts/api-overview/
- https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-gateway/
- https://metallb.io/concepts/layer2/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 120
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: routing-service
  title: ClusterIP DNS and real application traffic work
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: Compare Service selectors, EndpointSlices, target ports, and the application listener.
- id: routing-endpoints
  title: EndpointSlices identify the owned ready API Pods
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - endpoints
  expected: 'true'
  diagnostic: Inspect the specific request path from the client through the Service to the application.
- id: routing-gateway
  title: The accepted HTTPRoute carries real host-routed traffic
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - gateway
  expected: 'true'
  diagnostic: Inspect Gateway and HTTPRoute status conditions, parentRefs, hostnames, and backend references.
- id: routing-host-boundary
  title: An unmatched hostname does not reach the application
  explanation: Verify actual Service routing or a controller-programmed route with live traffic.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - host_boundary
  expected: 'true'
  diagnostic: Inspect the specific request path from the client through the Service to the application.
capabilities:
- docker
- kind
- kubectl
- calico
- routing
checkpoint: dispatch-routing-v1
images:
- python
- postgres
- redis
- busybox
- traefik
alternatives:
- Equivalent selectors, named target ports, and manifests are accepted when the required live endpoint
  and route behavior is demonstrated.
failure_modes:
- An assigned external IP or accepted manifest does not prove application traffic works.
- Bypassing certificate verification does not demonstrate correct TLS identity.
starter_failure_checks:
- routing-gateway
