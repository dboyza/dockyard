id: i02-build-context
revision: 1
module: 2
order: 90
title: A clean cached build shipped yesterday’s release
summary: The workspace says release v2, but a freshly built image still serves v1.
kind: incident
runtime: docker
minutes: 30
outcomes:
- Work out which folder a build actually reads its files from.
- Explain why the build cache is not the cause.
- Ship an image with the current release and confirm it with a fresh request.
prerequisites:
- m02-mission
objectives:
- docker.cache
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The build finished quickly and reused cached steps. What is the most likely reason the old
    release survived?
  options:
  - The build read its files from a different folder than the one you edited.
  - Docker’s cache is corrupted and must be cleared.
  - The container needs a restart to pick up the new VERSION.
  correct: 0
  explanation: The cache is only reused when the input files are unchanged. If the edited file never reached
    the build, the cache is behaving correctly and the input folder is the problem.
hints:
- Compare the folder named at the end of the docker build command in release.sh with the folder where
  you edited VERSION.
- release.sh builds from staged-context. Run cat staged-context/VERSION and compare it with cat VERSION.
- Change the build context in release.sh to the workspace folder (.), run it, then replace the container
  from the new image with the same name, label, and port.
sources:
- https://docs.docker.com/build/cache/invalidation/
- https://docs.docker.com/build/cache/optimize/
starter: {}
reference: {}
prepare:
- args:
  - /bin/sh
  - release.sh
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
  timeout: 120
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - '0'
  - State
  - Running
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
  points: 1
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{lab_id}}'
  output: stdout
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
  points: 1
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: dispatch
  output: stdout
  json_path:
  - service
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
  points: 1
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{port}}'
  output: stdout
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 127.0.0.1
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The image must carry its own application files, so the container should work without mounting
    your workspace.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '[]'
  output: stdout
  json_path:
  - '0'
  - Mounts
  diagnostic: The container still has a mount from your computer. Run docker inspect --format '{{json
    .Mounts}}' "$DOCKYARD_CONTAINER" to see it. Make sure the Dockerfile COPYs app.py and VERSION into
    the image, rebuild, then recreate the container without -v or --mount.
  points: 1
- id: release
  title: The image serves the expected application release
  explanation: The release field in /healthz comes from the VERSION file inside the image, so it shows
    which build is actually serving requests.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: incident-release-v2
  output: stdout
  json_path:
  - release
  diagnostic: 'The API reported a different release than this task expects. Compare the release in curl
    "http://127.0.0.1:$DOCKYARD_PORT/healthz" with the task. If you changed files, remember that a container
    keeps running the image it started from: rebuild the image, then replace the container.'
  points: 1
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
images:
- python
nodes: 1
native_version: 1.35.8
alternatives:
- Equivalent scoped repairs are accepted when actual outcomes meet every constraint.
failure_modes:
- A superficial process or configuration change can leave the user-visible failure intact.
starter_failure_checks:
- release
