id: i02-build-context
revision: 1
module: 2
order: 90
title: "A clean cached build shipped yesterday\u2019s release"
summary: The workspace VERSION says incident-release-v2, but a fresh container still reports incident-release-v1
  after a successful build.
kind: incident
runtime: docker
minutes: 30
outcomes:
- Diagnose the reported failure from real runtime evidence.
- Repair the specific boundary while preserving the stated resource and data constraints.
- Demonstrate useful behavior with a fresh end-to-end observation.
prerequisites:
- m02-mission
objectives:
- docker.cache
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What should establish that this incident is resolved?
  options:
  - The requested fresh behavior works and its preservation constraints still hold.
  - The most recent command exited zero.
  - The container list contains a running process.
  correct: 0
  explanation: A command result or process state alone does not establish the requested application
    outcome.
hints:
- "Compare the build command\u2019s context argument with the file you edited."
- "Inspect the staged context\u2019s VERSION and the Dockerfile COPY sources."
- Build using the current root context, then replace the container from that resulting image; --no-cache
  alone does not change an incorrect input directory.
sources:
- https://docs.docker.com/build/cache/invalidation/
- https://docs.docker.com/build/cache/optimize/
starter: {}
reference: {}
prepare:
- args:
  - /bin/sh
  - release.sh
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
  timeout: 120
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - '0'
  - State
  - Running
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when
    its main process exits.
  points: 1
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{lab_id}}'
  output: stdout
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do
    not label an unrelated container.
  points: 1
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published
    port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: dispatch
  output: stdout
  json_path:
  - service
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside
    the container listens on 8080.
  points: 1
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{port}}'
  output: stdout
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
  points: 1
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 127.0.0.1
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
  points: 1
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The application runs without workspace mounts
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '[]'
  output: stdout
  json_path:
  - '0'
  - Mounts
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
  points: 1
- id: release
  title: The image serves the expected application release
  explanation: The image serves the expected application release
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: incident-release-v2
  output: stdout
  json_path:
  - release
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
  points: 1
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
images:
- python
nodes: 1
native_version: 1.35.8
alternatives:
- Equivalent scoped repairs are accepted when actual outcomes meet every constraint.
failure_modes:
- A superficial process or configuration change can leave the user-visible failure intact.
starter_failure_checks:
- release
