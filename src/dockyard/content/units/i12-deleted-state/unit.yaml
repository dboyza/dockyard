id: i12-deleted-state
revision: 1
module: 23
order: 90
title: A cleanup deletes objects that were still needed
summary: An overly broad cleanup deletes the trusted frontend and a marker ConfigMap. A snapshot from
  just before is available.
kind: incident
runtime: linux
nodes: 2
minutes: 50
outcomes:
- Decide when an etcd restore is the right tool, and what else it rolls back.
- Restore original objects from a snapshot while keeping the application’s data.
- Confirm the restored frontend works with a new job.
prerequisites:
- m23-mission
objectives:
- cka.lifecycle
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You restore etcd from a snapshot taken an hour ago. What happens to a Role someone created
    30 minutes ago?
  options:
  - It disappears, because the whole API rolls back to the snapshot.
  - It stays, because restores only bring back deleted objects.
  - It is merged with the restored objects.
  correct: 0
  explanation: An etcd restore replaces the whole API state with the snapshot. Anything created or changed
    after it is lost.
hints:
- Check what is missing with kubectl get deployment -n frontend and kubectl get configmap -n default;
  the database is fine.
- The objects must keep their original UIDs, so reapplying YAML will not do. Use the snapshot at /var/lib/etcd/dockyard-recovery.db
  on the control-plane node.
- Restore into a new directory with --bump-revision=1000000000 --mark-compacted, switch etcd’s data hostPath
  to it, run python wait-control-plane.py, and wait for the frontend rollout.
sources:
- https://etcd.io/docs/v3.6/op-guide/recovery/
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/static-pod/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.native_incident
  - deleted-state
  timeout: 240
checks:
- id: recovery-preserved
  title: The original cluster, sentinel, and database row are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the fault must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original sentinel or cluster identity is missing. Objects recreated by hand have new
    UIDs; restore them from the snapshot. If the nodes or database were rebuilt, reset the lab.
- id: recovery-components
  title: The kubelet and all four control-plane components are running
  explanation: On the control-plane node, the kubelet service must be active. Containers for etcd, the
    API server, the controller manager, and the scheduler must be running. The API must report ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - components
  expected: 'true'
  diagnostic: Part of the control plane is not running. Inside the control-plane VM, check systemctl status
    kubelet, sudo ls /etc/kubernetes/manifests for all four files, and sudo crictl ps -a. Read sudo crictl
    logs for any component that keeps exiting.
- id: recovery-scheduled
  title: A brand-new Pod is scheduled onto a node
  explanation: Dockyard creates a fresh Pod with no node chosen and checks the scheduler assigns it one
    within a few seconds, then deletes it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - scheduled
  expected: 'true'
  diagnostic: A new Pod was not given a node. Check the scheduler is running with sudo crictl ps --name
    kube-scheduler on the control-plane node, and that its manifest is in /etc/kubernetes/manifests. If
    it has just restarted, run python wait-control-plane.py and check again.
- id: recovery-restored
  title: The original objects came back from the snapshot
  explanation: The deleted objects must have their original UIDs, etcd’s revision must be far ahead of
    the snapshot’s, and the snapshot’s old revision must be marked compacted.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: The restore is not in place. Restore the snapshot with etcdutl snapshot restore into a new
    --data-dir, including --bump-revision=1000000000 --mark-compacted. Then change the data hostPath in
    /etc/kubernetes/manifests/etcd.yaml to that directory, and wait for the API.
- id: recovery-workflow
  title: A new job from the frontend completes
  explanation: A real job submitted from the trusted frontend must cross the nodes, be processed, and
    be saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Get the control plane healthy first, then run sh bootstrap.sh to
    wait for Dispatch to recover and read kubectl logs deployment/worker.
- id: incident-recovered
  title: The frontend Deployment is back with its original UID
  explanation: The trusted-client Deployment in the frontend namespace must have its original UID and
    at least one available replica.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native_incident
    - deleted-state
    timeout: 240
  expectation: json
  json_path:
  - incident
  expected: 'true'
  diagnostic: The original frontend Deployment is not back. Reapplying YAML creates a new UID; restore
    the snapshot at /var/lib/etcd/dockyard-recovery.db instead, then wait for kubectl rollout status deployment/trusted-client
    -n frontend.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any editor or restore directory name is accepted, as long as etcd’s current data is not overwritten.
- The original UIDs and a new job are checked, not your shell history.
failure_modes:
- An object recreated from YAML has a new UID.
- An etcd restore rolls back every API change made after the snapshot.
- An etcd snapshot does not contain the database’s rows.
starter_failure_checks:
- incident-recovered
- recovery-preserved
- recovery-restored
- recovery-workflow
