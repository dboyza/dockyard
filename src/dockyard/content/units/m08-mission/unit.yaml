id: m08-mission
revision: 1
module: 8
order: 4
title: 'Mission: process work and prove maintenance'
summary: Deliver a working API, worker fleet, node agent, and maintenance schedule.
kind: mission
runtime: kubernetes
minutes: 50
outcomes:
- Select workload controllers by lifecycle.
- Demonstrate background processing and finite maintenance effects.
- Explain temporary storage and retry limitations.
prerequisites:
- m08-jobs
objectives:
- kubernetes.workloads
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which claim is supported by a completed Job and an independently verified database observation?
  options:
  - This maintenance task performed its required effect in this run.
  - All future scheduled runs will succeed.
  - The ephemeral database is now durable across Pod replacement.
  correct: 0
  explanation: Evidence supports a specific observed run; it cannot remove unrelated durability or future-failure
    risks.
hints:
- Inspect each controller separately before repairing the stack.
- Resolve missing workers and the excluded node agent, then repair the finite maintenance task.
- Use two worker replicas, eligible DaemonSet scheduling, and a functioning unsuspended maintenance CronJob;
  run maintenance-proof and check.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: workload-api
  title: The API is available
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - api
  expected: 'true'
  diagnostic: Compare the desired controller state with ready Pods, events, and the task contract.
- id: workload-workers
  title: Two worker replicas are available and owned
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: Compare the desired controller state with ready Pods, events, and the task contract.
- id: workload-processing
  title: A fresh job is processed with the correct result
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: Inspect worker logs, Pod ownership, database connectivity, and Redis notifications. A fresh
    job must finish with the expected result.
- id: workload-agents
  title: The DaemonSet covers eligible nodes
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - agents
  expected: 'true'
  diagnostic: Compare the desired controller state with ready Pods, events, and the task contract.
- id: workload-schedule
  title: The CronJob has the required scheduling and retry policy
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - schedule
  expected: 'true'
  diagnostic: Compare the desired controller state with ready Pods, events, and the task contract.
- id: workload-maintenance
  title: The proof Job completed a real database observation
  explanation: Check live controller state and actual processing or maintenance effects.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - maintenance
  expected: 'true'
  diagnostic: Create a Job from the CronJob, wait for Complete, and inspect its actual database observation.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-workloads-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent controller manifests are accepted when live ownership and required application effects satisfy
  the contract.
failure_modes:
- Healthy API Pods without functioning workers do not establish job processing.
- A completed Pod with a printed success message does not prove the database effect.
