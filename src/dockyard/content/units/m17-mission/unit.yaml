id: m17-mission
revision: 1
module: 17
order: 4
title: Restrict Dispatch without breaking it
summary: Combine least privilege, enforced traffic rules, and runtime hardening.
kind: mission
runtime: kubernetes
nodes: 2
minutes: 65
outcomes:
- Prove separate positive and negative security boundaries.
- Retain the complete working business path.
prerequisites:
- m17-contexts
objectives:
- kubernetes.rbac
- kubernetes.networkpolicy
- kubernetes.security
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which observation establishes the intended security boundary?
  options:
  - The allowed operation succeeds and a specific forbidden alternative fails for the expected reason.
  - Every request fails because the service is down.
  - The manifest contains a field named securityContext.
  correct: 0
  explanation: Use a working positive control and an observed denial to distinguish enforcement from unrelated
    failure.
hints:
- Separate API authorization, network reachability, admission, and process restrictions.
- Compare the affected Role, peer selector list, DNS protocols, and namespace/runtime settings with the
  concept.
- Apply the repaired source, complete the rollout where needed, and inspect each positive and negative
  observation.
sources:
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://kubernetes.io/docs/concepts/services-networking/network-policies/
- https://kubernetes.io/docs/concepts/security/pod-security-standards/
- https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: security-rbac
  title: The real reader token can list Pods but cannot read Secrets or cross namespace boundaries
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - rbac
  expected: 'true'
  diagnostic: Compare actual token HTTP status codes and remove Secret or write permissions from the reader.
- id: security-tokens
  title: API and worker have no automatically mounted Kubernetes token
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - tokens
  expected: 'true'
  diagnostic: Disable automatic service-account token mounting for API and worker, then replace their
    Pods.
- id: security-network
  title: Cross-node allowed and denied connections match the intended boundary
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - network
  expected: 'true'
  diagnostic: Keep both peer selectors in one rule and inspect the cross-node connection matrix.
- id: security-dns
  title: Real UDP and TCP DNS queries both resolve the database
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: Allow both UDP and TCP port 53 to the actual CoreDNS namespace and Pod labels.
- id: security-admission
  title: Restricted admission accepts a compliant Pod and rejects privilege escalation
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - admission
  expected: 'true'
  diagnostic: Enforce Restricted v1.35 and compare server-side dry-run results for compliant and escalating
    Pods.
- id: security-runtime
  title: The live API is non-root, capability-free, filtered, and read-only
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - runtime
  expected: 'true'
  diagnostic: Complete the repaired API rollout and inspect UID, capabilities, NoNewPrivs, Seccomp, and
    root mount flags.
- id: security-workflow
  title: An allowed frontend completes a real persistent job
  explanation: Observe the actual allowed and denied operation, admission decision, or process state.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Preserve trusted frontend access and API/worker connectivity to PostgreSQL and Redis.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-security-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent additive policy organization and YAML formatting are accepted when the actual allowed and
  denied paths agree.
- A different non-root API UID is accepted when process restrictions and application behavior remain correct.
failure_modes:
- Separate peer items broaden selectors from an intersection to alternatives.
- UDP-only DNS can fail when a TCP query is needed.
- Changing admission policy does not repair existing Pods.
starter_failure_checks:
- security-rbac
- security-network
- security-dns
- security-admission
- security-runtime
