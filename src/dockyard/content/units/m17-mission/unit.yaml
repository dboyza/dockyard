id: m17-mission
revision: 1
module: 17
order: 4
title: 'Mission: secure Dispatch without breaking it'
summary: Tighten API permissions, network rules, admission, and process restrictions, and prove each one.
kind: mission
runtime: kubernetes
nodes: 2
minutes: 65
outcomes:
- Show an allowed and a blocked result for each control.
- Keep the whole job workflow working.
- Write down what a local security test does and does not prove.
prerequisites:
- m17-contexts
objectives:
- kubernetes.rbac
- kubernetes.networkpolicy
- kubernetes.security
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which observation establishes the intended security boundary?
  options:
  - The allowed operation succeeds and a specific forbidden alternative fails for the expected reason.
  - Every request fails because the service is down.
  - The manifest contains a field named securityContext.
  correct: 0
  explanation: Use a working positive control and an observed denial to distinguish enforcement from unrelated
    failure.
hints:
- 'Take the four controls one at a time: RBAC, NetworkPolicy, admission, and the API’s security context.'
- Remove Secret access from the reader Role, fix the frontend peer and DNS in network.yaml, and apply
  the Restricted and security context changes.
- After applying and rolling out, check with auth can-i, a server dry run, and a real job.
sources:
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://kubernetes.io/docs/concepts/services-networking/network-policies/
- https://kubernetes.io/docs/concepts/security/pod-security-standards/
- https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: security-rbac
  title: The reader can list Pods and nothing more
  explanation: Using its own token, dispatch-reader must list Pods in dispatch, be refused Secrets and
    kube-system, and be unable to create Pods, patch Deployments, or create RoleBindings.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - rbac
  expected: 'true'
  diagnostic: 'The reader has too little or too much access. Run kubectl auth can-i --list --as=system:serviceaccount:dispatch:dispatch-reader
    -n dispatch and compare with the Role in identity.yaml: it should only get, list, and watch pods.'
- id: security-tokens
  title: The API and worker have no API token
  explanation: The API and worker never call the Kubernetes API, so they must run without an automatically
    mounted ServiceAccount token.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - tokens
  expected: 'true'
  diagnostic: 'The API or worker still has a ServiceAccount token. Check both use serviceAccountName dispatch-app
    with automountServiceAccountToken: false, then roll them out again.'
- id: security-network
  title: Allowed and blocked connections match the intended rules
  explanation: Across two nodes, the trusted frontend must reach the API, while the untrusted frontend,
    a trusted label in the wrong namespace, frontend-to-database, and API-to-outside-target connections
    must all be blocked.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - network
  expected: 'true'
  diagnostic: At least one connection is allowed or blocked wrongly. Use --json with Check work to see
    which. If the wrong-namespace client gets through, check the namespaceSelector and podSelector are
    in the same from item; if an allowed path fails, check the matching egress and ingress rules and their
    exact ports.
- id: security-dns
  title: DNS works over both UDP and TCP
  explanation: Real DNS lookups for the database must succeed over UDP and over TCP under the default-deny
    policy.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: A DNS lookup failed. The DNS egress rule must allow port 53 over both UDP and TCP to the
    CoreDNS Pods in kube-system.
- id: security-admission
  title: Restricted admission accepts good Pods and rejects escalation
  explanation: The dispatch namespace must enforce the Restricted standard, so a compliant Pod passes
    a server dry run and one allowing privilege escalation is rejected.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - admission
  expected: 'true'
  diagnostic: 'Admission is not enforcing Restricted. Check kubectl get namespace dispatch --show-labels:
    pod-security.kubernetes.io/enforce should be restricted, with enforce-version v1.35. Apply admission.yaml
    through render.py.'
- id: security-runtime
  title: The running API is restricted
  explanation: Inside the live API container, the process must be non-root with no capabilities, no-new-privileges
    and seccomp on, and a read-only root filesystem.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - runtime
  expected: 'true'
  diagnostic: The running API is not fully restricted. Check its securityContext has allowPrivilegeEscalation
    false, capabilities drop ALL, and readOnlyRootFilesystem true, with runAsNonRoot and a RuntimeDefault
    seccomp profile, then roll out the Deployment so new Pods start with it.
- id: security-workflow
  title: A job from the trusted frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the trusted frontend did not complete. Check the API and workers can reach PostgreSQL
    and Redis on their exact ports, that DNS works, and read kubectl logs deployment/worker.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-security-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent additive policy organization and YAML formatting are accepted when the actual allowed and
  denied paths agree.
- A different non-root API UID is accepted when process restrictions and application behavior remain correct.
failure_modes:
- Separate peer items broaden selectors from an intersection to alternatives.
- UDP-only DNS can fail when a TCP query is needed.
- Changing admission policy does not repair existing Pods.
starter_failure_checks:
- security-rbac
- security-network
- security-dns
- security-admission
- security-runtime
