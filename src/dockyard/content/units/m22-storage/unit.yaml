id: m22-storage
revision: 1
module: 22
order: 3
title: CSI storage and node placement
summary: Recover a database whose Pod was moved away from its node-local CSI volume.
kind: lesson
runtime: linux
nodes: 2
minutes: 45
outcomes:
- Follow a volume from claim to PV, attachment, and mount.
- Explain why a Bound claim is not proof the storage is usable.
- Fix placement and recover the original data without recreating the claim.
prerequisites:
- m22-dns
objectives:
- cka.interfaces
- cka.pv-pvc
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The PVC is Bound, but a replacement database Pod cannot mount it on another node. What is
    missing from that observation?
  options:
  - Driver registration, attachment, placement, and access to the actual backing data.
  - Only the display name of the claim.
  - Proof that a new empty claim should replace it.
  correct: 0
  explanation: Bound only means a volume exists. The driver, attachment, placement, and the data’s location
    decide whether a Pod can use it.
hints:
- Follow the claim to its CSI PV and compare the volume's usable node with the database Pod selector.
- The hostpath driver and original data remain on the worker; changing placement does not move storage.
- Repair the StatefulSet template, delete only the failed database Pod if the rollout remains stalled,
  and wait for the original claim to mount.
sources:
- https://docs.tigera.io/calico/latest/getting-started/kubernetes/requirements
- https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://github.com/kubernetes-csi/csi-driver-host-path/tree/v1.18.0
- https://kubernetes.io/docs/concepts/storage/storage-classes/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 600
- args:
  - python
  - -m
  - dockyard.fixtures.infrastructure
  - storage
  timeout: 360
checks:
- id: infrastructure-preserved
  title: The original cluster and its data are still there
  explanation: The cluster’s identities, the original database claim and volume, and the row stored before
    the fault must all be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced. Recover in place instead of
    recreating the database, claim, or cluster; if they were replaced, reset the lab.
- id: infrastructure-csi
  title: The original CSI volume is attached and mounted on the worker
  explanation: The database must use its original claim and PV, with the same driver and volume handle,
    attached and mounted on the worker where the driver is registered.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - csi
  expected: 'true'
  diagnostic: The database is not using its original volume on the worker. Compare kubectl get pod db-0
    -o wide with the PV’s node affinity, fix the StatefulSet’s placement, and if the rollout is stuck
    delete only the failed db-0 Pod. Never delete the claim or PV.
- id: infrastructure-workflow
  title: A job from the frontend completes across the nodes
  explanation: A real job from the frontend must cross to the worker, be processed, and be saved in the
    database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Fix the lower layers first (packets, DNS, routing, storage), then
    wait for the database, API, and workers to be ready and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
- native-csi
checkpoint: dispatch-infrastructure-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent diagnostic tools and configuration editing methods are accepted.
- Actual placement, routes, preserved identities, and stored bytes are checked rather than shell history.
failure_modes:
- A Ready node can coexist with a broken Pod packet path.
- Old kernel Service rules can hide an unavailable proxy agent.
- A bound claim does not prove that a new consumer can mount the original data.
starter_failure_checks:
- infrastructure-csi
- infrastructure-workflow
