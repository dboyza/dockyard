id: m20-init
revision: 2
module: 20
order: 1
title: Create a control plane with kubeadm
summary: Turn prepared machines into a Kubernetes control plane with kubeadm init.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Explain what kubeadm init creates, and what it leaves for later.
- Initialise a control plane with a Pod network separate from the node network.
- Use the new administrator credentials safely.
prerequisites:
- m19-mission
objectives:
- cka.infrastructure
- cka.kubeadm
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: After kubeadm initializes successfully, the node is NotReady and CoreDNS is pending. What
    is still missing?
  options:
  - The Pod networking implementation can still be absent.
  - The control plane must be completely absent.
  - Another init should be run immediately.
  correct: 0
  explanation: The node needs a Pod network (CNI), which kubeadm init does not install.
hints:
- Inspect the prepared runtime and the two kubeadm configuration documents before initialization.
- The control plane needs its actual node IP, containerd CRI socket, certificate SANs, and a non-overlapping
  Pod subnet.
- Render init-config, run kubeadm init inside the primary guest with that file on standard input, then
  use refresh-client and inspect the API.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
- https://etcd.io/docs/v3.6/faq/
starter: {}
reference: {}
prepare: []
checks:
- id: bootstrap-initialized
  title: The control plane is initialised
  explanation: The API server must answer through kubeadm’s administrator client, and the API server,
    controller manager, scheduler, and etcd static Pods must all run on the control-plane VM.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    timeout: 240
  expectation: json
  json_path:
  - initialized
  expected: 'true'
  diagnostic: The control plane is not initialised yet. Inside the control-plane VM, check sudo crictl
    ps for the four components and sudo journalctl -u kubelet -n 30 for errors. If kubeadm init failed
    partway, read its output; you may need sudo kubeadm reset -f before trying again.
capabilities:
- limactl
- kubectl
- calico
images: []
alternatives:
- Equivalent configuration formatting, editors, and diagnostic commands are accepted.
- Live state is graded rather than the shell command sequence.
failure_modes:
- A responding API can coexist with missing Pod networking.
- Node readiness alone does not prove cross-node application traffic.
- A healthy etcd majority does not repair an endpoint pointed only at a failed API server.
starter_failure_checks:
- bootstrap-initialized
