id: m06-registry
revision: 1
module: 6
order: 1
title: Ship a digest through a local registry
summary: Push a real application artifact and select its immutable registry digest when creating the container.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Distinguish a mutable tag, a local image ID, and a registry content digest.
- Push and pull through a loopback-bound owned registry.
- Run the exact published artifact by digest.
prerequisites:
- m05-mission
objectives:
- docker.registry
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You move the release tag to a new manifest. What happens to a deployment pinned to the old digest?
  options:
  - It still selects the old content digest.
  - It silently selects the new tag target.
  - Its local writable layer is merged with the new image.
  correct: 0
  explanation: A digest reference names specific content and does not follow later changes to a tag.
hints:
- The registry endpoint is separate from the API endpoint; use DOCKYARD_REGISTRY_PORT for image distribution.
- Tag and push the image, then select the RepoDigests entry matching this exact local registry.
- Run the container from registry/dispatch@sha256:... after pulling that digest, preserving the API label and host-port
  mapping.
sources:
- https://docs.docker.com/reference/cli/docker/image/push/
- https://docs.docker.com/reference/cli/docker/image/pull/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - volume
  - create
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{volume}}-registry'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}-registry'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{registry_port}}:5000
  - -v
  - '{{volume}}-registry:/var/lib/registry'
  - '{{registry_image}}'
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The application runs without workspace mounts
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '[]'
  json_path:
  - '0'
  - Mounts
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: release
  title: The image serves the expected application release
  explanation: The image serves the expected application release
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  expected: dispatch-1
  json_path:
  - release
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: registry-pinned
  title: The application container selects a registry digest
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - pinned
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
- id: registry-served
  title: The owned registry serves that exact content digest
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - served
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
- id: registry-private
  title: The registry binds only to the assigned loopback port
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - private
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
- id: registry-owned
  title: The registry belongs to this lab
  explanation: Observe the selected artifact or enforced runtime behavior in the actual lab.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: Compare the actual selected image and running container configuration with the release contract, then
    rebuild or recreate only the assigned resources.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
images:
- python
- registry
starter_failure_checks:
- process-running
- lab-identity
- application-response
- published-port
- loopback-binding
- self-contained
- release
- registry-pinned
- registry-served
- registry-private
- registry-owned
