id: m20-mission
revision: 1
module: 20
order: 4
title: 'Mission: build a cluster from scratch'
summary: Initialise, join, network, and deploy Dispatch on two prepared machines.
kind: mission
runtime: linux
nodes: 2
minutes: 60
outcomes:
- Initialize and join real Linux guests using authenticated kubeadm configuration.
- Establish CNI, DNS, and a working hardened Dispatch checkpoint.
- Explain bootstrap evidence and remaining availability limits.
prerequisites:
- m20-ha
objectives:
- cka.kubeadm
- cka.interfaces
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Which evidence best supports handing over the completed cluster?
  options:
  - Authenticated control-plane health, fresh node and network state, and a completed application transaction.
  - Only a successful init exit code.
  - Only the presence of kubeconfig files.
  correct: 0
  explanation: An exit code or a file only shows one step ran. Ready nodes, networking, and a real job
    show the cluster works.
hints:
- Separate cluster initialization, private client setup, node registration, network readiness, and application
  deployment.
- The supplied helpers render real kubeadm and CNI configuration; they do not replace the guest commands
  that apply it.
- Build the control plane first, refresh the host client, join the worker with CA-pinned discovery, install
  networking, then deploy and verify Dispatch.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
- https://etcd.io/docs/v3.6/faq/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
checks:
- id: bootstrap-initialized
  title: The control plane is initialised
  explanation: The API server must answer through kubeadm’s administrator client, and the API server,
    controller manager, scheduler, and etcd static Pods must all run on the control-plane VM.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    timeout: 240
  expectation: json
  json_path:
  - initialized
  expected: 'true'
  diagnostic: The control plane is not initialised yet. Inside the control-plane VM, check sudo crictl
    ps for the four components and sudo journalctl -u kubelet -n 30 for errors. If kubeadm init failed
    partway, read its output; you may need sudo kubeadm reset -f before trying again.
- id: bootstrap-network
  title: Both nodes, their Calico agents, and DNS are ready
  explanation: Both of this lab’s VMs must be registered and Ready, calico-node must be ready on both,
    and CoreDNS must be available.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    timeout: 240
  expectation: json
  json_path:
  - network
  expected: 'true'
  diagnostic: Networking is not complete. Check kubectl get nodes (is the worker joined?), kubectl get
    pods -n kube-system -o wide for calico-node on each node, and kubectl rollout status deployment/coredns
    -n kube-system.
- id: bootstrap-workflow
  title: A job crosses the nodes and completes
  explanation: A real job submitted from the frontend on one node must be completed by Dispatch on the
    other and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.bootstrap
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A cross-node job did not complete. Make sure sh bootstrap.sh finished, then check kubectl
    get pods -o wide for anything not ready, and read kubectl logs deployment/worker.
capabilities:
- limactl
- kubectl
- calico
- docker
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent configuration formatting, editors, and diagnostic commands are accepted.
- Live state is graded rather than the shell command sequence.
failure_modes:
- A responding API can coexist with missing Pod networking.
- Node readiness alone does not prove cross-node application traffic.
- A healthy etcd majority does not repair an endpoint pointed only at a failed API server.
starter_failure_checks:
- bootstrap-initialized
- bootstrap-network
- bootstrap-workflow
checkpoint: dispatch-operations-v1
