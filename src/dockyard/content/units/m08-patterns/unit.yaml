id: m08-patterns
revision: 2
module: 8
order: 2
title: Several containers in one Pod
summary: Fix an init container and a sidecar so they share a config file with the worker.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Explain when an init container runs and what happens if it fails.
- Share files between containers in a Pod with an emptyDir volume.
- Read logs from a particular container in a multi-container Pod.
prerequisites:
- m08-workloads
objectives:
- kubernetes.workloads
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The main container restarts, but the Pod stays. What happens to the Pod’s emptyDir?
  options:
  - Its files stay until the Pod is deleted.
  - It is emptied on every container restart.
  - It turns into permanent storage.
  correct: 0
  explanation: An emptyDir belongs to the Pod, not to one container, so it survives container restarts
    but not Pod deletion.
hints:
- kubectl describe pod on a worker Pod, then kubectl logs POD -c configure, shows the first problem.
- All three containers must mount the same volume name at /shared.
- Make configure write queue=redis://queue:6379/0 to /shared/worker.conf and exit 0, and mount shared
  in worker and observer.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: workload-api
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies to accept jobs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - api
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch, and read the Events for the reason.
- id: workload-workers
  title: Two workers are available
  explanation: The worker Deployment must ask for two copies and have both running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: 'The worker Deployment does not have exactly two available copies. Check replicas: in worker.yaml,
    apply it, and run kubectl rollout status deployment/worker. If Pods are stuck, kubectl describe pod
    on one of them shows why.'
- id: workload-processing
  title: A new job is completed by a worker
  explanation: Dockyard submits a real job and waits for a worker to finish it with the right result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running with kubectl get pods -l app=worker,
    then read kubectl logs deployment/worker for database or Redis connection errors.
- id: workload-patterns
  title: The init container and sidecar share the worker’s config file
  explanation: In each worker Pod, configure must have succeeded, and worker and observer must read the
    same /shared/worker.conf from one emptyDir.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - workloads
    timeout: 90
  expectation: json
  json_path:
  - patterns
  expected: 'true'
  diagnostic: 'At least one worker Pod does not share the generated file correctly. Check kubectl logs
    POD -c configure for errors, then compare the volumeMounts of configure, worker, and observer: all
    three must mount the same emptyDir volume name at /shared.'
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-workloads-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent controller manifests are accepted when live ownership and required application effects satisfy
  the contract.
failure_modes:
- Healthy API Pods without functioning workers do not establish job processing.
- A completed Pod with a printed success message does not prove the database effect.
starter_failure_checks:
- workload-patterns
