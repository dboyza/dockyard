id: m24-handoff
revision: 1
module: 24
order: 3
title: Finish a stuck rollout and write a handoff
summary: Spot a release that never finished while old Pods kept serving, fix it, and write a handoff someone
  else can follow.
kind: lesson
runtime: linux
nodes: 2
minutes: 40
outcomes:
- Read a Deployment’s desired, up-to-date, available, and total counts.
- Recover a stuck rollout with rollout undo or set image.
- Write a handoff with check commands, expected results, and the limits of a rollback.
prerequisites:
- m24-decisions
objectives:
- cka.rollouts
- ckad.rolling-updates
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Old API Pods still pass health checks, but the new version cannot start. Has the release finished?
  options:
  - No. The service is still up, but the rollout is stuck.
  - Yes, because health checks pass.
  - Yes, once one new Pod exists.
  correct: 0
  explanation: With maxUnavailable 0, old Pods keep serving while new ones fail. Only matching desired,
    up-to-date, and available counts show a finished rollout.
hints:
- Run kubectl rollout status deployment/dispatch --timeout=20s and kubectl get deployment dispatch -o
  wide.
- kubectl describe pod on the stuck Pod names the image it cannot find; kubectl rollout history lists
  earlier revisions.
- Run kubectl rollout undo deployment/dispatch, or kubectl set image deployment/dispatch api=$DOCKYARD_IMAGE,
  and wait for the rollout.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/debug/debug-application/
- https://v1-35.docs.kubernetes.io/docs/tasks/run-application/configure-pdb/
- https://v1-35.docs.kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- https://v1-35.docs.kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.handoff
  - handoff
  timeout: 240
checks:
- id: handoff-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, and maintenance-sentinel ConfigMap must have their original
    UIDs, and the database row stored before the incident must still exist.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - handoff
    timeout: 300
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the incident is missing or was replaced, or the database is not running,
    so the stored row could not be read. Fix the existing objects with small changes instead of deleting
    and recreating them or rebuilding the cluster; if that already happened, reset the lab.
- id: handoff-rollout
  title: The API rollout has finished
  explanation: The Deployment’s desired, up-to-date, available, and total replica counts must all match.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - handoff
    timeout: 300
  expectation: json
  json_path:
  - rollout
  expected: 'true'
  diagnostic: The rollout has not finished. Run kubectl rollout status deployment/dispatch and kubectl
    get pods -l app=dispatch, read the stuck Pod’s events with kubectl describe pod, then use kubectl
    rollout undo deployment/dispatch or set a working image.
- id: handoff-workflow
  title: A new job from the browser and the frontend completes
  explanation: Real jobs submitted through the lab’s Dispatch port and from the trusted frontend on another
    node must be processed and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.handoff
    - handoff
    timeout: 300
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: 'A job did not complete. Follow the request step by step: check kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch lists API Pods, then submit a job and, if it stays queued,
    check kubectl get deployment worker and kubectl logs deployment/worker.'
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Rolling back or setting any working image is accepted.
- The Deployment’s counts and a new job are checked, not your shell history; the handoff is for self-review.
failure_modes:
- Passing health checks can hide a stuck rollout.
- A rollback does not undo database changes or replace leaked credentials.
starter_failure_checks:
- handoff-rollout
