id: m18-images
revision: 1
module: 18
order: 1
title: Scan an image and remove a vulnerable library
summary: Scan Dispatch’s image, remove an unused vulnerable library, and prove it is gone.
kind: lesson
runtime: kubernetes
nodes: 2
minutes: 45
outcomes:
- Read a vulnerability scan and an SBOM.
- Remove an unused dependency and roll out the new image.
- Explain what a scan does and does not prove.
prerequisites:
- m17-mission
objectives:
- kubernetes.security
- kubernetes.storage
- platform.delivery
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The target CVE disappears, but four unrelated findings remain. What can you conclude?
  options:
  - The targeted remediation worked; remaining findings still need triage.
  - The image is completely secure.
  - The SBOM must be empty.
  correct: 0
  explanation: A scoped fix and a complete risk decision are different claims.
hints:
- Search scan-before.json for CVE-2022-29217 and note which package it is in.
- That package is only installed when include_legacy_dependency is true in build.json.
- Set it to false and run sh repair-image.sh, which rebuilds, restarts, and scans again.
sources:
- https://trivy.dev/latest/docs/target/container_image/
- https://trivy.dev/latest/docs/supply-chain/sbom/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://www.postgresql.org/docs/current/backup-dump.html
- https://cryptography.io/en/latest/hazmat/primitives/aead/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 360
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - scan.py
  - before
  timeout: 240
checks:
- id: hardening-images
  title: The vulnerable library is gone from the image and running Pods
  explanation: A fresh scan of the current image must not find CVE-2022-29217, the after reports must
    agree, and the running API and worker must not have PyJWT installed.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - images
  expected: 'true'
  diagnostic: The library is still present somewhere. Check include_legacy_dependency is false in build.json,
    then run sh repair-image.sh, which rebuilds, restarts the API and worker, and scans again. A rebuilt
    image changes nothing until the Pods restart.
- id: hardening-workflow
  title: A job from the frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - hardening
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the frontend did not complete. Check the database Pod is running and selected
    by the db Service. Check the API and worker have the current password. Check the frontend network
    policy names the current client label.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- scanner
checkpoint: dispatch-hardening-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent image builds, credential administration, and restore commands are accepted when actual runtime
  and evidence agree.
- No exact command history or YAML formatting is required; preserve the documented backup and report formats.
failure_modes:
- A changed tag leaves old running containers untouched.
- A Secret update leaves the database or consumers on a different credential.
- Reusing the original claim does not prove an independent restore.
starter_failure_checks:
- hardening-images
