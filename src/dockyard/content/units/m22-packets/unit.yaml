id: m22-packets
revision: 1
module: 22
order: 1
title: Trace cross-node Pod traffic
summary: Find why Pods on different nodes cannot talk, even though every node is Ready.
kind: lesson
runtime: linux
nodes: 2
minutes: 45
outcomes:
- Explain how VXLAN carries Pod traffic between nodes.
- Find and remove one specific firewall rule without disturbing others.
- Test Pod-IP, Service, and application paths separately.
prerequisites:
- m21-mission
objectives:
- cka.pod-connectivity
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Both nodes remain Ready, but only cross-node Pod requests fail. What should you inspect next?
  options:
  - The actual Pod and encapsulated packet path between the node addresses.
  - Only whether the YAML parses.
  - Only the image tag.
  correct: 0
  explanation: Node status travels over the node network; Pod traffic travels inside VXLAN. Check that
    path directly.
hints:
- Compare direct Pod-IP and Service-name requests from the trusted frontend.
- On the control-plane VM, list sudo iptables -t raw -nvL PREROUTING --line-numbers and watch the counter
  on the UDP 4789 DROP rule while you retry.
- Delete only the DROP rule with this lab’s VXLAN comment, using iptables -t raw -D PREROUTING with the
  same match, and leave the other rules alone.
sources:
- https://docs.tigera.io/calico/latest/getting-started/kubernetes/requirements
- https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://github.com/kubernetes-csi/csi-driver-host-path/tree/v1.18.0
- https://kubernetes.io/docs/concepts/storage/storage-classes/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 600
- args:
  - python
  - -m
  - dockyard.fixtures.infrastructure
  - packets
  timeout: 240
checks:
- id: infrastructure-preserved
  title: The original cluster and its data are still there
  explanation: The cluster’s identities, the original database claim and volume, and the row stored before
    the fault must all be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the fault is missing or was replaced, or the database is not running,
    so the stored row could not be read. Recover in place instead of recreating the database, claim, or
    cluster; if they were replaced, reset the lab.
- id: infrastructure-packets
  title: The frontend reaches an API Pod across nodes
  explanation: A request from the trusted frontend on the control plane must reach an API Pod’s IP on
    the worker directly, without DNS or a Service.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - packets
  expected: 'true'
  diagnostic: Traffic between the nodes is still blocked. Check where the frontend and API Pods run with
    -o wide, then look for rules dropping UDP 4789 with sudo iptables -t raw -nvL PREROUTING on each VM,
    and that net.ipv4.ip_forward is 1 on the worker.
- id: infrastructure-dns
  title: A new Service name resolves to its ClusterIP
  explanation: Dockyard creates a new Service and checks its full DNS name, resolved from the trusted
    frontend, returns that Service’s real ClusterIP.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: The new Service name did not resolve correctly. Check the Corefile in kubectl get configmap
    coredns -n kube-system -o yaml answers for cluster.local, that CoreDNS is running, and that the frontend
    Pod uses dnsPolicy ClusterFirst.
- id: infrastructure-proxy
  title: kube-proxy is ready on both nodes and routes a new Service
  explanation: kube-proxy must be ready on every node, and the new Service’s ClusterIP must reach an API
    process.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - proxy
  expected: 'true'
  diagnostic: kube-proxy is not ready everywhere, or the new ClusterIP does not route. Run kubectl get
    pods -n kube-system -l k8s-app=kube-proxy -o wide and read the events of any that are not running;
    check the DaemonSet’s image.
- id: infrastructure-workflow
  title: A job from the frontend completes across the nodes
  explanation: A real job from the frontend must cross to the worker, be processed, and be saved in the
    database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.infrastructure
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Fix the lower layers first (packets, DNS, routing, storage), then
    wait for the database, API, and workers to be ready and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent diagnostic tools and configuration editing methods are accepted.
- Actual placement, routes, preserved identities, and stored bytes are checked rather than shell history.
failure_modes:
- A Ready node can coexist with a broken Pod packet path.
- Old kernel Service rules can hide an unavailable proxy agent.
- A bound claim does not prove that a new consumer can mount the original data.
starter_failure_checks:
- infrastructure-packets
- infrastructure-workflow
