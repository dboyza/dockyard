id: m10-services
revision: 1
module: 10
order: 1
title: 'Services: ClusterIP, NodePort, and LoadBalancer'
summary: Fix three kinds of Service and test each path to Dispatch with a real request.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Explain when to use ClusterIP, NodePort, and LoadBalancer Services.
- Tell port, targetPort, and nodePort apart.
- Create a Service quickly with kubectl expose.
prerequisites:
- m09-mission
objectives:
- kubernetes.services
- kubernetes.routing
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A LoadBalancer Service has an external IP, but its selector matches no Pods. What does the
    IP prove?
  options:
  - Only that an address was given out; traffic still has nowhere to go.
  - That the application is available.
  - That every Pod is now public.
  correct: 0
  explanation: Getting an address and having Pods behind it are separate things. Test with a real request.
hints:
- For each Service, compare its selector with the Pod labels and its targetPort with Dispatch’s port.
- Compare the EndpointSlice addresses with the Pod IPs from kubectl get pods -o wide.
- 'Set targetPort: 8080 in platform.yaml and nodeport.yaml, set app: dispatch as dispatch-public’s selector,
  and run sh run.sh.'
sources:
- https://kubernetes.io/docs/concepts/services-networking/service/
- https://kubernetes.io/docs/concepts/services-networking/ingress/
- https://gateway-api.sigs.k8s.io/concepts/api-overview/
- https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-gateway/
- https://metallb.io/concepts/layer2/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 120
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: routing-service
  title: The dispatch Service reaches Dispatch inside the cluster
  explanation: A request to http://dispatch:8080 from inside the cluster must reach a Dispatch Pod.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: A request to the dispatch Service failed. Check its selector matches the Pods’ labels (kubectl
    get pods --show-labels) and its targetPort is 8080, where Dispatch listens. kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch shows what it selected.
- id: routing-endpoints
  title: The Service’s endpoints are exactly the two Dispatch Pods
  explanation: The dispatch Service’s EndpointSlices must list the two ready Dispatch API Pods and nothing
    else.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - endpoints
  expected: 'true'
  diagnostic: The dispatch Service’s endpoints are not exactly the two Dispatch API Pods. Compare kubectl
    get endpointslices -l kubernetes.io/service-name=dispatch with kubectl get pods -l app=dispatch -o
    wide, and check the Service selector.
- id: routing-nodeport
  title: The NodePort reaches Dispatch from your computer
  explanation: A request to http://127.0.0.1:$DOCKYARD_PORT, which this lab connects to node port 30080,
    must reach Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - nodeport
  expected: 'true'
  diagnostic: A request to http://127.0.0.1:$DOCKYARD_PORT/healthz failed. Check dispatch-node still uses
    nodePort 30080, selects app=dispatch, and has targetPort 8080.
- id: routing-loadbalancer
  title: The LoadBalancer address reaches Dispatch
  explanation: dispatch-public must have an address from MetalLB, and a client on the cluster’s Docker
    network must reach Dispatch through it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - loadbalancer
  expected: 'true'
  diagnostic: 'The LoadBalancer path does not work yet. Run kubectl get service dispatch-public: an EXTERNAL-IP
    of <pending> means no address was given out. If it has an address, check its selector matches app=dispatch
    and its targetPort is 8080, then try the docker run wget test from the lesson.'
capabilities:
- docker
- kind
- kubectl
- calico
- loadbalancer
checkpoint: dispatch-routing-v1
images:
- python
- postgres
- redis
- busybox
- metallb_controller
- metallb_speaker
alternatives:
- Equivalent selectors, named target ports, and manifests are accepted when the required live endpoint
  and route behavior is demonstrated.
failure_modes:
- An assigned external IP or accepted manifest does not prove application traffic works.
- Bypassing certificate verification does not demonstrate correct TLS identity.
starter_failure_checks:
- routing-service
- routing-nodeport
- routing-loadbalancer
