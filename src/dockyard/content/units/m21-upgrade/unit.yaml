id: m21-upgrade
revision: 2
module: 21
order: 2
title: Upgrade a kubeadm cluster
summary: Upgrade a cluster from 1.36 to 1.37 in place, control plane first, one node at a time.
kind: lesson
runtime: linux
nodes: 2
native_version: previous
minutes: 65
outcomes:
- Upgrade kubeadm, the control plane, and each kubelet in the right order.
- Drain and uncordon each node around its kubelet upgrade.
- Confirm versions and that the original cluster and data survived.
prerequisites:
- m21-drain
objectives:
- cka.lifecycle
- ckad.api-deprecations
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The host kubectl reports 1.37, but the server remains 1.36. What was upgraded?
  options:
  - The client alone may have changed; inspect the server and every kubelet separately.
  - Every cluster component automatically changed.
  - The database must have been deleted.
  correct: 0
  explanation: The client alone may have changed; inspect the server and every kubelet separately.
hints:
- Separate kubeadm, static control-plane components, and each node kubelet.
- Stage target archives, update primary kubeadm, inspect the plan, then apply the adjacent upgrade.
- Drain each node before changing its kubelet; use upgrade node on the worker, restore holds, restart
  kubelet, uncordon, and verify preserved state.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/reference/using-api/deprecation-guide/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-maintenance.py
  timeout: 90
checks:
- id: maintenance-preserved
  title: The original cluster and its data are still there
  explanation: The namespace, Node objects, marker ConfigMap, and the database row stored before maintenance
    must all be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - upgrade
    timeout: 180
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before maintenance is missing or was replaced, or the database is not running,
    so the stored row could not be read. Maintenance must change the existing cluster, not rebuild it;
    if objects were deleted or the cluster was recreated, reset the lab and try again.
- id: maintenance-upgrade
  title: The API server, control plane, and kubelets are all on 1.37.1
  explanation: kubectl get --raw=/version, the control-plane component images, and every node’s kubelet
    must report v1.37.1.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - upgrade
    timeout: 180
  expectation: json
  json_path:
  - upgrade
  expected: 'true'
  diagnostic: Not everything is on 1.37.1 yet. Compare kubectl get --raw=/version, kubectl get nodes (VERSION
    shows each kubelet), and the images of the kube-system control-plane Pods. The control plane needs
    kubeadm upgrade apply; each node needs its kubelet package upgraded and restarted, and the worker
    needs kubeadm upgrade node first.
- id: maintenance-workflow
  title: A job from the frontend completes after maintenance
  explanation: A real job submitted from the frontend must cross the nodes, be processed, and be saved.
  command:
    args:
    - python
    - -m
    - dockyard.probes.maintenance
    - upgrade
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check every node is Ready and uncordoned, run sh bootstrap.sh to
    wait for Dispatch to recover, and read kubectl logs deployment/worker.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors, package command formatting, and diagnostic sequences are accepted.
- Runtime outcome and original identities are assessed; shell history is not graded.
failure_modes:
- A newer host client does not prove the server or kubelets changed.
- Replacing cluster objects can hide data loss and does not establish maintenance continuity.
- A changed file does not prove a running process adopted it.
starter_failure_checks:
- maintenance-upgrade
