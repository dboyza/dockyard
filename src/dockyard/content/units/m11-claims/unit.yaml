id: m11-claims
revision: 1
module: 11
order: 1
title: Connect claims to durable database storage
summary: Trace PVC binding, the selected volume, and data across Pod replacement.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Distinguish Pod volumes, claims, persistent volumes, and storage classes.
- Explain delayed binding and node-local storage constraints.
- Verify persistence using a changed Pod UID and a preserved record.
prerequisites:
- m10-mission
objectives:
- kubernetes.storage
- kubernetes.statefulsets
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A claim is Pending with WaitForFirstConsumer and no Pod references it. What is the useful
    next step?
  options:
  - Inspect its events and configure a consuming Pod before assuming provisioning is broken.
  - Delete every volume in the cluster.
  - Assume the application already stores data on the claim.
  correct: 0
  explanation: Delayed binding intentionally waits for a consumer so storage can respect scheduling constraints.
hints:
- Trace /var/lib/postgresql/data through volumeMounts to the volumes entry.
- 'Replace emptyDir with persistentVolumeClaim.claimName: dispatch-data and use Recreate.'
- Wait for the database rollout, then run the supplied replacement proof and inspect the bound PV.
sources:
- https://kubernetes.io/docs/concepts/storage/persistent-volumes/
- https://kubernetes.io/docs/concepts/storage/storage-classes/
- https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- https://www.postgresql.org/docs/17/backup-dump.html
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 240
checks:
- id: storage-claim
  title: The database uses a bound claim and its actual persistent volume
  explanation: Observe live volume bindings, Pod identity, and actual database records.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - claim
  expected: 'true'
  diagnostic: Inspect the database Pod volume, PVC binding, and referenced PV.
- id: storage-persistence
  title: A replacement Pod reads the original database marker
  explanation: Observe live volume bindings, Pod identity, and actual database records.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - persistence
  expected: 'true'
  diagnostic: Run the supplied storage proof after mounting persistent storage; compare old and new Pod
    UIDs.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-stateful-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and logical backup commands are accepted when the named workload preserves its
  marker across Pod replacement and the recovery target uses a distinct bound claim.
failure_modes:
- A Bound claim that is not mounted by PostgreSQL does not protect database data.
- A schema-only dump cannot restore application records.
- Local node storage does not survive deletion of the entire practice cluster.
starter_failure_checks:
- storage-persistence
- storage-claim
