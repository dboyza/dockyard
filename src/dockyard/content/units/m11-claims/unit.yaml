id: m11-claims
revision: 1
module: 11
order: 1
title: Persistent storage with claims
summary: Move the database onto a PersistentVolumeClaim and prove its data survives a new Pod.
kind: lesson
runtime: kubernetes
minutes: 40
outcomes:
- Explain how claims, volumes, and storage classes fit together.
- Explain why a claim can wait in Pending until a Pod uses it.
- Create a PersistentVolume by hand and bind a claim to it.
prerequisites:
- m10-mission
objectives:
- kubernetes.storage
- kubernetes.statefulsets
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A claim uses WaitForFirstConsumer and no Pod uses it yet. It is Pending. What next?
  options:
  - Read its events and give it a Pod that uses it, before assuming anything is broken.
  - Delete every volume in the cluster.
  - Assume the app already writes to it.
  correct: 0
  explanation: This binding mode waits for a Pod on purpose, so the storage can be created where that
    Pod runs.
hints:
- Follow /var/lib/postgresql/data from the container’s volumeMounts to the Pod’s volumes list.
- 'Replace emptyDir with persistentVolumeClaim: {claimName: dispatch-data}, and set strategy type Recreate.'
- Apply claim.yaml, run sh run.sh, wait for the database, then run python storage-proof.py.
sources:
- https://kubernetes.io/docs/concepts/storage/persistent-volumes/
- https://kubernetes.io/docs/concepts/storage/storage-classes/
- https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- https://www.postgresql.org/docs/17/backup-dump.html
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 240
checks:
- id: storage-claim
  title: The database is using a bound claim
  explanation: PostgreSQL’s data directory must be mounted from a PersistentVolumeClaim that is Bound
    to a real PersistentVolume.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - claim
  expected: 'true'
  diagnostic: 'The database is not using a bound claim yet. Check the database Pod’s volumes (kubectl
    get pod -l app=db -o yaml): the data volume must use persistentVolumeClaim, not emptyDir. Then run
    kubectl get pvc and kubectl describe pvc for its events.'
- id: storage-persistence
  title: A new database Pod reads the original marker
  explanation: After storage-proof.py replaces the database Pod, the new Pod must read the marker the
    old one wrote, and the API must be ready.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - storage
    timeout: 75
  expectation: json
  json_path:
  - persistence
  expected: 'true'
  diagnostic: The marker is missing, or it was not written by an earlier Pod. Run python storage-proof.py
    after the database is ready and read its output. If the marker disappears after replacement, the data
    is not on persistent storage.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-stateful-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent manifests and logical backup commands are accepted when the named workload preserves its
  marker across Pod replacement and the recovery target uses a distinct bound claim.
failure_modes:
- A Bound claim that is not mounted by PostgreSQL does not protect database data.
- A schema-only dump cannot restore application records.
- Local node storage does not survive deletion of the entire practice cluster.
starter_failure_checks:
- storage-persistence
- storage-claim
