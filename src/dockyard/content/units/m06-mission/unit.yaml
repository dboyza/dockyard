id: m06-mission
revision: 1
module: 6
order: 4
title: 'Capstone: deliver and recover Dispatch'
summary: Repair a broken worker path, publish a pinned release, constrain the application, and verify a real PostgreSQL
  restore.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Integrate images, networking, persistence, Compose, distribution, and runtime controls.
- Recover the original workload state into a separate database.
- Produce a reviewable operational handoff and immutable source checkpoint.
prerequisites:
- m06-limits
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The live stack works again and a pg_dump file exists. What still establishes recoverability?
  options:
  - Restore into a separate target and verify the original record there.
  - Only inspect the dump filename.
  - Delete the live database and hope the dump is usable.
  correct: 0
  explanation: A separate restore demonstrates that the backup can recreate useful state while preserving the functioning
    original.
hints:
- Follow the queued job from the API into worker logs, and compare the worker database hostname with the Compose
  service name.
- Publish the application, select its registry digest for API and worker, and apply restrictions to those application
  roles.
- Use pg_dump -Fc for a logical archive, createdb for the separate restored target, and pg_restore --exit-on-error;
  then verify the original job and document the complete handoff.
sources:
- https://www.postgresql.org/docs/17/app-pgdump.html
- https://www.postgresql.org/docs/17/app-pgrestore.html
- https://docs.docker.com/compose/how-tos/startup-order/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - volume
  - create
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{volume}}-registry'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}-registry'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{registry_port}}:5000
  - -v
  - '{{volume}}-registry:/var/lib/registry'
  - '{{registry_image}}'
- args:
  - docker
  - compose
  - up
  - -d
  - --build
  - --wait
  - --wait-timeout
  - '90'
  timeout: 600
- args:
  - docker
  - exec
  - '{{project}}-db'
  - psql
  - -U
  - dispatch
  - -d
  - dispatch
  - -c
  - INSERT INTO jobs(id,title) VALUES('capstone-{{lab_id}}','Original release recovery job');
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: compose-owned
  title: Every observed service belongs to this lab
  explanation: Correlate actual service identities with a fresh submitted job and a direct database read.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: Use docker compose ps, logs, and exec to follow the API, dependency, and worker path. A healthy API
    alone does not prove background processing.
