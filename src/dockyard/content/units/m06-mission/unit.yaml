id: m06-mission
revision: 1
module: 6
order: 5
title: 'Capstone: fix, ship, and recover Dispatch'
summary: Repair the workers, run a published release by digest, lock the app down, and prove a database
  restore.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Combine images, networking, storage, Compose, registries, and restrictions in one project.
- Restore the original data into a separate database.
- Write a runbook another person could follow.
prerequisites:
- m06-limits
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The project works again and a backup file exists. What shows you can really recover?
  options:
  - Restoring it into a separate database and finding the original job there.
  - Checking the backup file’s name.
  - Deleting the live database to test the backup.
  correct: 0
  explanation: A restore into a separate database proves the backup is usable while the live data stays
    safe.
hints:
- 'Follow a stuck job: check docker compose logs worker, then compare the worker’s DB_ settings with the
  API’s.'
- 'Push the image to this lab’s registry, find its digest, and set it as image: for both api and worker,
  removing their build: sections.'
- 'For recovery: pg_dump the dispatch database, createdb restored, load the dump into restored, and query
  it for the capstone job.'
sources:
- https://www.postgresql.org/docs/17/app-pgdump.html
- https://www.postgresql.org/docs/17/app-pgrestore.html
- https://docs.docker.com/compose/how-tos/startup-order/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - volume
  - create
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{volume}}-registry'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}-registry'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{registry_port}}:5000
  - -v
  - '{{volume}}-registry:/var/lib/registry'
  - '{{registry_image}}'
- args:
  - docker
  - compose
  - up
  - -d
  - --build
  - --wait
  - --wait-timeout
  - '90'
  timeout: 600
- args:
  - docker
  - exec
  - '{{project}}-db'
  - psql
  - -U
  - dispatch
  - -d
  - dispatch
  - -c
  - INSERT INTO jobs(id,title) VALUES('capstone-{{lab_id}}','Original release recovery job');
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: compose-owned
  title: Every running service belongs to this lab
  explanation: Every Dispatch container must carry this lab's label so Dockyard can recognize and clean
    them up.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: 'At least one service container is missing the io.dockyard.lab label. Run docker compose
    ps, then docker inspect a container to check its labels. Add labels: io.dockyard.lab: ${DOCKYARD_LAB}
    under every service, then run docker compose up -d so Compose recreates them.'
- id: compose-ready
  title: The API can reach PostgreSQL and Redis
  explanation: The API's /readyz endpoint checks its own connections to PostgreSQL and Redis, so this
    confirms the API can use both.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - ready
  expected: 'true'
  diagnostic: The API reports it cannot use PostgreSQL or Redis. Request http://127.0.0.1:$DOCKYARD_PORT/readyz
    to see which one, then read docker compose logs api. Check the API's DB_HOST, DB_PASSWORD, and REDIS_URL
    settings against the service names db and queue, and confirm all services share one network.
- id: compose-private
  title: Only the API publishes a host endpoint
  explanation: Only the API should be reachable from your computer; the database, queue, and workers talk
    over the internal network.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - private
  expected: 'true'
  diagnostic: 'A database, queue, or worker container publishes a host port. Run docker compose ps and
    look at the PORTS column. Remove the ports: section from every service except api.'
- id: compose-persistent
  title: PostgreSQL uses the assigned owned volume
  explanation: PostgreSQL's data must live in the named volume assigned to this lab so it survives container
    replacement.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - persistent
  expected: 'true'
  diagnostic: 'PostgreSQL is not using the assigned volume at /var/lib/postgresql/data, or that volume
    lacks the lab label. Check the top-level volumes: entry has name: ${DOCKYARD_VOLUME} and labels, and
    that the db service mounts it at /var/lib/postgresql/data.'
- id: compose-processed
  title: A real worker completes a newly submitted job
  explanation: Dockyard submits a fresh job and waits for a running worker to finish it. That is the result
    a Dispatch user actually cares about.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - processed
  expected: 'true'
  diagnostic: 'A new job was not completed by a worker within 15 seconds. Run docker compose ps worker
    to check a worker is running, then docker compose logs worker for connection errors. The worker needs
    the same database and Redis settings as the API, and command: [python, worker.py].'
- id: compose-durable
  title: PostgreSQL independently contains the completed result
  explanation: Dockyard reads the completed result directly from PostgreSQL, confirming the worker saved
    it rather than only reporting it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: The completed result was not found in PostgreSQL's dispatch database. Check docker compose
    logs worker and db for errors, and make sure the API and workers use DB_NAME dispatch.
- id: compose-healthy
  title: The API, database, and queue report healthy
  explanation: Health checks let Docker test whether each service can do its job, not just whether its
    process is running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - healthy
  expected: 'true'
  diagnostic: 'The API, db, or queue container has no health check, or it is not currently healthy. Run
    docker compose ps and look for (healthy) in the STATUS column. For a missing one, add a healthcheck:
    to that service; for an unhealthy one, run docker inspect --format ''{{json .State.Health}}'' on the
    container to read its recent check output.'
- id: compose-guarded
  title: The API and workers wait for a healthy database and queue
  explanation: 'depends_on with condition: service_healthy stops the API and workers starting before PostgreSQL
    and Redis can accept work.'
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - guarded
  expected: 'true'
  diagnostic: 'The api or worker service does not wait for both db and queue to be healthy. In compose.yaml,
    give each of them depends_on: entries for db and queue with condition: service_healthy. Run docker
    compose config --quiet to check the file is still valid.'
- id: compose-scaled
  title: At least two workers are running
  explanation: Several workers can share the queue, so more jobs finish at the same time.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - compose
    timeout: 45
  expectation: json
  json_path:
  - scaled
  expected: 'true'
  diagnostic: Fewer than two worker containers are running for this lab. Run docker compose up -d --scale
    worker=2, then docker compose ps worker. If scaling fails, check that the worker service has no container_name,
    because two containers cannot share one name.
- id: hardening-nonroot
  title: The API process is non-root
  explanation: An ordinary user can change far less inside the container than root can.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - nonroot
  expected: 'true'
  diagnostic: The API is running as root. Run docker exec "$DOCKYARD_CONTAINER" id to confirm, then set
    a non-root user with the image's USER instruction or --user.
- id: hardening-readonly
  title: The root filesystem actually rejects a root write
  explanation: A read-only root filesystem stops the process altering its own program files; only chosen
    paths stay writable.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - readonly
  expected: 'true'
  diagnostic: Dockyard could write to the container's root filesystem. Recreate the container with --read-only,
    and add a writable mount only where the application genuinely needs one.
- id: hardening-caps
  title: All ambient container capabilities are dropped
  explanation: Linux capabilities are individual root powers; Dispatch needs none of them, so drop them
    all.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - caps
  expected: 'true'
  diagnostic: The container keeps some Linux capabilities or runs privileged. Recreate it with --cap-drop
    ALL and without --privileged.
- id: hardening-no-escalation
  title: The no-new-privileges control is configured
  explanation: no-new-privileges stops a process gaining extra privileges later, for example through setuid
    programs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - no_escalation
  expected: 'true'
  diagnostic: The no-new-privileges option is not set. Recreate the container with --security-opt no-new-privileges.
- id: hardening-memory
  title: A 32-256 MiB memory limit is enforced in cgroups
  explanation: A memory limit stops one container using all of the computer's memory.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - memory
  expected: 'true'
  diagnostic: No memory limit between 32 and 256 MiB is in force. Recreate the container with a setting
    such as --memory 128m, then confirm it in docker stats.
- id: hardening-cpu
  title: A positive CPU quota no greater than one CPU is enforced
  explanation: A CPU limit stops one busy container slowing everything else on the computer.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - cpu
  expected: 'true'
  diagnostic: No CPU limit of at most one CPU is in force. Recreate the container with a setting such
    as --cpus 0.5.
- id: hardening-pids
  title: A 16-256 process limit is enforced
  explanation: A process limit stops runaway process creation from exhausting the host.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - hardening
    timeout: 90
  expectation: json
  json_path:
  - pids
  expected: 'true'
  diagnostic: No process limit between 16 and 256 is in force. Recreate the container with a setting such
    as --pids-limit 64.
- id: registry-pinned
  title: The application container selects a registry digest
  explanation: An image digest names exact content, so the container keeps running the same bytes even
    if a tag is later moved.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - pinned
  expected: 'true'
  diagnostic: The container was started from a tag or a different registry, not a digest in this lab's
    registry. Check docker inspect --format '{{.Config.Image}}' "$DOCKYARD_CONTAINER". It should look
    like 127.0.0.1:$DOCKYARD_REGISTRY_PORT/dispatch@sha256:... using the digest printed when you pushed.
- id: registry-served
  title: The owned registry serves that exact content digest
  explanation: The lab registry must actually hold the digest the container uses, so it could be pulled
    again.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - served
  expected: 'true'
  diagnostic: The lab registry does not serve the digest the container is using. Push the image to 127.0.0.1:$DOCKYARD_REGISTRY_PORT/dispatch
    and use the digest printed by the push.
- id: registry-private
  title: The registry binds only to the assigned loopback port
  explanation: The practice registry should be reachable only from your own computer, on its assigned
    port.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - private
  expected: 'true'
  diagnostic: The registry container is not published only on 127.0.0.1:$DOCKYARD_REGISTRY_PORT. Check
    docker port on the registry container and recreate it with -p "127.0.0.1:$DOCKYARD_REGISTRY_PORT:5000".
- id: registry-owned
  title: The registry belongs to this lab
  explanation: The registry must carry this lab's label so Dockyard can recognize and remove it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - registry
    timeout: 90
  expectation: json
  json_path:
  - owned
  expected: 'true'
  diagnostic: The registry container lacks this lab's label. Recreate it with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: handoff-restored
  title: The original job is recovered in a separate PostgreSQL database
  explanation: The original job must be recoverable into a separate database called restored, showing
    your backup works.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - recovery
    timeout: 60
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: The capstone job was not found in a PostgreSQL database named restored. Make a backup with
    pg_dump, create restored with createdb, load the backup with psql, and query it, as practised in the
    scaling lesson.
- id: handoff-workers-hardened
  title: Every running worker has the same deliberate runtime restrictions
  explanation: Every worker should run with the same restrictions you applied to the API.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - recovery
    timeout: 60
  expectation: json
  json_path:
  - workers_hardened
  expected: 'true'
  diagnostic: 'At least one running worker lacks a restriction: non-root user, read-only filesystem, dropped
    capabilities, no-new-privileges, or memory, CPU, and process limits. Add the matching Compose settings
    to the worker service and recreate it.'
- id: handoff-runbook-present
  title: A handoff runbook is included for self-review
  explanation: Dockyard only checks that RUNBOOK.md exists and is not trivially short; judging its quality
    is up to you.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - recovery
    timeout: 60
  expectation: json
  json_path:
  - runbook_present
  expected: 'true'
  diagnostic: RUNBOOK.md is missing from the workspace or is shorter than 100 characters. Write the steps
    someone else would need to start, check, back up, and restore this project.
capabilities:
- docker
- python-image
checkpoint: dispatch-compose-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
images:
- python
- postgres
- redis
- registry
starter_failure_checks:
- compose-processed
- compose-durable
- compose-scaled
- hardening-readonly
- hardening-caps
- hardening-no-escalation
- hardening-memory
- hardening-cpu
- hardening-pids
- registry-pinned
- registry-served
- handoff-restored
- handoff-workers-hardened
- handoff-runbook-present
