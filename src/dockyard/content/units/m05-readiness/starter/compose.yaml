x-application:
  image: ${DOCKYARD_IMAGE}
  build: &id001
    context: .
    args:
      BASE_IMAGE: ${DOCKYARD_PYTHON_IMAGE}
  labels: &id002
    io.dockyard.lab: ${DOCKYARD_LAB}
  environment: &id003
    DB_HOST: db
    DB_NAME: dispatch
    DB_USER: dispatch
    DB_PASSWORD: ${DOCKYARD_DB_PASSWORD}
    REDIS_URL: redis://queue:6379/0
  networks: &id004
  - internal
  depends_on:
    db:
      condition: service_healthy
    queue:
      condition: service_healthy
services:
  api:
    image: ${DOCKYARD_IMAGE}
    build: *id001
    labels: *id002
    environment: *id003
    networks: *id004
    depends_on:
      db:
        condition: service_started
      queue:
        condition: service_started
    container_name: ${DOCKYARD_CONTAINER}
    ports:
    - 127.0.0.1:${DOCKYARD_PORT}:8080
  worker:
    image: ${DOCKYARD_IMAGE}
    build: *id001
    labels: *id002
    environment: *id003
    networks: *id004
    depends_on:
      db:
        condition: service_started
      queue:
        condition: service_started
    command:
    - python
    - worker.py
  db:
    image: ${DOCKYARD_POSTGRES_IMAGE}
    container_name: ${DOCKYARD_PROJECT}-db
    labels:
      io.dockyard.lab: ${DOCKYARD_LAB}
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${DOCKYARD_DB_PASSWORD}
    volumes:
    - postgres:/var/lib/postgresql/data
    networks:
    - internal
  queue:
    image: ${DOCKYARD_REDIS_IMAGE}
    container_name: ${DOCKYARD_PROJECT}-queue
    labels:
      io.dockyard.lab: ${DOCKYARD_LAB}
    networks:
    - internal
  inspect:
    image: ${DOCKYARD_PYTHON_IMAGE}
    profiles:
    - tools
    labels:
      io.dockyard.lab: ${DOCKYARD_LAB}
    networks:
    - internal
    command:
    - python
    - -c
    - import socket; print(socket.gethostbyname('db'))
networks:
  internal:
    name: ${DOCKYARD_NETWORK}
    labels:
      io.dockyard.lab: ${DOCKYARD_LAB}
volumes:
  postgres:
    name: ${DOCKYARD_VOLUME}
    labels:
      io.dockyard.lab: ${DOCKYARD_LAB}
