id: exam-cka-a
revision: 1
module: 24
order: 100
title: Native cluster operations assessment
summary: 'A timed CKA-style practice exam: eight operations tasks on a real two-node kubeadm cluster.'
kind: exam
runtime: linux
nodes: 2
minutes: 120
outcomes:
- Back up etcd
- Create a limited observer role
- Fix DNS for the frontend
- Move the database back to its volume
- Run an agent on every node
- Place the batch audit on the batch worker
- Install a Helm chart with a value override
- Restore traffic between the nodes
prerequisites:
- m24-mission
objectives:
- cka.lifecycle
- cka.rbac
- cka.coredns
- cka.pv-pvc
- cka.scheduling
- cka.packaging
- cka.pod-connectivity
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What does a practice exam score tell you?
  options:
  - How many of these tasks worked when time was up.
  - Whether you will pass the real exam.
  - How many commands you typed.
  correct: 0
  explanation: The score comes from checking the final state of each task. It shows where to practise
    next; it cannot predict a real exam result.
hints:
- Hints are not available during the exam. Afterwards, open each task's results to see what was checked.
- For each task you missed, compare the live objects with the task text using kubectl get -o yaml and
  kubectl describe.
- Work through the lessons linked from each missed task, then try a fresh attempt without help.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://etcd.io/docs/v3.6/op-guide/recovery/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.exam_admin
  timeout: 180
checks:
- id: exam-backup
  title: A valid etcd snapshot was saved
  explanation: /var/lib/etcd/operations-a.db must be a valid snapshot taken after the exam started, with
    keys and an integrity hash.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - backup
  expected: 'true'
  diagnostic: Review etcdctl snapshot save with --cacert, --cert, and --key, and etcdutl snapshot status.
- id: exam-rbac
  title: incident-observer has exactly the requested access
  explanation: In dispatch it must be able to get, list, and watch Pods and get Pod logs, and must not
    read Secrets, create or delete Pods, or update Deployments.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - rbac
  expected: 'true'
  diagnostic: Review a Role with a pods/log rule, a RoleBinding to a ServiceAccount, and kubectl auth
    can-i --as.
- id: exam-dns
  title: The frontend resolves the Service name again
  explanation: From trusted-client, dispatch.dispatch.svc.cluster.local must resolve to the Service’s
    ClusterIP.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: Review dnsPolicy ClusterFirst.
- id: exam-storage
  title: The database runs on the worker with its original volume
  explanation: db-0 must be ready on the worker, using its original claim and volume.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - storage
  expected: 'true'
  diagnostic: Review nodeSelector, tolerations for a NoSchedule taint, and deleting a stuck StatefulSet
    Pod so it is recreated with the new template.
- id: exam-preserved
  title: The original cluster and data are still there
  explanation: The namespace, both Node objects, the maintenance-sentinel ConfigMap, and the stored job
    must be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the exam is missing, or the database is not running, so the stored
    job could not be read. Get db-0 running on its original volume, and repair in place instead of rebuilding.
- id: exam-agents
  title: node-observer runs one ready Pod on each node
  explanation: DaemonSet node-observer must have one ready Pod on each of the two nodes, running Python
    as its main process.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - agents
  expected: 'true'
  diagnostic: Review DaemonSet tolerations for control-plane and custom taints, and the restricted Pod
    Security settings; kubectl describe daemonset shows why Pods were not created.
- id: exam-placement
  title: batch-audit runs on the batch worker
  explanation: One available batch-audit Pod must run on the worker, selected by dockyard.io/pool=batch
    and tolerating dockyard.io/batch=true:NoSchedule, with the worker’s taint still in place.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - placement
  expected: 'true'
  diagnostic: Review nodeSelector and tolerations.
- id: exam-chart
  title: The Helm release is deployed with the production value
  explanation: Release operations-report must be deployed in dispatch, and its app must return production
    from /environment.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - chart
  expected: 'true'
  diagnostic: Review helm install with --set or a values file, and helm status.
- id: exam-transport
  title: Traffic crosses from the control plane to the worker
  explanation: net.ipv4.ip_forward must be 1 on the worker, and the frontend must reach the dispatch Service.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - transport
  expected: 'true'
  diagnostic: Review sysctl net.ipv4.ip_forward on the worker.
- id: exam-workflow
  title: A new job completes and is saved
  explanation: A job sent through Dispatch must be processed by a worker and saved in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_admin
    timeout: 240
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Review the database placement and cross-node traffic tasks first; the job needs both.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
- helm
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any method that produces the requested final state is accepted.
- Only the final state of the cluster is checked, not your commands.
failure_modes:
- A healthy process alone does not show a working request path or a finished job.
- Recreating an object gives it a new identity, which does not count as keeping the original.
starter_failure_checks:
- exam-backup
- exam-rbac
- exam-dns
- exam-storage
- exam-agents
- exam-placement
- exam-chart
- exam-transport
