id: exam-cka-a
revision: 1
module: 24
order: 100
title: Native cluster operations assessment
summary: Eight native kubeadm operations tasks spanning backup, authorization, DNS, local storage, scheduling,
  Helm, and host networking.
kind: exam
runtime: linux
nodes: 2
minutes: 120
outcomes:
- Capture and inspect a live etcd backup
- Provide a limited incident observer
- Recover cluster-name resolution for the client
- Recover the existing database volume placement
- Run one observation agent on every native node
- Place the batch audit on its dedicated worker
- Install the operations report with a Helm override
- Recover useful cross-node application traffic
prerequisites:
- m24-mission
objectives:
- cka.lifecycle
- cka.rbac
- cka.coredns
- cka.pv-pvc
- cka.scheduling
- cka.packaging
- cka.pod-connectivity
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What makes a completed practice score useful for review?
  options:
  - Recorded runtime outcomes tied to task requirements.
  - The number of commands typed.
  - A claim that the score guarantees certification.
  correct: 0
  explanation: The score reports observed outcomes and directs review; it is not an official certification
    result.
hints:
- Separate a healthy API from the failing node agent or missing API objects.
- Read the worker service journal and its configuration, or inspect the supplied snapshot and original
  recovery contract.
- Repair the invalid kubelet duration without resetting the node; for state loss, restore the verified
  snapshot with revision bump and compaction, then verify original identities and fresh work.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
- https://etcd.io/docs/v3.6/op-guide/recovery/
starter: {}
reference: {}
