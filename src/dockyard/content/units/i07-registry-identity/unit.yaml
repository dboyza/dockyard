id: i07-registry-identity
revision: 1
module: 16
order: 90
title: The release exists but new Pods cannot pull it
summary: The release is in the registry, but after a password rotation new API Pods cannot pull it.
kind: incident
runtime: kubernetes
minutes: 40
outcomes:
- Read a pull error to tell a missing image, an unreachable registry, and a rejected login apart.
- Create a docker-registry pull Secret for the exact registry address.
- Restore Pods that pull with fresh credentials, and confirm with a real job.
prerequisites:
- m16-mission
objectives:
- ckad.images
- ckad.secrets
- ckad.debugging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: New Pods show ImagePullBackOff with “unauthorized”. The image exists and the registry is reachable.
    What is wrong?
  options:
  - The pull credentials are wrong or missing.
  - The image was never pushed.
  - The registry is down.
  correct: 0
  explanation: “unauthorized” means the registry answered and refused the login, so the image and network
    are fine.
hints:
- Read the Events in kubectl describe pod for a new API Pod, and note which Secret the Deployment lists
  under imagePullSecrets.
- The registry is reachable and the image exists. The workload Secret contains an expired practice identity.
- Run kubectl create secret docker-registry with --docker-server set to the address in registry.txt, --docker-username=learner,
  and --docker-password="$DOCKYARD_REGISTRY_PASSWORD", using --dry-run=client -o yaml | kubectl apply
  -f - to replace the old one, then restart the API.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 360
checks:
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.registry_incident
    timeout: 120
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s data-db-0 claim, or the original job is gone. If
    they were deleted or replaced, reset the lab and repair it in place instead.
- id: incident-available
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies pulled from the registry.
  command:
    args:
    - python
    - -m
    - dockyard.probes.registry_incident
    timeout: 120
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl describe pod on a new API Pod and
    read the pull error in its Events.
- id: incident-route
  title: The Service reaches exactly the two API Pods
  explanation: The dispatch Service must select exactly the two ready API Pods.
  command:
    args:
    - python
    - -m
    - dockyard.probes.registry_incident
    timeout: 120
  expectation: json
  json_path:
  - route
  expected: 'true'
  diagnostic: The Service does not reach the two API Pods yet. They only join once they pull their image
    and become ready.
- id: incident-workflow
  title: A new job is completed and saved
  explanation: Dockyard submits a real job and checks PostgreSQL stores the worker’s result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.registry_incident
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running and read kubectl logs deployment/worker.
- id: incident-contract
  title: A fresh Pod can pull and run the private release
  explanation: A new Pod using the workload’s pull Secret must pull dispatch:incident from the authenticated
    registry and run it, with authentication still required.
  command:
    args:
    - python
    - -m
    - dockyard.probes.registry_incident
    timeout: 120
  expectation: json
  json_path:
  - contract
  expected: 'true'
  diagnostic: 'A fresh Pod still cannot pull the release with the workload’s credentials. Check the registry-pull
    Secret is type kubernetes.io/dockerconfigjson, for the exact address in registry.txt, with user learner
    and the current password, and that the Deployment still uses imagePullPolicy: Always.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- registry-auth
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
- registry
alternatives:
- Equivalent scoped repairs are accepted when the observed outcomes and explicit budgets hold.
failure_modes:
- Healthy process state alone does not demonstrate a working request path or completed background job.
starter_failure_checks:
- incident-available
- incident-route
- incident-contract
- incident-workflow
