id: exam-cka-b
revision: 2
module: 24
order: 101
title: Native cluster maintenance assessment
summary: 'A timed CKA-style practice exam: eight maintenance tasks, including an upgrade, on a real kubeadm
  cluster.'
kind: exam
runtime: linux
nodes: 2
minutes: 120
outcomes:
- Upgrade the cluster to 1.37.1
- Renew the API server certificate
- Bring back the scheduler
- Allow an automation account to scale Deployments
- Fix the Service selector
- Fix a NetworkPolicy without opening it up
- Protect the API during maintenance
- Keep the application working
prerequisites:
- m24-mission
objectives:
- cka.lifecycle
- cka.components
- cka.rbac
- cka.service-diagnosis
- cka.network-policy
- cka.scheduling
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What does a practice exam score tell you?
  options:
  - How many of these tasks worked when time was up.
  - Whether you will pass the real exam.
  - How many commands you typed.
  correct: 0
  explanation: The score comes from checking the final state of each task. It shows where to practise
    next; it cannot predict a real exam result.
hints:
- Hints are not available during the exam. Afterwards, open each task's results to see what was checked.
- For each task you missed, compare the live objects with the task text using kubectl get -o yaml and
  kubectl describe.
- Work through the lessons linked from each missed task, then try a fresh attempt without help.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - -m
  - dockyard.fixtures.exam_maintenance
  timeout: 180
checks:
- id: exam-upgrade
  title: The cluster runs 1.37.1 everywhere
  explanation: The API server, control-plane images, and both kubelets must report v1.37.1, with both
    original nodes Ready and schedulable.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - upgrade
  expected: 'true'
  diagnostic: 'Review the kubeadm upgrade order: control plane first with kubeadm upgrade apply, then
    each node’s kubelet, draining and uncordoning each.'
- id: exam-renewed
  title: The API server serves a renewed certificate
  explanation: The certificate the API server presents must have a new serial number and the original
    CA.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - renewed
  expected: 'true'
  diagnostic: Review kubeadm certs renew apiserver and restarting the API server container with crictl
    stop.
- id: exam-scheduler
  title: The scheduler is back and places new Pods
  explanation: All control-plane components must be running and a new Pod must be scheduled.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - scheduler
  expected: 'true'
  diagnostic: Review static Pod manifests in /etc/kubernetes/manifests.
- id: exam-rbac
  title: release-operator can scale Deployments and nothing more
  explanation: It must get and list Deployments and get, patch, and update deployments/scale, and must
    not read Secrets, create Pods, or delete, patch, or update Deployments.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - rbac
  expected: 'true'
  diagnostic: Review Role rules for a subresource such as deployments/scale, and kubectl auth can-i --subresource.
- id: exam-service
  title: Service dispatch reaches the two ready API Pods
  explanation: The Service’s endpoints must be exactly the two ready API Pods, and /healthz through it
    must answer from Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: Review Service selectors against Pod labels.
- id: exam-network
  title: The API reaches Redis and the other rules still hold
  explanation: The API must connect to queue on 6379 while the existing allow and deny rules, including
    DNS over TCP and UDP, still behave as before.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - network
  expected: 'true'
  diagnostic: Review the port in the egress rule for the queue.
- id: exam-budget
  title: The disruption budget allows exactly one eviction
  explanation: PDB dispatch-maintenance must select both API Pods and, with two healthy replicas, allow
    exactly one disruption.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - budget
  expected: 'true'
  diagnostic: Review PodDisruptionBudget minAvailable and maxUnavailable, and ALLOWED DISRUPTIONS in kubectl
    get pdb.
- id: exam-preserved
  title: The original cluster and data are still there
  explanation: The namespace, both Node objects, the maintenance-sentinel ConfigMap, and the stored job
    must be the originals.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: Something from before the exam is missing, or the database is not running, so the stored
    job could not be read. Check db-0 is running, and upgrade and repair in place instead of rebuilding.
- id: exam-workflow
  title: A new job completes and is saved
  explanation: A job sent from the frontend must be processed by a worker and saved in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.exam_maintenance
    timeout: 300
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: Review the Service, NetworkPolicy, and node readiness tasks; the job needs all of them.
    Pods created while the API server was restarting cannot pass NetworkPolicy until the network plugin
    catches up. If the worker logs dependency_retry, wait a minute and check again.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
- helm
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Any method that produces the requested final state is accepted.
- Only the final state of the cluster is checked, not your commands.
failure_modes:
- A healthy process alone does not show a working request path or a finished job.
- Recreating an object gives it a new identity, which does not count as keeping the original.
starter_failure_checks:
- exam-upgrade
- exam-renewed
- exam-scheduler
- exam-rbac
- exam-service
- exam-network
- exam-budget
native_version: previous
