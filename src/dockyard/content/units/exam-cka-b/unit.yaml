id: exam-cka-b
revision: 1
module: 24
order: 101
title: Native cluster maintenance assessment
summary: Eight original tasks combine real adjacent-version maintenance, static-component recovery, certificate
  renewal, and application continuity.
kind: exam
runtime: linux
nodes: 2
minutes: 120
outcomes:
- Upgrade the existing cluster in place
- Renew the served API certificate
- Recover the missing static scheduler
- Grant release automation a narrow scale capability
- Repair the stable release selector
- Repair dependency egress without widening trust
- Protect one available API during voluntary disruption
- Prove operational continuity after maintenance
prerequisites:
- m24-mission
objectives:
- cka.lifecycle
- cka.components
- cka.rbac
- cka.service-diagnosis
- cka.network-policy
- cka.scheduling
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What makes a completed practice score useful for review?
  options:
  - Recorded runtime outcomes tied to task requirements.
  - The number of commands typed.
  - A claim that the score guarantees certification.
  correct: 0
  explanation: The score reports observed outcomes and directs review; it is not an official certification
    result.
hints:
- Separate a healthy API from the failing node agent or missing API objects.
- Read the worker service journal and its configuration, or inspect the supplied snapshot and original
  recovery contract.
- Repair the invalid kubelet duration without resetting the node; for state loss, restore the verified
  snapshot with revision bump and compaction, then verify original identities and fresh work.
sources:
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
- https://v1-35.docs.kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
