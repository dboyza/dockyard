id: m04-permissions
revision: 1
module: 4
order: 2
title: Fix storage access without giving away extra power
summary: The API is healthy but cannot save jobs; fix the storage owner without running as root.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Compare the app’s user and group numbers with who owns the data folder.
- Explain why a healthy status does not prove the app can save data.
- Fix ownership without running the app as root or opening the folder to everyone.
prerequisites:
- m04-mounts
objectives:
- docker.permissions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You fix the /data owner in the Dockerfile and rebuild. Does the existing volume change?
  options:
  - No. The volume keeps its own files and owners.
  - Yes. Every start copies the image’s /data over it.
  - Only if the host port changes.
  correct: 0
  explanation: An existing volume lives separately from the image and hides the image’s /data folder.
    Rebuilding does not touch it.
hints:
- Compare docker exec "$DOCKYARD_CONTAINER" id with docker exec "$DOCKYARD_CONTAINER" ls -ldn /data.
- The API runs as user 10001. Change the owner of the existing volume, not the image.
- Run a short-lived labeled container with the volume mounted and chown 10001:10001 /data, then try saving
  a job again.
sources:
- https://docs.docker.com/engine/storage/bind-mounts/
- https://docs.docker.com/engine/storage/volumes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - volume
  - create
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{volume}}'
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - -v
  - '{{volume}}:/data'
  - '{{image}}'
- args:
  - docker
  - run
  - --rm
  - --label
  - io.dockyard.lab={{lab_id}}
  - -v
  - '{{volume}}:/data'
  - '{{python_image}}'
  - sh
  - -c
  - chown 0:0 /data && chmod 700 /data
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: storage-mount
  title: The expected writable storage is mounted at /data
  explanation: Dispatch keeps its database in /data, so that path must be backed by the storage this task
    asks for, and it must be writable.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-volume
    timeout: 45
  expectation: json
  json_path:
  - mount
  expected: 'true'
  diagnostic: /data is not mounted from the expected storage, or it is read-only. Run docker inspect --format
    '{{json .Mounts}}' "$DOCKYARD_CONTAINER" and check the Type, Source or Name, Destination, and RW fields
    against the task. Mounts are fixed at creation, so replace the container to change them.
- id: storage-roundtrip
  title: The API can create and read a new job
  explanation: Dockyard submits a new job through the API and reads it back to confirm storage really
    works.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-volume
    timeout: 45
  expectation: json
  json_path:
  - roundtrip
  expected: 'true'
  diagnostic: The API could not save and then list a new job. Submit one yourself with curl and read the
    error message, then check docker logs. "unable to open database file" usually means the process user
    cannot write to /data; compare docker exec "$DOCKYARD_CONTAINER" id with docker exec "$DOCKYARD_CONTAINER"
    ls -ldn /data.
- id: storage-durable
  title: A separate read-only container can read the saved job
  explanation: A separate read-only container opens the same storage and finds the new job, which shows
    the data lives outside the API container.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-volume
    timeout: 45
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: The new job was not found when Dockyard read the storage from a separate container. This
    usually means the API is writing to a different location than the mounted storage. Check that the
    mount target is exactly /data.
- id: least-permission
  title: Storage works for a non-root user without world-write access
  explanation: The fix should give the API's own user access, not open the directory to everyone or run
    the API as root.
  command:
    args:
    - docker
    - exec
    - '{{container}}'
    - python
    - -c
    - import os; print(os.getuid()!=0 and os.access("/data", os.W_OK) and not os.stat("/data").st_mode
      & 2)
  expectation: equals
  expected: 'True'
  diagnostic: 'Storage works, but only with broader access than needed: the process is root, or /data
    is writable by every user. Compare docker exec "$DOCKYARD_CONTAINER" id with ls -ldn /data, change
    the owner to 10001:10001, and remove any world-write permission.'
capabilities:
- docker
- python-image
checkpoint: dispatch-storage-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- storage-mount
- storage-roundtrip
- storage-durable
- least-permission
