id: m09-identities
revision: 1
module: 9
order: 3
title: Give a Pod its own API identity
summary: Let one Pod list Pods through the Kubernetes API, and confirm it can do nothing more.
kind: lesson
runtime: kubernetes
minutes: 35
outcomes:
- Explain the difference between an identity and its permissions.
- Create a Role and RoleBinding for a ServiceAccount.
- Test permissions with kubectl auth can-i and with the Pod’s own token.
prerequisites:
- m09-secrets
objectives:
- kubernetes.configuration
- kubernetes.identity
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: You can list Pods, but the inventory Pod gets HTTP 403. What should you check first?
  options:
  - The Pod’s ServiceAccount and what is bound to it.
  - Your own command history.
  - The image tag.
  correct: 0
  explanation: You and the Pod are different identities. 403 means the Pod was identified but its identity
    is not allowed.
hints:
- Find the inventory Pod’s serviceAccountName, then read the RoleBinding’s subjects.
- The subject must be the ServiceAccount dispatch-reader in namespace dispatch.
- Change the RoleBinding subject name from wrong-reader to dispatch-reader in identity.yaml and apply
  it.
sources:
- https://kubernetes.io/docs/concepts/configuration/configmap/
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://kubernetes.io/docs/concepts/security/service-accounts/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 90
checks:
- id: configuration-config
  title: Dispatch reads its settings from the ConfigMap
  explanation: DISPATCH_ENV must come from the ConfigMap’s environment key, and /config must be a read-only
    mount of the ConfigMap, so /config reports the right environment and banner.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - config
  expected: 'true'
  diagnostic: Dispatch’s /config does not show the ConfigMap’s values yet. In the API container, DISPATCH_ENV
    needs valueFrom.configMapKeyRef with name dispatch-settings and key environment, and /config needs
    a read-only configMap volume that provides banner.txt from the banner.txt key. Run sh run.sh and wait
    for the rollout after changing it.
- id: configuration-secret
  title: Dispatch logs in to its database with the mounted Secret
  explanation: The password must arrive as a read-only file from the dispatch-database Secret, and the
    API must be ready, which proves it logged in.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - secret
  expected: 'true'
  diagnostic: The password file is missing, wrong, or not being used. Run kubectl describe pod on an API
    Pod and read the Events for volume errors. The secret volume must map the key password to the file
    password, be mounted read-only at /var/run/dispatch, and DB_PASSWORD_FILE must stay /var/run/dispatch/password
    with no DB_PASSWORD variable.
- id: configuration-processing
  title: A new job is completed
  explanation: Dockyard submits a real job and waits for a worker to finish it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - processing
  expected: 'true'
  diagnostic: A new job was not completed. Check kubectl get pods for workers that are not ready, then
    kubectl logs deployment/worker for database or Redis errors.
- id: configuration-identity
  title: The inventory Pod can list Pods, and nothing more
  explanation: Using its own token, the inventory Pod must list Pods in dispatch, be refused Secrets and
    kube-system Pods, and be refused create, patch, update, and delete. API Pods must have no token.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - configuration
    timeout: 90
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: The inventory identity has too little or too much access, or an API Pod still has a token.
    Run the request from the Pod shown in the lesson and kubectl auth can-i --list --as=system:serviceaccount:dispatch:dispatch-reader.
    Check the RoleBinding’s subject is ServiceAccount dispatch-reader in namespace dispatch, and that
    the Role only allows get, list, and watch on pods.
capabilities:
- docker
- kind
- kubectl
- calico
checkpoint: dispatch-config-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent resource definitions are accepted when actual delivery, application behavior, and allowed/denied
  API requests satisfy the contract.
failure_modes:
- A ConfigMap or Secret existing in the API does not prove a running process consumes it.
- Administrator permissions do not demonstrate workload authorization.
starter_failure_checks:
- configuration-identity
