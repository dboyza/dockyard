id: i06-service-selector
revision: 1
module: 10
order: 90
title: Every API Pod is ready, but the Service reaches none of them
summary: After a label change, both API Pods are healthy but requests to their Service fail.
kind: incident
runtime: kubernetes
minutes: 35
outcomes:
- Use EndpointSlices and labels to find why a Service selects no Pods.
- Explain how a selector with several labels matches Pods.
- Reconnect the Service without losing data, and confirm with a real job.
prerequisites:
- m10-mission
objectives:
- ckad.debugging
- cka.service-diagnosis
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Both Pods are ready and answer directly, but the Service fails. Where should you look first?
  options:
  - The Service’s EndpointSlices and selector.
  - The database logs.
  - The container image.
  correct: 0
  explanation: Healthy Pods that the Service cannot reach point at how the Service chooses Pods, not at
    the Pods themselves.
hints:
- Compare the Service’s selector with the labels on the ready Pods (kubectl get pods --show-labels).
- A Pod must have every label in the selector. Which one is missing?
- Remove the stale extra key from the Service selector, or add that label to the Deployment’s Pod template,
  then submit a job through the Service.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 360
checks:
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - selector
    timeout: 120
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s data-db-0 claim, or the original job is gone. If
    they were deleted or replaced, reset the lab and repair it in place instead.
- id: incident-available
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - selector
    timeout: 120
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The API does not have two available copies. Run kubectl get deployment dispatch and kubectl
    describe pods -l app=dispatch.
- id: incident-route
  title: The Service reaches exactly the two API Pods
  explanation: The dispatch Service must select exactly the two ready API Pods, and a request through
    it must reach Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - selector
    timeout: 120
  expectation: json
  json_path:
  - route
  expected: 'true'
  diagnostic: 'The Service still does not reach exactly the two API Pods. Compare its selector (kubectl
    get service dispatch -o yaml) with the Pod labels (kubectl get pods --show-labels): every key in the
    selector must be on the Pods.'
- id: incident-workflow
  title: A new job is completed and saved
  explanation: Dockyard submits a real job through the API and checks PostgreSQL stores the worker’s result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - selector
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running and read kubectl logs deployment/worker.
- id: incident-contract
  title: The API’s health checks are unchanged
  explanation: The fix must leave the API’s startup, liveness, and readiness probes as they were.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - selector
    timeout: 120
  expectation: json
  json_path:
  - contract
  expected: 'true'
  diagnostic: The API’s probes changed. It should still use /startupz, /healthz, and /readyz on port 8080.
    Fix the selector or labels without editing the probes.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent scoped repairs are accepted when the observed outcomes and explicit budgets hold.
failure_modes:
- Healthy process state alone does not demonstrate a working request path or completed background job.
starter_failure_checks:
- incident-route
- incident-workflow
