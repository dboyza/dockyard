id: m14-operators
revision: 1
module: 14
order: 3
title: Extend the API with a reconciled WorkerPool
summary: Connect a validated custom resource to a running namespaced controller.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Distinguish a CRD schema, custom resource, and controller.
- Trace resource ownership and status generations.
- Observe an operator repairing manual replica drift.
prerequisites:
- m14-helm
objectives:
- kubernetes.packaging
- kubernetes.extensions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A WorkerPool requests two replicas but someone scales its generated Deployment to zero. What
    should a working controller do?
  options:
  - Restore two replicas from the WorkerPool intent.
  - Change the WorkerPool to zero automatically.
  - Stop reconciling permanently.
  correct: 0
  explanation: The custom resource is the declared source of truth for the generated workload.
hints:
- Compare the declared source with the live object before changing unrelated resources.
- Use the supplied renderers and scoped namespace; wait for a current-generation ready state.
- Review the worked commands in the concept, then inspect the measured evidence for each remaining criterion.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://helm.sh/docs/intro/using_helm/
- https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
- https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: packaging-extension
  title: Validated WorkerPool owns two available managed workers
  explanation: Inspect rendered intent, ownership, runtime behavior, and release evidence.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - extension
  expected: 'true'
  diagnostic: Inspect CRD schema, controller availability, WorkerPool generation, and Deployment owner
    UID.
- id: packaging-reconciliation
  title: The controller repaired real generated-workload drift
  explanation: Inspect rendered intent, ownership, runtime behavior, and release evidence.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - reconciliation
  expected: 'true'
  diagnostic: Run operator-proof.py after the controller and two managed workers are ready.
- id: packaging-workers
  title: Operator-owned workers complete a unique Dispatch job
  explanation: Inspect rendered intent, ownership, runtime behavior, and release evidence.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - workers
  expected: 'true'
  diagnostic: Keep the ordinary workers at zero and inspect managed-worker logs and dependencies.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- workerpool
checkpoint: dispatch-packaging-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent overlay patches and chart formatting are accepted when rendered and live values agree.
- The managed workload must retain the real WorkerPool UID ownership and process work after the recorded
  drift rehearsal.
failure_modes:
- Rendering a resource does not deploy it.
- A deployed Helm release can still declare an unavailable application.
- A CRD alone does not implement a reconciliation loop.
starter_failure_checks:
- packaging-extension
- packaging-reconciliation
- packaging-workers
