id: m19-mission
revision: 2
module: 19
order: 4
title: 'Mission: recover a native cluster'
summary: Fix the runtime tools, the kubelet, and an operator client on real nodes, and prove the application
  works.
kind: mission
runtime: linux
nodes: 2
minutes: 60
outcomes:
- Diagnose several independent node and client faults.
- Prove each layer separately after repairing it.
- Write a handoff with the evidence for each fix.
prerequisites:
- m19-control-plane
objectives:
- cka.nodes
- cka.components
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: After fixing one fault, what is the strongest completion evidence?
  options:
  - Repeat independent checks across every required boundary and complete a fresh job.
  - Stop after the first successful command.
  - Assume the unchanged layers are healthy.
  correct: 0
  explanation: Compound failures need independent evidence for each repaired boundary.
hints:
- 'Check each layer on its own: crictl on the worker, the kubelets, and the operator client on the control
  plane.'
- The fixes are the crictl socket path, the kubelet service, and the operator client’s server address.
- After each fix, repeat that layer’s check, then submit a job at the end.
sources:
- https://v1-35.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
- https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
- https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
- https://kubernetes.io/docs/concepts/architecture/leases/
starter: {}
reference: {}
prepare:
- args:
  - python
  - build.py
  timeout: 600
- args:
  - /bin/sh
  - bootstrap.sh
  timeout: 420
- args:
  - python
  - setup-hosts.py
  timeout: 60
- args:
  - python
  - inject.py
  - mission
  timeout: 90
checks:
- id: native-cri
  title: crictl on the worker sees a real Dispatch process
  explanation: On the worker, sudo crictl info must use the normal /etc/crictl.yaml and report RuntimeReady
    with the systemd cgroup driver. It must show a running API container whose process is under the systemd
    cgroup tree.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - cri
  expected: 'true'
  diagnostic: crictl on the worker still cannot see the runtime properly. Inside the worker, compare the
    endpoint in /etc/crictl.yaml with unix:///run/containerd/containerd.sock, check systemctl is-active
    containerd, and run sudo crictl info again.
- id: native-kubelet
  title: Both kubelets are active and reporting
  explanation: The kubelet service must be active on both VMs, both nodes Ready, and both node leases
    renewed recently.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - kubelet
  expected: 'true'
  diagnostic: A kubelet is not active or its node is not reporting. Inside that VM, run systemctl status
    kubelet and sudo journalctl -u kubelet -n 30 to see why; fix any configuration error before starting
    it. Then check kubectl get leases -n kube-node-lease -o wide.
- id: native-operator
  title: The operator client inside the control plane works securely
  explanation: $HOME/.kube/operator.conf in the control-plane VM must list both nodes against the real
    API server with certificate checks on. It must be mode 600. All four control-plane static Pods must
    be running.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - operator
  expected: 'true'
  diagnostic: The operator client still fails or is not private. Read its error category, compare its
    server address with the one in /etc/kubernetes/admin.conf, keep certificate checks on, and set chmod
    600 on the file.
- id: native-workflow
  title: A job from the frontend completes on the native cluster
  explanation: A real job submitted from the frontend must be completed by a worker and saved in the database.
  command:
    args:
    - python
    - -m
    - dockyard.probes.native
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job did not complete. Check kubectl get pods for anything not ready, then read kubectl
    logs deployment/worker. If a node is NotReady, fix that first.
capabilities:
- docker
- limactl
- kubectl
- calico
- native-cluster
checkpoint: dispatch-operations-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent editors and diagnostic commands are accepted; no shell history or command sequence is graded.
- The declared CRI and guest operator configuration paths are interface contracts; their formatting may
  vary.
failure_modes:
- An old Ready condition can outlive the last kubelet heartbeat.
- A bad diagnostic client endpoint does not itself stop running containers.
- Disabling TLS verification hides a trust failure instead of demonstrating a valid client.
starter_failure_checks:
- native-cri
- native-kubelet
- native-operator
