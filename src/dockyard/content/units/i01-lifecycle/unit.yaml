id: i01-lifecycle
revision: 1
module: 2
order: 80
title: The deployment exited successfully, but the service vanished
summary: A new start-up script reports success, then the container exits and Dispatch disappears.
kind: incident
runtime: docker
minutes: 30
outcomes:
- Use the container’s state, command, and logs to find why it stops.
- Explain why a script that backgrounds the server ends the container.
- Fix the image so Dispatch stays running, and confirm it with a fresh request.
prerequisites:
- m02-dockerfile
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What would show that this incident is really fixed?
  options:
  - A fresh request to /healthz succeeds and the container keeps running.
  - The launch command exits with code 0.
  - docker ps shows a container for a moment.
  correct: 0
  explanation: The launch already exits with code 0 and that is exactly the problem. Only a working, lasting
    service shows the fix.
hints:
- 'Look at what the container actually runs: docker inspect --format ''{{json .Config.Cmd}}'' "$DOCKYARD_CONTAINER",
  then read launch.sh in the workspace.'
- In launch.sh, the & after python app.py sends the server to the background, and the script then finishes.
  The container stops when the script does.
- Change the line to exec python app.py (without &), rebuild the image with the BASE_IMAGE argument, remove
  the stopped container, and run a new one with the same name, label, and port.
sources:
- https://docs.docker.com/engine/containers/run/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - --label
  - io.dockyard.lab={{lab_id}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
  timeout: 30
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - '0'
  - State
  - Running
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
  points: 1
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{lab_id}}'
  output: stdout
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
  points: 1
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: dispatch
  output: stdout
  json_path:
  - service
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
  points: 1
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{port}}'
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostPort
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 127.0.0.1
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
capabilities:
- docker
- python-image
checkpoint: dispatch-process-v1
images:
- python
nodes: 1
native_version: current
alternatives:
- Equivalent scoped repairs are accepted when actual outcomes meet every constraint.
failure_modes:
- A superficial process or configuration change can leave the user-visible failure intact.
starter_failure_checks:
- process-running
- application-response
