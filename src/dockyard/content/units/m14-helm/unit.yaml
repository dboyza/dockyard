id: m14-helm
revision: 1
module: 14
order: 2
title: Helm releases and rollbacks
summary: Roll a Helm release back from a bad revision and fix the values that caused it.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Explain charts, values, releases, and revisions.
- Use helm history, get values, rollback, and upgrade --install.
- Keep passwords out of a chart’s source.
prerequisites:
- m14-kustomize
objectives:
- kubernetes.packaging
- kubernetes.extensions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A Helm revision sets replicas to 0. Can Helm still report it as deployed?
  options:
  - Yes. Zero ready of zero requested passes Helm’s wait.
  - No. Helm checks the app really serves.
  - No. Helm refuses zero replicas.
  correct: 0
  explanation: Helm checks the objects reached their declared state. It cannot know zero replicas is a
    mistake.
hints:
- helm history dispatch -n staging shows which revision was healthy.
- 'Use helm rollback dispatch 1 -n staging --wait, then set api.replicas: 2 and environment: staging in
  values-practice.yaml.'
- Check helm get values dispatch -n staging, kubectl get pods -n staging, and Dispatch’s /config.
sources:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
- https://helm.sh/docs/intro/using_helm/
- https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
- https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 360
checks:
- id: packaging-release
  title: The staging Helm release is healthy with the right values
  explanation: The latest staging revision must be deployed, both Helm’s values and values-practice.yaml
    must say 2 replicas and environment staging, and Dispatch in staging must report staging.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - release
  expected: 'true'
  diagnostic: 'The staging release is not right yet. Check helm history dispatch -n staging, helm get
    values dispatch -n staging, and values-practice.yaml: both must have api.replicas 2 and environment
    staging. Then check kubectl get pods -n staging.'
- id: packaging-rollback
  title: Helm history shows the rollback
  explanation: After the failed revision, the history must contain a revision created by helm rollback.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - packaging
    timeout: 120
  expectation: json
  json_path:
  - rollback
  expected: 'true'
  diagnostic: No rollback revision was found. Use helm rollback dispatch 1 -n staging --wait rather than
    reinstalling or scaling by hand, then check helm history dispatch -n staging.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- helm
checkpoint: dispatch-packaging-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent overlay patches and chart formatting are accepted when rendered and live values agree.
- The managed workload must retain the real WorkerPool UID ownership and process work after the recorded
  drift rehearsal.
failure_modes:
- Rendering a resource does not deploy it.
- A deployed Helm release can still declare an unavailable application.
- A CRD alone does not implement a reconciliation loop.
starter_failure_checks:
- packaging-release
- packaging-rollback
