id: m16-pipeline
revision: 2
module: 16
order: 1
title: A test gate before publishing
summary: Turn a pipeline’s test gate back on so only tested images are published.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Make a failing test stop an image from being published.
- Record and read the published image’s digest.
- Prove a gate works by making it fail on purpose.
prerequisites:
- m15-mission
objectives:
- platform.delivery
- kubernetes.packaging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The candidate’s tests fail. What should the pipeline do?
  options:
  - Stop before publishing.
  - Publish, then look at the tests later.
  - Treat a successful build as a pass.
  correct: 0
  explanation: A gate exists to stop untested or failing work reaching the registry.
hints:
- Read pipeline.json and find where pipeline.py checks it.
- Set run_tests to true.
- Run python pipeline.py and read release.json.
sources:
- https://docs.docker.com/reference/cli/docker/image/push/
- https://git-scm.com/docs/git-revert
- https://fluxcd.io/flux/components/source/gitrepositories/
- https://fluxcd.io/flux/components/kustomize/kustomizations/
- https://kind.sigs.k8s.io/docs/user/local-registry/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: delivery-pipeline
  title: The published image passed its tests
  explanation: release.json must record a tested release whose digest matches the registry. The tests
    must pass again against that exact image. Its source fingerprints must match the current files.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - pipeline
  expected: 'true'
  diagnostic: 'The published release is untested or out of date. Check run_tests is true in pipeline.json
    and run python pipeline.py again. If you edited source files or tests after publishing, the fingerprints
    in release.json no longer match: publish again.'
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- delivery
checkpoint: dispatch-delivery-v1
images:
- python
- postgres
- redis
- busybox
- git
- registry
- flux_source
- flux_kustomize
alternatives:
- Equivalent Git commit messages and YAML formatting are accepted; actual digest selection, ancestry,
  and running behavior determine completion.
- Use the supplied rehearsal or equivalent ordinary commands while preserving the measured evidence contract.
failure_modes:
- A skipped test gate can publish an unverified candidate.
- A healthy Git source cannot update a suspended release.
- A live rollback is overwritten if the bad Git source remains.
starter_failure_checks:
- delivery-pipeline
