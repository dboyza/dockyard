id: i05-readiness-port
revision: 1
module: 12
order: 90
title: The API starts, but never becomes ready
summary: After a port-name cleanup, both API Pods start and answer directly, but never become ready for
  the Service.
kind: incident
runtime: kubernetes
minutes: 35
outcomes:
- Use probe events to tell startup, readiness, and dependency failures apart.
- Explain how a named probe port is resolved.
- Restore readiness without weakening the probes, and confirm with a real job.
prerequisites:
- m12-mission
objectives:
- ckad.debugging
- cka.service-diagnosis
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Startup passes and direct requests work, but readiness fails with connection refused. What
    is the most likely cause?
  options:
  - The readiness probe is aimed at a port nothing listens on.
  - The database is down.
  - The image is missing.
  correct: 0
  explanation: Connection refused means nothing answered at that port at all. A database problem would
    give an answer saying not ready.
hints:
- Compare startup, readiness, Pod events, and the named container ports.
- A named HTTP probe port resolves against the target container, not the Service.
- Point the readiness probe at port 8080, where the API really listens, keep the /readyz path, and wait
  for two ready replicas.
sources:
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 360
checks:
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - readiness
    timeout: 120
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s data-db-0 claim, or the original job is gone. If
    they were deleted or replaced, reset the lab and repair it in place instead.
- id: incident-available
  title: Two API copies are available
  explanation: The dispatch Deployment must have two ready copies.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - readiness
    timeout: 120
  expectation: json
  json_path:
  - available
  expected: 'true'
  diagnostic: The API Pods are still not ready. Run kubectl describe pod -l app=dispatch and read the
    readiness probe line and its failure events.
- id: incident-route
  title: The Service reaches exactly the two API Pods
  explanation: Once ready, both API Pods must appear in the dispatch Service’s endpoints, and a request
    through it must reach Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - readiness
    timeout: 120
  expectation: json
  json_path:
  - route
  expected: 'true'
  diagnostic: The Service does not reach the two API Pods yet. They only join its endpoints once their
    readiness probe passes; check kubectl get endpointslices -l kubernetes.io/service-name=dispatch.
- id: incident-workflow
  title: A new job is completed and saved
  explanation: Dockyard submits a real job through the API and checks PostgreSQL stores the worker’s result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - readiness
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the workers are running and read kubectl logs deployment/worker.
- id: incident-contract
  title: The probes still check the right things
  explanation: Startup must stay on /startupz, liveness on /healthz, and readiness on /readyz, with readiness
    reaching the real listener on port 8080.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - readiness
    timeout: 120
  expectation: json
  json_path:
  - contract
  expected: 'true'
  diagnostic: A probe changed path, or readiness still does not reach port 8080. If readiness uses a port
    name, check which containerPort that name belongs to in the api container’s ports list.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-release-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent scoped repairs are accepted when the observed outcomes and explicit budgets hold.
failure_modes:
- Healthy process state alone does not demonstrate a working request path or completed background job.
starter_failure_checks:
- incident-available
- incident-route
- incident-contract
- incident-workflow
