# Egress policy for every Pod in the frontend namespace.
# The rule list below allows all outgoing traffic; replace it with only what the clients need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: frontend
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - {}
