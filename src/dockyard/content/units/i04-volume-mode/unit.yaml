id: i04-volume-mode
revision: 1
module: 4
order: 90
title: Health is green, but saving jobs fails
summary: After permission maintenance, the API still answers and reads jobs, but cannot save new ones.
kind: incident
runtime: docker
minutes: 30
outcomes:
- Test the action that is failing, not just the health check.
- Read a file’s owner and permission bits and compare them with the app’s user.
- Restore the narrowest permission needed, keeping the original data.
prerequisites:
- m04-mission
objectives:
- docker.permissions
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Health checks pass and old jobs load, but new jobs fail. What does that suggest?
  options:
  - The app can read its data but not write it.
  - The container has stopped.
  - The port mapping is wrong.
  correct: 0
  explanation: Reading working while writing fails points at write permission, not at the network or the
    process.
hints:
- Try saving a job with curl and read the error. Then compare the app’s user with the owner and permissions
  of /data/jobs.db.
- In ls -ln, the first column shows permissions. rw- means the owner can read and write; r-- means read
  only.
- Give the file’s owner write permission again with chmod u+w, using a short-lived labeled container on
  the same volume, then save a new job.
sources:
- https://docs.docker.com/engine/storage/bind-mounts/
- https://docs.docker.com/engine/storage/volumes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300.0
  stdin: null
  allowed_exit_codes:
  - 0
- args:
  - docker
  - volume
  - create
  - --label
  - io.dockyard.lab={{lab_id}}
  - '{{volume}}'
  timeout: 30.0
  stdin: null
  allowed_exit_codes:
  - 0
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - -v
  - '{{volume}}:/data'
  - '{{image}}'
  timeout: 30.0
  stdin: null
  allowed_exit_codes:
  - 0
- args:
  - docker
  - exec
  - --user
  - '0'
  - '{{container}}'
  - python
  - -c
  - 'import os,sqlite3

    c=sqlite3.connect(''/data/jobs.db'')

    c.execute(''CREATE TABLE IF NOT EXISTS jobs(id TEXT PRIMARY KEY,title TEXT NOT NULL)'')

    c.execute(''INSERT INTO jobs VALUES (?,?)'',(''incident-{{lab_id}}'',''Keep this original job''))

    c.commit();c.close()

    os.chown(''/data'',10001,10001);os.chmod(''/data'',0o750)

    os.chown(''/data/jobs.db'',10001,10001);os.chmod(''/data/jobs.db'',0o400)

    '
  timeout: 120
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 'true'
  output: stdout
  json_path:
  - '0'
  - State
  - Running
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
  points: 1
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{lab_id}}'
  output: stdout
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
  points: 1
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - --retry
    - '5'
    - --retry-delay
    - '1'
    - --retry-all-errors
    - http://127.0.0.1:{{port}}/healthz
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: dispatch
  output: stdout
  json_path:
  - service
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
  points: 1
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: '{{port}}'
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostPort
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
    timeout: 30.0
    stdin: null
    allowed_exit_codes:
    - 0
  expectation: json
  expected: 127.0.0.1
  output: stdout
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
  points: 1
- id: incident-mount
  title: The original owned named volume is mounted read/write
  explanation: The API must still use the original named volume, mounted writable at /data.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incidents
    - permissions
    timeout: 90
  expectation: json
  json_path:
  - mount
  expected: 'true'
  diagnostic: /data is not the original volume, or it is read-only. Inspect the container's Mounts. Replacing
    the volume would lose the original job, so keep the existing one.
- id: incident-roundtrip
  title: A non-root API creates and reads a fresh job
  explanation: A new job must save and read back through the API while it runs as an ordinary user.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incidents
    - permissions
    timeout: 90
  expectation: json
  json_path:
  - roundtrip
  expected: 'true'
  diagnostic: The API still cannot save a new job. Submit one with curl, read the error, and compare the
    process identity with the owner and mode of /data and jobs.db.
- id: incident-durable
  title: A separate read-only volume reader finds the same new job
  explanation: A separate read-only reader must find the new job in the volume itself.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incidents
    - permissions
    timeout: 90
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: The new job did not appear in the volume. Confirm the API writes to the same volume that
    is mounted at /data.
- id: incident-preserved
  title: The original job remains present
  explanation: Fixing the incident must not lose the job that existed before it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incidents
    - permissions
    timeout: 90
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original job is missing. Request /jobs. If the volume was replaced or the database deleted,
    reset the lab and repair the existing data instead.
- id: incident-nonroot
  title: The application and database still run as user 10001 without opening up write access
  explanation: The fix should keep the API as user 10001 and avoid giving every user write access.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incidents
    - permissions
    timeout: 90
  expectation: json
  json_path:
  - nonroot
  expected: 'true'
  diagnostic: The API is not running as 10001, jobs.db is not owned by 10001, or the file is writable
    by its group or every user. Compare the process id with ls -ln /data inside the container, and grant
    only the access the API needs.
capabilities:
- docker
- python-image
checkpoint: dispatch-storage-v1
images:
- python
nodes: 1
native_version: current
alternatives:
- Equivalent scoped repairs are accepted when actual outcomes meet every constraint.
failure_modes:
- A superficial process or configuration change can leave the user-visible failure intact.
starter_failure_checks:
- incident-roundtrip
- incident-durable
