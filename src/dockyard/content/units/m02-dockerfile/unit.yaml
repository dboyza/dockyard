id: m02-dockerfile
revision: 1
module: 2
order: 1
title: Build an image that carries its application
summary: Turn supplied source files into a runnable artifact that no longer depends on a host bind mount.
kind: lesson
runtime: docker
minutes: 35
outcomes:
- Explain the build context and distinguish build-time from runtime instructions.
- Write a Dockerfile with an explicit working directory and foreground command.
- Run the built artifact without mounting the source workspace.
prerequisites:
- m01-mission
objectives:
- docker.dockerfile
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: A Dockerfile contains EXPOSE 8080. Can you reach it from the host computer without a published port?
  options:
  - No; EXPOSE does not publish a host port.
  - Yes; Docker automatically selects host port 8080.
  - Only if the container runs as root.
  correct: 0
  explanation: EXPOSE records intended use. A runtime port mapping creates the host endpoint.
hints:
- 'Separate COPY and CMD: one adds files at build time, the other records how to start the container.'
- Use WORKDIR /app and copy both app.py and VERSION from the context.
- Build with the supplied BASE_IMAGE argument; run the resulting DOCKYARD_IMAGE without -v, but with the same label
  and loopback port pattern as Module 1.
sources:
- https://docs.docker.com/reference/dockerfile/
- https://docs.docker.com/build/building/context/
starter: {}
reference: {}
prepare: []
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Only the local host computer can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: self-contained
  title: The application runs without workspace mounts
  explanation: The application runs without workspace mounts
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: '[]'
  json_path:
  - '0'
  - Mounts
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: release
  title: The image serves the expected application release
  explanation: The image serves the expected application release
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  expected: dispatch-1
  json_path:
  - release
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
capabilities:
- docker
- python-image
checkpoint: dispatch-image-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- process-running
- lab-identity
- application-response
- published-port
- loopback-binding
- self-contained
- release
