apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dispatch-gateway
  namespace: dispatch
spec:
  gatewayClassName: traefik
  listeners:
  - name: web
    protocol: HTTP
    port: 8080
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dispatch
  namespace: dispatch
spec:
  parentRefs:
  - name: missing-gateway
  hostnames:
  - gateway.dispatch.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: dispatch
      port: 9090
