id: m10-mission
revision: 1
module: 10
order: 4
title: 'Mission: every path to Dispatch'
summary: Fix the internal Service, LoadBalancer, HTTPS Ingress, and Gateway route, and test each one.
kind: mission
runtime: kubernetes
minutes: 55
outcomes:
- Find separate faults on different paths to the same application.
- Check certificates and route conditions properly.
- Record a repeatable test for each path.
prerequisites:
- m10-gateway
objectives:
- kubernetes.services
- kubernetes.routing
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The internal Service works again. What does that tell you about the Ingress and Gateway routes?
  options:
  - Nothing yet; each needs its own test.
  - They must work, because they share the same Pods.
  - Their status no longer matters.
  correct: 0
  explanation: Sharing a backend does not fix a broken route, certificate, or attachment in front of it.
hints:
- Fix the internal Service first, then test each other path separately.
- Compare selectors, ports, the TLS Secret name, and parentRefs with the live objects.
- Use app=dispatch, port 8080, Secret dispatch-tls, and parent dispatch-gateway, with the two hostnames
  unchanged.
sources:
- https://kubernetes.io/docs/concepts/services-networking/service/
- https://kubernetes.io/docs/concepts/services-networking/ingress/
- https://gateway-api.sigs.k8s.io/concepts/api-overview/
- https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-gateway/
- https://metallb.io/concepts/layer2/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 120
- args:
  - kubectl
  - rollout
  - status
  - deployment/dispatch
  - --timeout=120s
  timeout: 130
checks:
- id: routing-service
  title: The dispatch Service reaches Dispatch inside the cluster
  explanation: A request to http://dispatch:8080 from inside the cluster must reach a Dispatch Pod.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - service
  expected: 'true'
  diagnostic: A request to the dispatch Service failed. Check its selector matches the Pods’ labels (kubectl
    get pods --show-labels) and its targetPort is 8080, where Dispatch listens. kubectl get endpointslices
    -l kubernetes.io/service-name=dispatch shows what it selected.
- id: routing-endpoints
  title: The Service’s endpoints are exactly the two Dispatch Pods
  explanation: The dispatch Service’s EndpointSlices must list the two ready Dispatch API Pods and nothing
    else.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - endpoints
  expected: 'true'
  diagnostic: The dispatch Service’s endpoints are not exactly the two Dispatch API Pods. Compare kubectl
    get endpointslices -l kubernetes.io/service-name=dispatch with kubectl get pods -l app=dispatch -o
    wide, and check the Service selector.
- id: routing-loadbalancer
  title: The LoadBalancer address reaches Dispatch
  explanation: dispatch-public must have an address from MetalLB, and a client on the cluster’s Docker
    network must reach Dispatch through it.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - loadbalancer
  expected: 'true'
  diagnostic: 'The LoadBalancer path does not work yet. Run kubectl get service dispatch-public: an EXTERNAL-IP
    of <pending> means no address was given out. If it has an address, check its selector matches app=dispatch
    and its targetPort is 8080, then try the docker run wget test from the lesson.'
- id: routing-tls
  title: HTTPS to dispatch.test passes certificate checks and reaches Dispatch
  explanation: A request to https://dispatch.test must be trusted, match the hostname, and be routed to
    Dispatch by the Ingress.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - tls
  expected: 'true'
  diagnostic: 'The HTTPS request failed. Run the curl command from the lesson and read its error: a certificate
    error points at the Ingress’s tls secretName, which should be dispatch-tls; a 404 or 502 points at
    the rule’s backend, which should be Service dispatch port 8080. kubectl describe ingress dispatch
    shows both.'
- id: routing-gateway
  title: The HTTPRoute is attached and carries traffic
  explanation: The route must be Accepted with ResolvedRefs on dispatch-gateway, the Gateway must be Programmed,
    and a request for gateway.dispatch.test must reach Dispatch.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - gateway
  expected: 'true'
  diagnostic: 'The Gateway path does not work yet. Run kubectl describe httproute dispatch and read the
    conditions under Status > Parents: a missing parent means parentRefs should name dispatch-gateway;
    ResolvedRefs False means the backendRefs Service or port is wrong (Service dispatch, port 8080).'
- id: routing-host-boundary
  title: An unmatched hostname gets a 404
  explanation: A request for unmatched.dispatch.test must not reach Dispatch, showing the route matches
    only its own hostname.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - routing
    timeout: 90
  expectation: json
  json_path:
  - host_boundary
  expected: 'true'
  diagnostic: A request for unmatched.dispatch.test did not return 404. Check the HTTPRoute lists only
    gateway.dispatch.test under hostnames, with no wildcard, and that no other route catches every hostname.
capabilities:
- docker
- kind
- kubectl
- calico
- loadbalancer
- routing
checkpoint: dispatch-routing-v1
images:
- python
- postgres
- redis
- busybox
- metallb_controller
- metallb_speaker
- traefik
alternatives:
- Equivalent selectors, named target ports, and manifests are accepted when the required live endpoint
  and route behavior is demonstrated.
failure_modes:
- An assigned external IP or accepted manifest does not prove application traffic works.
- Bypassing certificate verification does not demonstrate correct TLS identity.
starter_failure_checks:
- routing-loadbalancer
- routing-tls
- routing-gateway
