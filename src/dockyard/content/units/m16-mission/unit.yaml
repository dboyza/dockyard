id: m16-mission
revision: 2
module: 16
order: 4
title: 'Mission: a working delivery process'
summary: Repair the test gate and GitOps, then prove promotion and recovery end to end.
kind: mission
runtime: kubernetes
minutes: 65
outcomes:
- Connect tested images, Git history, and running Pods.
- Show drift repair, promotion, and a Git-based recovery.
- Write notes someone else could follow.
prerequisites:
- m16-promotion
objectives:
- platform.delivery
- kubernetes.packaging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: What shows a recovery will last?
  options:
  - A revert commit that Flux applied, checked through the running service.
  - An uncommitted local edit.
  - A running controller, without checking its revision.
  correct: 0
  explanation: The declared state in Git and the running service must agree for the recovery to stick.
hints:
- 'Start at the beginning of the chain: the test gate, then Flux, then the running release.'
- run_tests must be true, and both Flux Kustomizations must not be suspended.
- After python pipeline.py and python gitops.py wait, run python delivery-proof.py and check the history.
sources:
- https://docs.docker.com/reference/cli/docker/image/push/
- https://git-scm.com/docs/git-revert
- https://fluxcd.io/flux/components/source/gitrepositories/
- https://fluxcd.io/flux/components/kustomize/kustomizations/
- https://kind.sigs.k8s.io/docs/user/local-registry/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: delivery-pipeline
  title: The published image passed its tests
  explanation: release.json must record a tested release whose digest matches the registry, the tests
    must pass again against that exact image, and its source fingerprints must match the current files.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - pipeline
  expected: 'true'
  diagnostic: 'The published release is untested or out of date. Check run_tests is true in pipeline.json
    and run python pipeline.py again. If you edited source files or tests after publishing, the fingerprints
    in release.json no longer match: publish again.'
- id: delivery-reconciliation
  title: Git and Flux agree on a healthy release
  explanation: The delivery repository must be clean and pushed, Flux must have fetched that commit, and
    both environments must be Ready and running the image by digest.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - reconciliation
  expected: 'true'
  diagnostic: Git, Flux, and the cluster do not agree yet. Check git -C delivery status (commit and push
    any changes), then kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n flux-system for suspend
    and Ready, and run python gitops.py wait.
- id: delivery-identity
  title: Flux’s deployer has only the access it needs
  explanation: dispatch-deployer must be able to update Deployments in dispatch, but not read Secrets
    or change kube-system.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: The deployer’s permissions are wrong. Check with kubectl auth can-i patch deployments --as=system:serviceaccount:flux-system:dispatch-deployer
    -n dispatch, and the same for get secrets and for -n kube-system. Keep its Role narrow.
- id: delivery-workflow
  title: The delivered API finishes a real job
  explanation: Dockyard submits a job through the delivered API and checks the database stores the worker’s
    result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the delivered API and worker Pods are ready with kubectl
    get pods, and read their logs.
- id: delivery-drift
  title: Flux undid a manual change
  explanation: delivery-evidence.json must show the development Deployment being scaled by hand and Flux
    restoring the declared count.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - drift
  expected: 'true'
  diagnostic: No drift repair is recorded. Once both environments are Ready, run python delivery-proof.py
    and read delivery-evidence.json.
- id: delivery-promotion
  title: Staging runs the digest tested in development
  explanation: The promotion must move the exact dispatch-3 digest from development to staging in its
    own commit.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - promotion
  expected: 'true'
  diagnostic: Staging is not running the digest that was tested in development. Compare the image digests
    in git -C delivery log -p for both environments, and rerun python delivery-proof.py after fixing earlier
    steps.
- id: delivery-rollback
  title: A git revert recovered a real failed pull
  explanation: The history must contain a bad candidate that failed with ErrImagePull or ImagePullBackOff,
    followed by a new revert commit that restored the working release.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - rollback
  expected: 'true'
  diagnostic: The failed candidate or its revert is missing. Recovery must be a new commit made with git
    revert, not a reset or a kubectl rollout undo. Check git -C delivery log and rerun python delivery-proof.py.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- delivery
checkpoint: dispatch-delivery-v1
images:
- python
- postgres
- redis
- busybox
- git
- registry
- flux_source
- flux_kustomize
alternatives:
- Equivalent Git commit messages and YAML formatting are accepted; actual digest selection, ancestry,
  and running behavior determine completion.
- Use the supplied rehearsal or equivalent ordinary commands while preserving the measured evidence contract.
failure_modes:
- A skipped test gate can publish an unverified candidate.
- A healthy Git source cannot update a suspended release.
- A live rollback is overwritten if the bad Git source remains.
starter_failure_checks:
- delivery-pipeline
- delivery-reconciliation
- delivery-workflow
- delivery-drift
- delivery-promotion
- delivery-rollback
