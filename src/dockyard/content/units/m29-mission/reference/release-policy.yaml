# Production admits only images from the release registry, pinned by digest.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: release-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: containers
    expression: "object.kind == 'Pod' ? object.spec.containers : object.spec.template.spec.containers"
  validations:
  - expression: "variables.containers.all(c, c.image.startsWith('REGISTRY/') && c.image.contains('@sha256:'))"
    message: Production images must come from the release registry, pinned by digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: release-images
spec:
  policyName: release-images
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: production
