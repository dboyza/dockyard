id: m16-gitops
revision: 2
module: 16
order: 2
title: GitOps with Flux
summary: Resume Flux so it applies the release declared in a local Git repository.
kind: lesson
runtime: kubernetes
minutes: 45
outcomes:
- Follow a commit through Flux’s source and apply steps.
- Read Flux’s revisions and Ready conditions.
- Explain how a limited ServiceAccount constrains what Flux applies.
prerequisites:
- m16-pipeline
objectives:
- platform.delivery
- kubernetes.packaging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: Flux fetched the newest commit, but its Kustomization is suspended. What changes in the cluster?
  options:
  - Nothing new is applied; running workloads stay as they are.
  - Every Pod gets the new image.
  - The workloads are deleted.
  correct: 0
  explanation: Fetching and applying are separate steps. Suspension pauses applying without removing anything.
hints:
- kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n flux-system shows whether each environment
  is suspended.
- 'Set suspend: false for both environments in flux.yaml.'
- Apply flux.yaml through render.py, then run python gitops.py wait and compare with git -C delivery rev-parse
  HEAD.
sources:
- https://docs.docker.com/reference/cli/docker/image/push/
- https://git-scm.com/docs/git-revert
- https://fluxcd.io/flux/components/source/gitrepositories/
- https://fluxcd.io/flux/components/kustomize/kustomizations/
- https://kind.sigs.k8s.io/docs/user/local-registry/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - run.sh
  timeout: 420
checks:
- id: delivery-pipeline
  title: The published image passed its tests
  explanation: release.json must record a tested release whose digest matches the registry, the tests
    must pass again against that exact image, and its source fingerprints must match the current files.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - pipeline
  expected: 'true'
  diagnostic: 'The published release is untested or out of date. Check run_tests is true in pipeline.json
    and run python pipeline.py again. If you edited source files or tests after publishing, the fingerprints
    in release.json no longer match: publish again.'
- id: delivery-reconciliation
  title: Git and Flux agree on a healthy release
  explanation: The delivery repository must be clean and pushed, Flux must have fetched that commit, and
    both environments must be Ready and running the image by digest.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - reconciliation
  expected: 'true'
  diagnostic: Git, Flux, and the cluster do not agree yet. Check git -C delivery status (commit and push
    any changes), then kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n flux-system for suspend
    and Ready, and run python gitops.py wait.
- id: delivery-identity
  title: Flux’s deployer has only the access it needs
  explanation: dispatch-deployer must be able to update Deployments in dispatch, but not read Secrets
    or change kube-system.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - identity
  expected: 'true'
  diagnostic: The deployer’s permissions are wrong. Check with kubectl auth can-i patch deployments --as=system:serviceaccount:flux-system:dispatch-deployer
    -n dispatch, and the same for get secrets and for -n kube-system. Keep its Role narrow.
- id: delivery-workflow
  title: The delivered API finishes a real job
  explanation: Dockyard submits a job through the delivered API and checks the database stores the worker’s
    result.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - delivery
    timeout: 180
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A new job was not completed. Check the delivered API and worker Pods are ready with kubectl
    get pods, and read their logs.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
- delivery
checkpoint: dispatch-delivery-v1
images:
- python
- postgres
- redis
- busybox
- git
- registry
- flux_source
- flux_kustomize
alternatives:
- Equivalent Git commit messages and YAML formatting are accepted; actual digest selection, ancestry,
  and running behavior determine completion.
- Use the supplied rehearsal or equivalent ordinary commands while preserving the measured evidence contract.
failure_modes:
- A skipped test gate can publish an unverified candidate.
- A healthy Git source cannot update a suspended release.
- A live rollback is overwritten if the bad Git source remains.
starter_failure_checks:
- delivery-reconciliation
- delivery-workflow
