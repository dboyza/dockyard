id: i09-egress-regression
revision: 1
module: 17
order: 90
title: A policy clean-up stalls requests and worker retries
summary: After an egress policy edit, requests fail and the workers keep retrying, although the frontend
  still reaches the API address.
kind: incident
runtime: kubernetes
nodes: 2
minutes: 40
outcomes:
- Tell a DNS failure apart from a blocked dependency port.
- Restore outgoing traffic with narrow rules that keep everything else blocked.
- Prove the fix with a real job and the blocked paths.
prerequisites:
- m17-mission
objectives:
- cka.network-policy
- ckad.network-policy
- ckad.debugging
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The frontend reaches the API by address, but names do not resolve. What is the most likely
    cause?
  options:
  - DNS egress on port 53 is blocked.
  - The API is down.
  - The database password changed.
  correct: 0
  explanation: A working connection by address rules out the API being down; failing lookups point at
    DNS traffic being blocked.
hints:
- Separate numeric-address connections from DNS queries and trace API and worker egress independently.
- Check both DNS transports, then compare each allowed dependency port with its Service and actual listener.
- Allow DNS (UDP and TCP 53) to CoreDNS and TCP 6379 from the workers to the queue, keeping the default-deny
  policy and the other rules as they are.
sources:
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://kubernetes.io/docs/concepts/services-networking/network-policies/
- https://kubernetes.io/docs/concepts/security/pod-security-standards/
- https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - kind
  - load
  - docker-image
  - '{{image}}'
  - --name
  - '{{cluster}}'
  timeout: 180
- args:
  - /bin/sh
  - prepare.sh
  timeout: 420
checks:
- id: security-network
  title: Allowed and blocked connections match the intended rules
  explanation: 'Across two nodes, the trusted frontend must reach the API. These connections must all
    be blocked: the untrusted frontend, a trusted label in the wrong namespace, frontend-to-database,
    and API-to-outside-target.'
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - network
  expected: 'true'
  diagnostic: At least one connection is allowed or blocked wrongly. Use --json with Check work to see
    which. If the wrong-namespace client gets through, check that the namespaceSelector and podSelector
    are in the same from item. If an allowed path fails, check the matching egress and ingress rules and
    their exact ports.
- id: security-dns
  title: DNS works over both UDP and TCP
  explanation: Real DNS lookups for the database must succeed over UDP and over TCP under the default-deny
    policy.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - dns
  expected: 'true'
  diagnostic: A DNS lookup failed. The DNS egress rule must allow port 53 over both UDP and TCP to the
    CoreDNS Pods in kube-system.
- id: security-workflow
  title: A job from the trusted frontend completes
  explanation: A real job submitted from the trusted frontend must be completed by a worker and saved
    in PostgreSQL.
  command:
    args:
    - python
    - -m
    - dockyard.probes.kubernetes
    - security
    timeout: 120
  expectation: json
  json_path:
  - workflow
  expected: 'true'
  diagnostic: A job from the trusted frontend did not complete. Check the API and workers can reach PostgreSQL
    and Redis on their exact ports, that DNS works, and read kubectl logs deployment/worker.
- id: incident-preserved
  title: The original namespace, database storage, and job are still there
  explanation: The fix must not replace the namespace or database claim, or lose the job stored before
    the incident.
  command:
    args:
    - python
    - -m
    - dockyard.probes.incident
    - network
    timeout: 90
  expectation: json
  json_path:
  - preserved
  expected: 'true'
  diagnostic: The original namespace, the database’s claim, or the original job is gone. If they were
    deleted or replaced, reset the lab and repair it in place instead.
capabilities:
- docker
- kind
- kubectl
- calico
- local-path-storage
checkpoint: dispatch-security-v1
images:
- python
- postgres
- redis
- busybox
alternatives:
- Equivalent additive policy organization and YAML formatting are accepted when the actual allowed and
  denied paths agree.
- A different non-root API UID is accepted when process restrictions and application behavior remain correct.
failure_modes:
- Separate peer items broaden selectors from an intersection to alternatives.
- UDP-only DNS can fail when a TCP query is needed.
- Changing admission policy does not repair existing Pods.
starter_failure_checks:
- security-network
- security-dns
- security-workflow
