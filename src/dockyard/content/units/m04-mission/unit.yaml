id: m04-mission
revision: 1
module: 4
order: 4
title: 'Mission: rescue data before replacing the container'
summary: Move a job out of a container’s own storage into a volume, without losing it.
kind: mission
runtime: docker
minutes: 50
outcomes:
- Back up data before removing the only container that holds it.
- Create a labeled volume and restore the data into it.
- Confirm the original job survived and new jobs can still be saved.
prerequisites:
- m04-recovery
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: The only copy of the database is inside the current container. What should you do first?
  options:
  - Make a backup before removing the container.
  - Remove the container, then create a volume.
  - Rebuild the image, which will contain the jobs.
  correct: 0
  explanation: Data written by a running container lives in that container only. It is not in the image,
    and removing the container deletes it.
hints:
- 'Check where /data currently lives: does the container have any mounts at all?'
- Stop the API before copying jobs.db. docker cp works on stopped containers.
- Archive jobs.db, restore it into a new labeled volume with owner 10001, then replace the API using that
  volume.
sources:
- https://docs.docker.com/engine/storage/bind-mounts/
- https://docs.docker.com/engine/storage/volumes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
- args:
  - docker
  - exec
  - --user
  - '0'
  - '{{container}}'
  - python
  - -c
  - import sqlite3,os; c=sqlite3.connect("/data/jobs.db"); c.execute("CREATE TABLE IF NOT EXISTS jobs(id
    TEXT PRIMARY KEY,title TEXT NOT NULL)"); c.execute("INSERT OR REPLACE INTO jobs VALUES(?,?)",("recovery-{{lab_id}}","Preserve
    this original job")); c.commit(); c.close(); os.chown("/data",10001,10001); os.chown("/data/jobs.db",10001,10001)
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: Dockyard can only test the application while its container is running.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: The assigned container is not running. Run docker ps -a to see its status, then docker logs
    "$DOCKYARD_CONTAINER" to read why it stopped. A container stops when its main command finishes or
    crashes, so the last lines of the log usually explain it.
- id: lab-identity
  title: The container belongs to this lab
  explanation: The io.dockyard.lab label marks the container as part of this lab, so Dockyard can inspect
    and clean it up without touching your other containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: The container is missing this lab's label, or has a different value. Labels cannot be added
    to an existing container, so remove the assigned container and run it again with --label "io.dockyard.lab=$DOCKYARD_LAB".
- id: application-response
  title: A request reaches the real API
  explanation: A running container is not enough; Dispatch must answer a real HTTP request sent to your
    assigned port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: No valid Dispatch response came back from http://127.0.0.1:$DOCKYARD_PORT/healthz. Run that
    curl request yourself, then compare docker port "$DOCKYARD_CONTAINER" with the listening address in
    docker logs. The app listens on 8080 inside the container; your host port is $DOCKYARD_PORT. If the
    logs are empty, the app may still be starting.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The answer must come from this container, so its port 8080 must be published on your assigned
    host port.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: This container does not publish container port 8080 on $DOCKYARD_PORT. Run docker port "$DOCKYARD_CONTAINER"
    to see what it publishes. Port mappings are fixed when a container is created, so replace the container
    with -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: loopback-binding
  title: Only the local host computer can reach the published port
  explanation: Publishing on 127.0.0.1 keeps the practice API reachable from your own computer only, not
    from other machines on your network.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: The port is published on an address other than 127.0.0.1. Run docker port "$DOCKYARD_CONTAINER";
    if it shows 0.0.0.0 or ::, the host address was left out of -p. Replace the container using -p "127.0.0.1:$DOCKYARD_PORT:8080".
- id: storage-mount
  title: The expected writable storage is mounted at /data
  explanation: Dispatch keeps its database in /data, so that path must be backed by the storage this task
    asks for, and it must be writable.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - mount
  expected: 'true'
  diagnostic: /data is not mounted from the expected storage, or it is read-only. Run docker inspect --format
    '{{json .Mounts}}' "$DOCKYARD_CONTAINER" and check the Type, Source or Name, Destination, and RW fields
    against the task. Mounts are fixed at creation, so replace the container to change them.
- id: storage-roundtrip
  title: The API can create and read a new job
  explanation: Dockyard submits a new job through the API and reads it back to confirm storage really
    works.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - roundtrip
  expected: 'true'
  diagnostic: The API could not save and then list a new job. Submit one yourself with curl and read the
    error message, then check docker logs. "unable to open database file" usually means the process user
    cannot write to /data; compare docker exec "$DOCKYARD_CONTAINER" id with docker exec "$DOCKYARD_CONTAINER"
    ls -ldn /data.
- id: storage-durable
  title: A separate read-only container observes the committed job
  explanation: A separate read-only container opens the same storage and finds the new job, which shows
    the data lives outside the API container.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: The new job was not found when Dockyard read the storage from a separate container. This
    usually means the API is writing to a different location than the mounted storage. Check that the
    mount target is exactly /data.
- id: storage-restored
  title: The original seeded job is present in the restored data
  explanation: The job created before the incident must be present after your restore, not just new jobs.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: 'The original recovery-$DOCKYARD_LAB job is missing from the API''s database. Request /jobs
    to see what the API holds. An empty list usually means the API started with a fresh database instead
    of the restored one: check that you extracted the archive into the same storage the API mounts at
    /data, and that the API was stopped while you did.'
- id: storage-backup
  title: The backup archive contains a usable database with that original job
  explanation: Dockyard opens backup.tar and checks it contains a readable database with the original
    job, because a backup you cannot restore is not a backup.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - backup
  expected: 'true'
  diagnostic: backup.tar is missing from the workspace, or does not contain jobs.db with the original
    job at its root. List it with tar -tf backup.tar; the only entry should be jobs.db. Create it from
    the stopped database with -C pointing at the directory that holds jobs.db.
capabilities:
- docker
- python-image
checkpoint: dispatch-storage-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- storage-mount
- storage-roundtrip
- storage-durable
- storage-restored
- storage-backup
