id: m04-mission
revision: 1
module: 4
order: 4
title: 'Mission: rescue data before replacing the container'
summary: "Migrate an existing job out of a container\u2019s writable layer and prove it survived replacement."
kind: mission
runtime: docker
minutes: 50
outcomes:
- Preserve original data before removing its only container copy.
- Create and restore into an owned named volume.
- Verify the recovered record and continued write behavior.
prerequisites:
- m04-recovery
objectives:
- docker.mission
concept: concept.md
brief: brief.md
debrief: debrief.md
prediction:
  question: "The only database is in the current container\u2019s writable layer. Which action belongs first?"
  options:
  - Obtain a consistent backup before removing the container.
  - Remove the container and create a volume afterward.
  - Rebuild the image and assume it contains the jobs.
  correct: 0
  explanation: Runtime data in a writable layer is not automatically part of the image or a future volume.
hints:
- Inspect the original container mounts and find where /data currently lives.
- Stop the API cleanly before copying its SQLite file; docker cp works on a stopped container.
- Archive jobs.db, restore it into the labeled named volume with suitable ownership, then recreate the API using
  that volume.
sources:
- https://docs.docker.com/engine/storage/bind-mounts/
- https://docs.docker.com/engine/storage/volumes/
starter: {}
reference: {}
prepare:
- args:
  - docker
  - build
  - --build-arg
  - BASE_IMAGE={{python_image}}
  - -t
  - '{{image}}'
  - .
  timeout: 300
- args:
  - docker
  - run
  - -d
  - --name
  - '{{container}}'
  - --label
  - io.dockyard.lab={{lab_id}}
  - -p
  - 127.0.0.1:{{port}}:8080
  - '{{image}}'
- args:
  - docker
  - exec
  - --user
  - '0'
  - '{{container}}'
  - python
  - -c
  - import sqlite3,os; c=sqlite3.connect("/data/jobs.db"); c.execute("CREATE TABLE IF NOT EXISTS jobs(id TEXT PRIMARY
    KEY,title TEXT NOT NULL)"); c.execute("INSERT OR REPLACE INTO jobs VALUES(?,?)",("recovery-{{lab_id}}","Preserve
    this original job")); c.commit(); c.close(); os.chown("/data",10001,10001); os.chown("/data/jobs.db",10001,10001)
checks:
- id: process-running
  title: Dispatch's container is running
  explanation: The container must still be running when its application is checked.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - State
  - Running
  expected: 'true'
  diagnostic: Inspect docker ps -a and docker logs for the assigned container. A container stops when its main process
    exits.
- id: lab-identity
  title: The container belongs to this lab
  explanation: A dedicated label lets Dockyard recognize the resource without touching unrelated containers.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - Config
  - Labels
  - io.dockyard.lab
  expected: '{{lab_id}}'
  diagnostic: Recreate this lab's container with the io.dockyard.lab label shown in the example. Do not label an
    unrelated container.
- id: application-response
  title: A request reaches the real API
  explanation: A running process alone is insufficient; the application must respond through the published port.
  command:
    args:
    - curl
    - --fail
    - --silent
    - --show-error
    - --max-time
    - '3'
    - http://127.0.0.1:{{port}}/healthz
  expectation: json
  json_path:
  - service
  expected: dispatch
  diagnostic: Inspect the published port and logs. The host port is DOCKYARD_PORT; the process inside the container
    listens on 8080.
- id: published-port
  title: The assigned endpoint belongs to this container
  explanation: The responding host port must actually be published by the assessed container.
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  json_path:
  - '0'
  - NetworkSettings
  - Ports
  - 8080/tcp
  - '0'
  - HostPort
  expected: '{{port}}'
  diagnostic: Publish the assigned host port to port 8080 inside this lab's container.
- id: loopback-binding
  title: Only the local Mac can reach the published port
  explanation: Only the local Mac can reach the published port
  command:
    args:
    - docker
    - inspect
    - '{{container}}'
  expectation: json
  expected: 127.0.0.1
  json_path:
  - '0'
  - HostConfig
  - PortBindings
  - 8080/tcp
  - '0'
  - HostIp
  diagnostic: Inspect the container and its logs, then compare the observation with the task contract.
- id: storage-mount
  title: The expected writable storage is mounted at /data
  explanation: Inspect the mount and perform real application and independent database reads.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - mount
  expected: 'true'
  diagnostic: Inspect /data mount identity and permissions, then POST and GET /jobs. Recovery also requires the
    original job and a valid backup.tar.
- id: storage-roundtrip
  title: The API can create and read a new job
  explanation: Inspect the mount and perform real application and independent database reads.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - roundtrip
  expected: 'true'
  diagnostic: Inspect /data mount identity and permissions, then POST and GET /jobs. Recovery also requires the
    original job and a valid backup.tar.
- id: storage-durable
  title: A separate read-only container observes the committed job
  explanation: Inspect the mount and perform real application and independent database reads.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - durable
  expected: 'true'
  diagnostic: Inspect /data mount identity and permissions, then POST and GET /jobs. Recovery also requires the
    original job and a valid backup.tar.
- id: storage-restored
  title: The original seeded job is present in the restored data
  explanation: Inspect the mount and perform real application and independent database reads.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - restored
  expected: 'true'
  diagnostic: Inspect /data mount identity and permissions, then POST and GET /jobs. Recovery also requires the
    original job and a valid backup.tar.
- id: storage-backup
  title: The backup archive contains a usable database with that original job
  explanation: Inspect the mount and perform real application and independent database reads.
  command:
    args:
    - python
    - -m
    - dockyard.probes.docker
    - storage-recovery
    timeout: 45
  expectation: json
  json_path:
  - backup
  expected: 'true'
  diagnostic: Inspect /data mount identity and permissions, then POST and GET /jobs. Recovery also requires the
    original job and a valid backup.tar.
capabilities:
- docker
- python-image
checkpoint: dispatch-storage-v1
alternatives:
- Equivalent Docker commands are accepted when the resulting behavior meets every criterion.
failure_modes:
- A running container with the wrong application or endpoint does not satisfy the contract.
starter_failure_checks:
- storage-mount
- storage-roundtrip
- storage-durable
- storage-restored
- storage-backup
