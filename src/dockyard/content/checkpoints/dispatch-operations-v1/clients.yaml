          type: RuntimeDefault
      volumes:
      - name: scratch
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: egress-target
  namespace: dockyard-observer
spec:
  selector:
    app: egress-target
  ports:
  - port: 8080
    targetPort: 8080
