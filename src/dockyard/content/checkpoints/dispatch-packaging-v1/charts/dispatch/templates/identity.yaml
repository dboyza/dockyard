apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-app
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-reader
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatch-pod-reader
  namespace: {{ .Release.Namespace | quote }}
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatch-pod-reader
  namespace: {{ .Release.Namespace | quote }}
subjects:
- kind: ServiceAccount
  name: dispatch-reader
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatch-pod-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      serviceAccountName: dispatch-reader
      enableServiceLinks: false
      containers:
      - name: client
        image: {{ required "An application image is required" .Values.images.app | quote }}
        imagePullPolicy: Never
        command:
        - python
        - -c
        - import time; time.sleep(86400)
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
