apiVersion: batch/v1
kind: CronJob
metadata:
  name: dispatch-maintenance
  namespace: {{ .Release.Namespace | quote }}
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: dispatch-maintenance
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          containers:
          - name: maintenance
            image: {{ required "An application image is required" .Values.images.app | quote }}
            imagePullPolicy: Never
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 300m
                memory: 192Mi
            command:
            - python
            - maintenance.py
            env:
            - name: DB_HOST
              value: db
            - name: REDIS_URL
              value: redis://queue:6379/0
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: DB_PASSWORD_FILE
              value: /var/run/dispatch/password
            - name: DISPATCH_ENV
              valueFrom:
                configMapKeyRef:
                  name: dispatch-settings
                  key: environment
            volumeMounts:
            - name: database-credential
              mountPath: /var/run/dispatch
              readOnly: true
          serviceAccountName: dispatch-app
          automountServiceAccountToken: false
          volumes:
          - name: database-credential
            secret:
              secretName: dispatch-database
              defaultMode: 292
