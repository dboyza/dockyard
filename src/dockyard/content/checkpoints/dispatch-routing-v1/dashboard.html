<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101720;color:#e6edf5;font:15px/1.6 system-ui,sans-serif}main{max-width:900px;margin:64px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b394a;padding-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:0}small,p{color:#9eb0c5}.status{font-size:12px;color:#a8dcbe}form{display:flex;gap:12px;margin:32px 0}input,button{font:inherit;border-radius:7px;padding:12px;border:1px solid #415167}input{background:#17212e;color:inherit;flex:1;min-width:0}button{background:#316baa;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #aed1ff;outline-offset:3px}article{padding:18px 0;border-bottom:1px solid #293646;display:flex;gap:18px;justify-content:space-between}article strong{display:block;overflow-wrap:anywhere}article code{font-size:11px;color:#9eb0c5;overflow-wrap:anywhere}.badge{font-size:11px;color:#a8dcbe;white-space:nowrap}#error{color:#ffb4a9}footer{margin-top:40px;color:#9eb0c5;font-size:12px}</style></head>
<body><main><header><div><small>YOUR OPERATING SYSTEM IN PRACTICE</small><h1>Dispatch</h1></div><span class="status" id="status">Connecting</span></header><p>Submit a job. Follow it from the API through the queue and worker into durable storage.</p><form id="submit"><label for="title" style="position:absolute;left:-10000px">Job title</label><input id="title" placeholder="What needs processing?" required maxlength="200"><button>Submit job</button></form><p id="error" role="alert"></p><section id="jobs" aria-label="Recent jobs"></section><footer>API · Redis notifications · Background worker · PostgreSQL</footer></main>
<script>
const jobs=document.getElementById('jobs'), status=document.getElementById('status'), error=document.getElementById('error');
async function refresh(){try{const [health,response]=await Promise.all([fetch('/readyz'),fetch('/jobs')]);status.textContent=health.ok?'Dependencies ready':'Dependencies unavailable';if(!response.ok)throw Error('The API cannot read job storage.');const data=await response.json();jobs.replaceChildren();for(const job of data.jobs){const row=document.createElement('article'),info=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('code'),badge=document.createElement('span');title.textContent=job.title;detail.textContent=job.id+(job.worker?' · '+job.worker:'');badge.textContent=job.status;badge.className='badge';info.append(title,detail);row.append(info,badge);jobs.append(row);}if(!data.jobs.length)jobs.textContent='No jobs yet. Your first submission will appear here.';}catch(e){status.textContent='Connection interrupted';error.textContent=e.message;}}
document.getElementById('submit').addEventListener('submit',async event=>{event.preventDefault();const input=document.getElementById('title');try{const response=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});if(!response.ok)throw Error((await response.json()).error);input.value='';error.textContent='';await refresh();}catch(e){error.textContent=e.message;}});refresh();setInterval(refresh,2000);
</script></body></html>
