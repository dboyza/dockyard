apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: dispatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: dispatch
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: dispatch
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: dispatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: ${DOCKYARD_PROMETHEUS_LOCAL_IMAGE}
        imagePullPolicy: Never
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
        - --storage.tsdb.retention.size=64MB
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dispatch
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-dashboard
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-dashboard
  template:
    metadata:
      labels:
        app: metrics-dashboard
    spec:
      containers:
      - name: dashboard
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: Never
        command:
        - python
        - metrics_dashboard.py
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
        volumeMounts:
        - name: config
          mountPath: /dashboard
          readOnly: true
      automountServiceAccountToken: false
      volumes:
      - name: config
        configMap:
          name: metrics-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-dashboard
  namespace: dispatch
spec:
  type: NodePort
  selector:
    app: metrics-dashboard
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-load
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-load
  template:
    metadata:
      labels:
        app: observability-load
    spec:
      containers:
      - name: client
        image: ${DOCKYARD_IMAGE}
        imagePullPolicy: Never
        command:
        - python
        - -c
        - "import time,urllib.request\nwhile True:\n    try:\n        with urllib.request.urlopen('http://dispatch:8080/jobs',timeout=3)\
          \ as response: response.read()\n    except Exception: pass\n    time.sleep(.15)\n"
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
      automountServiceAccountToken: false
